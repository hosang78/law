<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>계약 규정 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #13253A; --ink-2: #3C4E61; --mute: #66778A;
  --foam: #EDF2F5; --paper: #FFFFFF; --paper-2: #F6F9FB;
  --line: #D6DEE5; --line-2: #E6ECF1;
  --tide: #1C5D8C; --tide-ink: #FFFFFF; --tide-soft: #DCE9F3;
  --seal: #B42318; --seal-soft: #FBE9E7;
  --kelp: #2F6F5E; --warn: #9A6200;
  --shadow: 0 1px 2px rgba(19,37,58,.06), 0 8px 24px rgba(19,37,58,.08);
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --serif: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --toc-w: 300px; --viewer-w: 440px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ink: #E3EAF1; --ink-2: #B9C6D3; --mute: #8B9AAB;
  --foam: #0C1824; --paper: #122233; --paper-2: #0F1D2C;
  --line: #24384C; --line-2: #1C2E40;
  --tide: #6FA8D6; --tide-ink: #0C1824; --tide-soft: #1A3550;
  --seal: #F0806F; --seal-soft: #3A1E1C;
  --kelp: #6CC2A6; --warn: #E3B04B;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #E3EAF1; --ink-2: #B9C6D3; --mute: #8B9AAB;
    --foam: #0C1824; --paper: #122233; --paper-2: #0F1D2C;
    --line: #24384C; --line-2: #1C2E40;
    --tide: #6FA8D6; --tide-ink: #0C1824; --tide-soft: #1A3550;
    --seal: #F0806F; --seal-soft: #3A1E1C;
    --kelp: #6CC2A6; --warn: #E3B04B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 15px/1.65 var(--sans); color: var(--ink); background: var(--foam); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--tide); outline-offset: 2px; border-radius: 6px; }
svg { width: 18px; height: 18px; flex: none; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--toc-w) minmax(0, 1fr) 0; height: 100dvh; transition: grid-template-columns .28s ease; }
.shell.viewing { grid-template-columns: var(--toc-w) minmax(0, 1fr) var(--viewer-w); }

/* ---------- table of contents ---------- */
.toc { background: var(--paper); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.toc-head { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.brand { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--tide); color: var(--tide-ink); display: grid; place-items: center; }
.brand-mark svg { width: 22px; height: 22px; }
.brand strong { display: block; font-size: 16px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
.brand span { display: block; font-size: 12.5px; color: var(--mute); line-height: 1.4; }
.doc-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 14px 12px; }
.doc-tabs button { text-align: left; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); font-size: 13.5px; font-weight: 500; line-height: 1.35; }
.doc-tabs button small { display: block; font-size: 11.5px; font-weight: 400; color: var(--mute); margin-top: 2px; }
.doc-tabs button[aria-selected="true"] { border-color: var(--tide); background: var(--tide-soft); color: var(--ink); }
.toc-search { margin: 0 14px 10px; display: flex; align-items: center; gap: 8px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-2); color: var(--mute); }
.toc-search input { flex: 1; border: 0; background: none; outline: none; padding: 9px 0; font-size: 13.5px; color: var(--ink); min-width: 0; }
.toc-list { flex: 1; overflow-y: auto; padding: 4px 8px 24px; overscroll-behavior: contain; }
.toc-group { margin: 2px 0; }
.toc-group > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 8px 8px 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); border-radius: 6px; }
.toc-group > summary::-webkit-details-marker { display: none; }
.toc-group > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; margin: 0 3px 1px 2px; }
.toc-group[open] > summary::before { transform: rotate(45deg); }
.toc-group > summary .count { margin-left: auto; font-weight: 400; color: var(--mute); font-size: 11.5px; }
.toc-item { display: flex; gap: 8px; width: 100%; text-align: left; padding: 6px 8px 6px 22px; border-radius: 7px; font-size: 13.5px; line-height: 1.45; color: var(--ink); }
.toc-item:hover { background: var(--paper-2); }
.toc-item.active { background: var(--tide-soft); }
.toc-item .num { flex: none; min-width: 58px; color: var(--seal); font-weight: 500; font-size: 12.5px; padding-top: 1px; }
.toc-item .ttl { min-width: 0; }
.toc-empty { padding: 20px 14px; color: var(--mute); font-size: 13px; }

/* ---------- chat column ---------- */
.chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.bar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--foam) 88%, transparent); backdrop-filter: blur(8px); }
.scope { display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--paper); border: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.scope button { padding: 5px 12px; border-radius: 8px; font-size: 13px; white-space: nowrap; color: var(--ink-2); }
.scope button[aria-checked="true"] { background: var(--ink); color: var(--paper); }
.bar-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--ink-2); }
.icon-btn:hover { background: var(--paper); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px; background: var(--tide); color: var(--tide-ink); font-size: 13.5px; font-weight: 500; }
.pill:hover { filter: brightness(1.08); }
.only-mobile { display: none; }

.index-status { display: flex; align-items: center; gap: 9px; padding: 7px 20px; font-size: 12.5px; color: var(--mute); border-bottom: 1px solid var(--line-2); }
.index-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
.index-status.ready .dot { background: var(--kelp); }
.index-status.error .dot { background: var(--seal); }
.index-status .more { color: var(--mute); }
.index-status .progress { width: 120px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-left: auto; flex: none; }
.index-status .progress i { display: block; height: 100%; width: 0; background: var(--tide); transition: width .3s; }
.index-status.ready .progress, .index-status.error .progress { display: none; }
.index-status.ready { display: none; }

.messages { flex: 1; overflow-y: auto; padding: 28px 20px 16px; scroll-behavior: smooth; }
.thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }

/* empty state */
.welcome { max-width: 760px; margin: 6vh auto 0; }
.welcome h1 { font: 600 30px/1.3 var(--sans); letter-spacing: -.02em; margin: 0 0 8px; }
.welcome p.lead { margin: 0 0 26px; color: var(--ink-2); max-width: 56ch; }
.ask-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ask-list li { border-bottom: 1px solid var(--line); }
.ask-list button { width: 100%; display: flex; align-items: center; gap: 14px; padding: 13px 4px; text-align: left; font-size: 15px; }
.ask-list button:hover .q { color: var(--tide); }
.ask-list .q { flex: 1; }
.welcome .hint { margin-top: 18px; font-size: 13px; color: var(--mute); display: flex; align-items: center; gap: 7px; }

/* stamp: 조문 인용 표시 */
.stamp { display: inline-flex; align-items: baseline; gap: 4px; padding: 1px 7px 1px 6px; border: 1.5px solid var(--seal); border-radius: 5px; color: var(--seal); font-size: 12.5px; font-weight: 500; line-height: 1.5; white-space: nowrap; background: transparent; }
.stamp small { font-size: 11px; font-weight: 400; opacity: .85; }
button.stamp:hover { background: var(--seal-soft); }
.cite { display: inline; padding: 0 1px; margin: 0; border-bottom: 1.5px solid var(--seal); color: var(--seal); font-weight: 500; border-radius: 3px 3px 0 0; }
.cite:hover { background: var(--seal-soft); }

/* messages */
.msg-user { align-self: flex-end; max-width: 82%; background: var(--tide); color: var(--tide-ink); padding: 10px 15px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; word-break: break-word; }
.msg-user .via { display: block; font-size: 11.5px; opacity: .8; margin-top: 2px; }
.msg-bot { align-self: stretch; }
.msg-bot .who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--mute); margin-bottom: 6px; }
.msg-bot .who .avatar { width: 22px; height: 22px; border-radius: 7px; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.msg-bot .who .avatar svg { width: 14px; height: 14px; }
.msg-bot .status { color: var(--mute); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.msg-bot .status .spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--tide); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.md { word-break: break-word; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .75em; }
.md ul, .md ol { margin: 0 0 .75em; padding-left: 1.3em; }
.md li { margin: .2em 0; }
.md h1, .md h2, .md h3, .md h4 { font-size: 16px; margin: 1.1em 0 .45em; line-height: 1.4; }
.md strong { font-weight: 600; }
.md blockquote { margin: 0 0 .75em; padding: 6px 14px; border-left: 3px solid var(--line); color: var(--ink-2); font-family: var(--serif); }
.md code { font-size: .9em; background: var(--paper); border: 1px solid var(--line-2); padding: 0 5px; border-radius: 5px; }
.md pre { background: var(--paper); border: 1px solid var(--line); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
.md pre code { border: 0; padding: 0; background: none; }
.md table { border-collapse: collapse; margin: 0 0 .9em; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--paper-2); font-weight: 600; }
.typing-caret::after { content: ""; display: inline-block; width: 7px; height: 1.05em; background: var(--tide); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.err { border: 1px solid var(--seal); background: var(--seal-soft); color: var(--ink); padding: 10px 14px; border-radius: 10px; font-size: 14px; white-space: pre-wrap; }
.err b { color: var(--seal); }
.basis { margin-top: 14px; padding-top: 11px; border-top: 1px dashed var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.basis-label { font-size: 12.5px; color: var(--mute); margin-right: 4px; }
.msg-foot { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; color: var(--mute); }
.msg-foot .model { margin-right: auto; }
.msg-foot .model.fallback { color: var(--warn); }
.msg-foot button { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 7px; color: var(--mute); font-size: 12.5px; }
.msg-foot button:hover { background: var(--paper); color: var(--ink); }
.msg-foot button svg { width: 15px; height: 15px; }
.msg-foot button.on { color: var(--tide); }

/* composer */
.composer { padding: 10px 20px 14px; }
.composer-box { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 7px 7px 7px 16px; box-shadow: var(--shadow); transition: border-color .15s; }
.composer-box:focus-within { border-color: var(--tide); }
.composer textarea { flex: 1; border: 0; outline: none; background: none; resize: none; padding: 8px 0; max-height: 180px; line-height: 1.55; font-size: 15px; }
.composer textarea::placeholder { color: var(--mute); }
.composer .mic, .composer .send { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; position: relative; }
.composer .mic { color: var(--ink-2); }
.composer .mic:hover { background: var(--paper-2); }
.composer .mic.live { color: var(--paper); background: var(--seal); }
.composer .mic.live::after { content: ""; position: absolute; inset: -4px; border-radius: 15px; border: 2px solid var(--seal); opacity: .5; animation: ping 1.4s ease-out infinite; }
@keyframes ping { from { transform: scale(.9); opacity: .6; } to { transform: scale(1.25); opacity: 0; } }
.composer .send { background: var(--tide); color: var(--tide-ink); }
.composer .send:disabled { opacity: .4; cursor: default; }
.composer .send.stop { background: var(--ink); color: var(--paper); }
.fine { max-width: 760px; margin: 7px auto 0; text-align: center; font-size: 11.5px; color: var(--mute); }

/* ---------- viewer (조문 원문) ---------- */
.viewer { background: var(--paper); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; visibility: hidden; transition: visibility 0s .3s, transform .25s ease; }
.shell.viewing .viewer { visibility: visible; transition: visibility 0s, transform .25s ease; }
.viewer-inner { width: var(--viewer-w); display: flex; flex-direction: column; height: 100%; }
.viewer-head { display: flex; align-items: flex-start; gap: 10px; padding: 18px 18px 12px 22px; border-bottom: 1px solid var(--line-2); }
.viewer-head .crumb { font-size: 12.5px; color: var(--mute); line-height: 1.45; }
.viewer-head h2 { margin: 4px 0 0; font: 600 19px/1.4 var(--serif); letter-spacing: -.01em; }
.viewer-head h2 .no { color: var(--seal); margin-right: 6px; }
.viewer-head .grow { flex: 1; min-width: 0; }
.viewer-body { flex: 1; overflow-y: auto; padding: 18px 26px 24px 22px; font: 400 15.5px/1.95 var(--serif); }
.viewer-body p { margin: 0 0 .7em; }
.viewer-body p.sub { padding-left: 1.4em; }
.viewer-body p.hl { background: var(--seal-soft); box-shadow: -10px 0 0 var(--seal-soft), 10px 0 0 var(--seal-soft); border-radius: 2px; }
.viewer-body .hist { margin-top: 16px; font: 13px/1.6 var(--sans); color: var(--mute); }
.viewer-body .hist summary { cursor: pointer; }
.viewer-body .page { font: 12.5px/1.5 var(--sans); color: var(--mute); margin-top: 12px; }
.viewer-foot { display: flex; gap: 8px; padding: 12px 18px 16px 22px; border-top: 1px solid var(--line-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); font-size: 13.5px; background: var(--paper); }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--tide); color: var(--tide-ink); border-color: var(--tide); }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .45; cursor: default; }
.viewer-foot .btn.primary { margin-left: auto; }

/* ---------- settings sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8, 18, 29, .4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
.scrim.show { opacity: 1; pointer-events: auto; }
.settings { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: var(--paper); z-index: 40; transform: translateX(100%); transition: transform .25s ease, visibility 0s .25s; visibility: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.settings.show { transform: none; visibility: visible; transition: transform .25s ease; }
.settings header { display: flex; align-items: center; padding: 18px 18px 10px 22px; }
.settings header h2 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; }
.settings .body { overflow-y: auto; padding: 4px 22px 28px; }
.settings section { padding: 14px 0; border-bottom: 1px solid var(--line-2); }
.settings section:last-child { border-bottom: 0; }
.settings h3 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
.field { display: grid; gap: 5px; margin-bottom: 12px; font-size: 13.5px; }
.field > span { color: var(--ink-2); }
.field select, .field input[type="range"] { width: 100%; }
.field select { padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--paper-2); }
.field .row { display: flex; gap: 8px; align-items: center; }
.field .row select { flex: 1; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 13.5px; cursor: pointer; }
.toggle small { display: block; color: var(--mute); font-size: 12px; }
.toggle input { appearance: none; width: 38px; height: 22px; border-radius: 22px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .15s; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle input:checked { background: var(--tide); }
.toggle input:checked::after { transform: translateX(16px); }
.settings .note { font-size: 12.5px; color: var(--mute); margin: 6px 0 10px; line-height: 1.55; }

/* ---------- voice conversation overlay ---------- */
.voice { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: auto 1fr auto; background: radial-gradient(120% 90% at 50% 40%, #183A5A 0%, #0B1A2A 60%, #07111C 100%); color: #E8F0F7; opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
.voice.show { opacity: 1; pointer-events: auto; visibility: visible; transition: opacity .25s; }
.voice-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; font-size: 14px; color: #A9BED2; }
.voice-top .icon-btn { color: #A9BED2; }
.voice-top .icon-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
.voice-stage { display: grid; place-items: center; align-content: center; gap: 34px; padding: 0 24px; }
.orb { position: relative; width: 190px; height: 190px; display: grid; place-items: center; cursor: pointer; border-radius: 50%; }
.orb .core { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9FD0F5, #3D86C0 45%, #1A4C79 100%); box-shadow: 0 0 60px rgba(111,168,214,.45); transform: scale(var(--lvl, 1)); transition: transform .08s linear; }
.orb .ring { position: absolute; inset: 35px; border-radius: 50%; border: 1.5px solid rgba(159,208,245,.55); opacity: 0; }
.voice[data-state="listening"] .orb .ring { animation: ripple 2.4s ease-out infinite; }
.voice[data-state="listening"] .orb .ring:nth-child(2) { animation-delay: .8s; }
.voice[data-state="listening"] .orb .ring:nth-child(3) { animation-delay: 1.6s; }
@keyframes ripple { from { transform: scale(1); opacity: .8; } to { transform: scale(2.1); opacity: 0; } }
.voice[data-state="thinking"] .orb .core { animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.88); filter: brightness(.85); } }
.voice[data-state="speaking"] .orb .core { background: radial-gradient(circle at 35% 30%, #FFE3D6, #F0806F 45%, #9C2B1F 100%); box-shadow: 0 0 60px rgba(240,128,111,.45); }
.voice-state { font-size: 15px; color: #A9BED2; text-align: center; min-height: 1.5em; }
.voice-text { max-width: 640px; text-align: center; font-size: 19px; line-height: 1.6; min-height: 3.2em; color: #F2F7FB; }
.voice-text .interim { color: #7F98AF; }
.voice-answer { max-width: 640px; max-height: 26vh; overflow-y: auto; text-align: left; font-size: 15px; line-height: 1.7; color: #CFDCE8; }
.voice-answer .stamp, .voice-answer .cite { color: #F7A596; border-color: #F7A596; }
.voice-answer .cite:hover { background: rgba(247,165,150,.12); }
.voice-answer th, .voice-answer td { border-color: rgba(255,255,255,.18); }
.voice-answer th { background: rgba(255,255,255,.06); color: #E8F0F7; }
.voice-answer code { background: rgba(255,255,255,.08); border-color: transparent; }
.voice-bottom { display: flex; justify-content: center; gap: 14px; padding: 18px 22px 30px; }
.voice-bottom button { padding: 11px 20px; border-radius: 999px; background: rgba(255,255,255,.09); color: #E8F0F7; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.voice-bottom button:hover { background: rgba(255,255,255,.16); }
.voice-bottom button.end { background: #B42318; }
.voice-bottom button.end:hover { background: #C9342A; }

.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 12px); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 10px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .shell, .shell.viewing { grid-template-columns: var(--toc-w) minmax(0, 1fr); }
  .viewer { position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--viewer-w), 100%); z-index: 35; transform: translateX(100%); box-shadow: var(--shadow); }
  .shell.viewing .viewer { transform: none; }
  .viewer-inner { width: 100%; }
}

  .shell.toc-open .toc { transform: none; }
  .only-mobile { display: grid; }
  .bar { padding: 10px 12px; gap: 6px; }
  .pill .label, .scope .l, .index-status .more { display: none; }
  .scope button { padding: 5px 10px; }
  .index-status { padding: 7px 14px; }
  .index-status .progress { width: 64px; }
  .pill { padding: 9px; }
  .messages { padding: 20px 16px 12px; }
  .composer { padding: 8px 12px 12px; }
  .welcome { margin-top: 2vh; }
  .welcome h1 { font-size: 24px; }
  .msg-user { max-width: 90%; }
  .viewer { top: auto; left: 0; width: 100%; height: 78dvh; border-radius: 18px 18px 0 0; transform: translateY(100%); }
  .viewer-body { padding: 16px 20px 20px; }
  .ask-list .stamp { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

</head>
<body>
<div class="shell" id="shell">
  <aside class="toc" id="toc" aria-label="규정 목차">
    <div class="toc-head">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9c2 0 2-1.6 4.5-1.6S10 9 12 9s2-1.6 4.5-1.6S19 9 21 9"/><path d="M3 14c2 0 2-1.6 4.5-1.6S10 14 12 14s2-1.6 4.5-1.6S19 14 21 14"/><path d="M3 19c2 0 2-1.6 4.5-1.6S10 19 12 19s2-1.6 4.5-1.6S19 19 21 19" opacity=".5"/></svg></div>
        <div><strong>계약 규정 도우미</strong><span>규정 원문을 찾아 근거와 함께 답해요</span></div>
      </div>
      <button class="icon-btn only-mobile" id="tocClose" aria-label="목차 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="doc-tabs" role="tablist" aria-label="규정 선택" id="docTabs"></div>
    <label class="toc-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="sr">조문 찾기</span>
      <input id="tocFilter" type="search" placeholder="조문 찾기 (예: 보증금, 36조)" autocomplete="off">
    </label>
    <nav class="toc-list" id="tocList"></nav>
  </aside>

  <main class="chat">
    <header class="bar">
      <button class="icon-btn only-mobile" id="tocOpen" aria-label="규정 목차 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <div class="scope" role="radiogroup" aria-label="답변 근거 범위" id="scope">
        <button role="radio" data-scope="all"><span class="l">두 규정 </span>모두</button>
        <button role="radio" data-scope="contract">계약<span class="l"> 규정</span></button>
        <button role="radio" data-scope="nego">협상<span class="l"> 요령</span></button>
        <button role="radio" data-scope="off">일반<span class="l"> 대화</span></button>
      </div>
      <div class="bar-actions">
        <button class="pill" id="voiceBtn" title="말로 묻고 음성으로 듣기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg><span class="label">음성 대화</span></button>
        <button class="icon-btn" id="newChat" title="새 대화" aria-label="새 대화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="icon-btn" id="settingsBtn" title="설정" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      </div>
    </header>
    <div class="index-status" id="indexStatus" role="status"><span class="dot"></span><span id="indexText">규정 색인을 준비하고 있어요</span><span class="more" id="indexMore"></span><div class="progress"><i id="indexBar"></i></div></div>
    <section class="messages" id="messages" aria-live="polite"></section>
    <form class="composer" id="composer">
      <div class="composer-box">
        <label class="sr" for="input">질문 입력</label>
        <textarea id="input" rows="1" placeholder="규정에 대해 물어보세요"></textarea>
        <button type="button" class="mic" id="micBtn" aria-label="말로 입력하기" title="말로 입력하기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
        <button type="submit" class="send" id="sendBtn" aria-label="보내기" title="보내기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <p class="fine">답변은 규정 원문에서 찾은 조문을 근거로 하지만 틀릴 수 있어요. 중요한 판단은 원문 조문을 꼭 확인하세요.</p>
    </form>
  </main>

  <aside class="viewer" id="viewer" aria-label="조문 원문">
    <div class="viewer-inner">
      <div class="viewer-head">
        <div class="grow"><div class="crumb" id="vCrumb"></div><h2 id="vTitle"></h2></div>
        <button class="icon-btn" id="vClose" aria-label="조문 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="viewer-body" id="vBody"></div>
      <div class="viewer-foot">
        <button class="btn" id="vPrev" aria-label="이전 조문"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="btn" id="vNext" aria-label="다음 조문"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="btn" id="vSpeak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 010 6"/></svg>읽어주기</button>
        <button class="btn primary" id="vAsk">이 조문 질문하기</button>
      </div>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim"></div>

<aside class="settings" id="settings" aria-label="설정" aria-hidden="true">
  <header><h2>설정</h2><button class="icon-btn" id="settingsClose" aria-label="설정 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="body">
    <section>
      <h3>답변 모델</h3>
      <label class="field"><span>사용할 모델</span><select id="modelSel"><option value="auto">자동 선택 (응답 가능한 모델 우선)</option></select></label>
      <p class="note" id="modelNote">자동 선택은 최근에 답한 모델을 먼저 쓰고, 혼잡하거나 쓸 수 없는 모델은 건너뜁니다.</p>
    </section>
    <section>
      <h3>음성</h3>
      <label class="field"><span>읽어주는 목소리</span>
        <div class="row"><select id="voiceSel"></select><button type="button" class="btn" id="voiceTest">들어보기</button></div>
      </label>
      <label class="field"><span>말하는 속도 <b id="rateVal">1.0</b>배</span><input type="range" id="rateSel" min="0.7" max="1.6" step="0.05"></label>
      <label class="toggle"><span>답변 자동으로 읽어주기<small>음성 대화가 아닐 때도 답변을 소리로 들려줘요</small></span><input type="checkbox" id="autoSpeak"></label>
      <label class="toggle"><span>말이 끝나면 바로 보내기<small>끄면 받아쓴 내용을 고친 뒤 직접 보낼 수 있어요</small></span><input type="checkbox" id="autoSend"></label>
      <p class="note" id="sttNote"></p>
    </section>
    <section>
      <h3>화면</h3>
      <label class="field"><span>테마</span><select id="themeSel"><option value="system">시스템 설정 따르기</option><option value="light">밝게</option><option value="dark">어둡게</option></select></label>
    </section>
    <section>
      <h3>규정 색인</h3>
      <p class="note" id="indexNote"></p>
      <button type="button" class="btn" id="reindexBtn">색인 다시 만들기</button>
    </section>
  </div>
</aside>

<div class="voice" id="voice" data-state="idle" role="dialog" aria-modal="true" aria-label="음성 대화" aria-hidden="true">
  <div class="voice-top"><span id="voiceScope"></span><button class="icon-btn" id="voiceClose" aria-label="음성 대화 끝내기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="voice-stage">
    <div class="orb" id="orb" role="button" tabindex="0" aria-label="말하기 시작 또는 끊기"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="core"></span></div>
    <div class="voice-state" id="voiceState"></div>
    <div class="voice-text" id="voiceText"></div>
    <div class="voice-answer md" id="voiceAnswer"></div>
  </div>
  <div class="voice-bottom">
    <button type="button" id="voiceMute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 010 6"/></svg><span>읽기 멈추기</span></button>
    <button type="button" class="end" id="voiceEnd">대화 끝내기</button>
  </div>
</div>
