을 요하는 용역\n4. 시설물의 안전성 또는 그 밖에 보안 등의 이유로 필요하다고 인정되는 물품･용역계약\n5. 계약의 이행에 전문성 또는 특별한 기술을 요하는 등 협상에 의한 계약방식을 적용하는 것이 사업목적 달성에 효과적인 물품․용역․부동산의 처분 또는 임대계약. 다만, 부동산의 처분 또는 임대방법은 지도경제사업대표이사의 결재를 득하여 따로 정할 수 있다.","hist":"\u003c개정 2019.11. 6> \u003c개정 2015. 5.29, 2019.11. 6> \u003c신설 2019.11. 6., 개정 2020.11.16.>","src":"nego","id":318},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"4","label":"제4조(입찰공고)","chapter":"","page":2,"part":"","text":"제4조(입찰공고) ① 이 요령에서 적용하는 입찰공고는 본회 「계약규정」 제46조에도 불구하고 제안서 제출마감일의 전일부터 기산하여 25일전에 공고하여야 한다.\n② 긴급을 요하는 경우 및 「계약규정」 제30조에 따른 재공고입찰인 경우에는 제안서 제출마감일의 전일부터 기산하여 10일전까지 공고할 수 있다.\n③ 입찰공고에는 다음 각 호의 사항을 명시하여야 한다.\n1. 사업명, 사업내용 및 사업기간\n2. 해당 계약이 협상에 의한 계약이라는 사실\n3. 제안요청서의 요청기간 및 요청에 필요한 서류\n4. 제안요청서에 대한 설명을 실시하는 경우 그 장소, 일시 및 참가의무여부에 관한 사항\n5. 협상에 의한 계약체결에 필요한 기준 및 절차\n6. 제안서의 제출기간\n7. 제안서의 내용\n8. 제안서의 평가요소 및 평가방법\n9. 기타 계약담당자가 필요하다고 인정하는 사항","hist":"\u003c개정 2016. 5.30> \u003c개정 2016. 5.30> \u003c개정 2015. 5.29>","src":"nego","id":319},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"5","label":"제5조(제안요청서의 교부 또는 열람 등)","chapter":"","page":2,"part":"","text":"제5조(제안요청서의 교부 또는 열람 등) ① 계약담당자는 입찰에 참가하고자 하는 자에게 제안요청서를 교부하여야 한다.\n② 계약담당자는 제안요청서 등 필요한 서류를 본회 홈페이지 또는 국가종합전자조달시스템에 게재함으로써 제1항에 따른 제안요청서 등 필요한 서류의 교부에 갈음할 수 있다.\n③ 계약담당자는 사업내용이 비교적 단순하여 제1항 및 제2항에 따른 제안요청서의 교부 또는 열람이 불필요하다고 인정되는 경우에는 제안요청서의 교부 또는 열람을 생략하고, 제안서를 제출하게 할 수 있다.\n④ 계약담당자는 계약의 성질, 규모 등을 고려하여 필요하다고 인정하는 경우에는 제안요청서 등에 대한 설명을 할 수 있으며, 설명을 실시하는 경우에는 설명에 참가한 자에 한하여 계약에 참가하게 할 수 있다.\n⑤ 제안요청서에는 다음 각 호의 사항을 명시하여야 한다.\n1. 과업내용\n2. 요구사항\n3. 계약조건\n4. 평가요소와 평가방법\n5. 제안서의 규격\n6. 기타 필요한 사항","hist":"\u003c개정 2015. 5.29>","src":"nego","id":320},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"6","label":"제6조(제안서 등의 제출)","chapter":"","page":3,"part":"","text":"제6조(제안서 등의 제출) 협상에 의한 계약에 참가하고자 하는 자는 제4조에 따른 입찰공고 또는 제5조에 따른 제안요청서에 정한 바에 따라 제안서 및 가격입찰서를 별도로 작성하여 계약담당자에게 제출하여야 한다.","hist":"\u003c개정 2016. 5.30>","src":"nego","id":321},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"7","label":"제7조(제안서의 평가)","chapter":"","page":3,"part":"","text":"제7조(제안서의 평가) ① 계약담당자는 제출된 제안서에 대하여 기술평가와 가격평가로 나누어 종합적으로 평가하되, 평가항목 및 배점한도는 ｢별표｣와 같다.\n② 계약담당자는 제1항에 따른 평가항목 및 배점한도를 기준으로 세부평가기준을 정할 수 있다. 이 경우 사업의 특성ㆍ목적 및 내용 등을 고려하여 필요한 때에는 ｢별표｣ 평가분야별 배점한도를 10점의 범위 내에서 가감할 수 있으며, 평가항목을 추가하거나 제외할 수 있다.\n③ 평가점수를 계산한 결과 소수점 이하의 숫자가 있는 경우에는 소수점 다섯째 자리에서 반올림 한다.\n④ 제안서의 평가에 있어서 필요한 서류가 첨부되어 있지 않거나 제출된 서류가 불명확하여 인지할 수 없는 경우에는 제안서 내용의 변경이 없는 경미한 사항에 한하여 기간을 정하여 보완을 요구할 수 있으며, 보완요구한 서류가 제출되지 아니한 경우에는 당초 제출된 서류만으로 평가하고 당초 제출된 서류가 불명확하여 심사가 불가능한 경우에는 평가에서 제외한다.","hist":"\u003c개정 2009. 5.20> \u003c개정 2016. 5.30> \u003c개정 2016. 5.30> \u003c개정 2016. 5.30>","src":"nego","id":322},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"8","label":"제8조(제안서의 기술평가)","chapter":"","page":3,"part":"","text":"제8조(제안서의 기술평가) ① 제안서의 기술평가점수는 각 평가위원의 제안서 평가점수 중에서 최저 및 최고점수를 제외한 후 산술평균하여 산출한다. 다만, 최저 또는 최고 점수가 2개 이상일 때에는 이중 하나만 제외한다.\n② 공정한 기술평가를 위하여 계약담당자, 계약에 관한 학식과 경험이 풍부한 자, 해당분야 전문기관ㆍ단체 임직원 및 전문가, 대학교수 등으로 구성된 평가위원회를 구성하여 심사할 수 있으며, 평가위원은 5인 이상 8인 이내로 구성할 수 있다.\n③ 제2항의 구성은 협상계약 내용에 따라 달리할 수 있다.\n④ 평가위원의 구성은 비공개를 원칙으로 하며, 본회 임직원은 평가위원 구성을 다른 임직원 및 제3자에게 누설하여서는 아니 된다.\n⑤ 평가위원으로 지명된 임직원은 사적 이해관계(혈연, 학연, 지연 등)와 관련되어 공정한 평가가 곤란할 경우 계약담당자에게 회피를 요청할 수 있다.\n⑥ 계약담당자는 필요하다고 인정하는 경우에는 제안업체로 하여금 제안설명을 하게 하거나 보완자료 등을 제출하게 할 수 있다.\n⑦ 평가위원회는 ｢위임 전결 규정｣에 따른 당해 계약의 전결권자가 구성하고, 평가위원은 동 전결권자 또는 전결권자로부터 위임을 받은 자가 선정한다.","hist":"\u003c개정 2009. 5.20> \u003c개정 2016. 5.30> \u003c개정 2016. 5.30> \u003c개정 2016. 5.30> \u003c개정 2016. 5.30> \u003c개정 2016. 5.30> \u003c개정 2016. 5.30> \u003c신설 2019.11. 6>","src":"nego","id":323},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"9","label":"제9조(제안서 검토)","chapter":"","page":4,"part":"","text":"제9조(제안서 검토) 계약담당자는 평가위원에게 제안서를 사전 배포하지 않는 경우에는 입찰참가업체의 제안서 발표 이전에 다음 각 호의 추정가격을 기준으로 평가위원에게 제안서 검토시간을 부여하여야 한다.\n1. 추정가격이 10억원 미만 : 60분 이상\n2. 추정가격이 10억원 이상 50억원 미만 : 90분 이상\n3. 추정가격이 50억원 이상 200억원 미만 : 120분 이상\n4. 추정가격이 200억원 이상 : 150분 이상","hist":"\u003c신설 2015. 5.29>","src":"nego","id":324},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"10","label":"제10조(제안서의 가격평가)","chapter":"","page":4,"part":"","text":"제10조(제안서의 가격평가) ① 계약담당자는 제안서 평가후 지체없이 입찰가격을 평가하여야 한다.\n② 입찰가격의 평가는 ｢별표｣에 따른 입찰가격 평점산식에 따라 평가한다.","hist":"\u003c개정 2009. 5.20>","src":"nego","id":325},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"11","label":"제11조(협상적격자 선정)","chapter":"","page":4,"part":"","text":"제11조(협상적격자 선정) ① 계약담당자는 제8조에 따른 제안서의 기술평가 결과와 제10조에 따른 제안서 가격평가 결과의 합산점수가 70점 이상인 자를 협상적격자로 선정한다. 다만, 합산점수가 70점 이상인 자가 없는 경우에는 재공고입찰에 부칠 수 있다.\n② 협상순서는 합산점수의 고득점순에 따라서 결정하되 합산점수가 동일한 제안자가 2인이상일 경우에는 기술평가 점수가 높은 제안자를 선순위자로 하고, 기술평가 점수도 동일한 경우에는 기술평가 세부평가항목 중 배점이 큰 항목에서 높은 점수를 얻은 자를 선순위자로 한다.","hist":"\u003c개정 2009. 5.20> \u003c개정 2016. 5.30> \u003c개정 2016. 5.30>","src":"nego","id":326},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"12","label":"제12조(협상절차)","chapter":"","page":4,"part":"","text":"제12조(협상절차) ① 계약담당자는 제11조에 따라서 결정된 협상순위에 따라 협상대상자와 협상을 하며, 협상이 성립된 때에는 다른 협상적격자와 협상을 실시하지 아니한다.\n② 계약담당자는 협상대상자와의 협상이 성립되지 않으면 동일한 기준과 절차에 따라 순차적으로 차순위 협상적격자와 협상을 실시한다.\n③ 계약담당자는 모든 협상적격자와의 협상이 결렬된 경우에는 협상적격자에게 금액을 조정한 가격제안서를 다시 제출하게 하여 재협상 할 수 있다. 다만, 재협상시에도 모든 협상적격자와 협상이 결렬된 경우에는 재공고입찰에 부칠 수 있다.","hist":"\u003c개정 2016. 5.30>","src":"nego","id":327},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"13","label":"제13조(협상내용과 범위)","chapter":"","page":5,"part":"","text":"제13조(협상내용과 범위) ① 계약담당자는 협상대상자가 제안한 제안내용, 이행일정, 제안가격 등의 제안서 내용을 대상으로 협상을 진행하며, 그 내용의 일부를 조정할 수 있다.\n② 계약담당자는 협상대상자가 제안한 내용을 가감하거나 다른 제안자의 제안내용을 추가 반영하는 경우에는 그 가감 또는 추가되는 내용에 상당하는 금액을 조정할 수 있다.","hist":"","src":"nego","id":328},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"14","label":"제14조(협상금액 결정)","chapter":"","page":5,"part":"","text":"제14조(협상금액 결정) ① 협상금액은 협상적격자의 제안서 평균금액을 기준으로 하며 제안서 평균금액이 해당 협상대상자의 제안서 금액보다 높을 경우에는 해당 협상대상자의 제안서 금액을 협상금액으로 한다.\n② 제1항에 따른 제안서 평균금액이 예정가격을 초과하는 경우에는 예정가격(예정가격이 없는 경우에는 예산액)을 협상금액으로 한다.","hist":"\u003c개정 2015. 5.29> \u003c개정 2016. 5.30>","src":"nego","id":329},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"15","label":"제15조(협상기간)","chapter":"","page":5,"part":"","text":"제15조(협상기간) 협상기간은 협상개시를 통보한 날로부터 7일 이내로 하며 사업의 규모, 특수성, 난이도 등에 따라 협상대상자와의 협의에 따라서 조정할 수 있다.","hist":"\u003c개정 2016. 5.30>","src":"nego","id":330},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"16","label":"제16조(기타사항)","chapter":"","page":5,"part":"","text":"제16조(기타사항) ① 계약담당자는 이 요령에 적용되지 아니한 사항과 이 요령 시행에 필요한 사항에 대하여는 세부사항을 정하여 시행할 수 있다.\n② 계약담당자는 제1항에 따라 세부사항을 정하거나 제8조에 따라 평가항목 및 평가방법 등을 정할 때에는 공정한 평가가 이루어 질 수 있도록 하여야 한다.","hist":"\u003c개정 2009. 5.20> \u003c개정 2016. 5.30>","src":"nego","id":331},{"doc":"nego_add","docTitle":"협상에 의한 계약 요령","art":"","label":"부칙","chapter":"","page":7,"part":"","text":"부칙(시행일)\n이 요령은 2007년 3월 15일부터 시행한다.\n이 요령은 2009년 5월 20일부터 시행한다.\n이 요령은 2015년 5월 29일부터 시행한다.\n이 요령은 2016년 5월 30일부터 시행한다.\n이 요령은 2019년 11월 6일부터 시행한다.\n이 요령은 2020년 11월 16일부터 시행한다.\n제정 2007. 3. 15 / 개정 2009. 5. 20, 2015. 5. 29, 2016. 5. 30, 2019. 11. 6, 2020. 11. 16","hist":"","src":"nego","id":332},{"doc":"nego_annex","docTitle":"협상에 의한 계약 요령","art":"","label":"별표 제안서의 평가항목 및 배점한도 (제7조 관련)","chapter":"","page":7,"part":"1/2","text":"[별표] 제안서의 평가항목 및 배점한도 (제7조 관련)\n총 배점: 100점\n- 기술평가 › 객관적평가 (배점한도 20점, 계약담당자 평가): 기술인력 보유상태, 수행경험(실적), 재무구조·경영상태 등\n- 기술평가 › 주관적평가 (배점한도 50점, 심사위원 평가): 기술·지식능력, 사업수행계획, 지원기술·사후관리 등\n- 기술평가 비고: 각 평가항목의 배점한도는 기술평가 전체 배점한도 30%를 초과하지 못함\n- 가격평가 (배점한도 30점): 평점산식은 아래 주) 입찰가격 평점산식에 따름","hist":"","src":"nego","id":333},{"doc":"nego_annex","docTitle":"협상에 의한 계약 요령","art":"","label":"별표 제안서의 평가항목 및 배점한도 (제7조 관련)","chapter":"","page":7,"part":"2/2","text":"주) 입찰가격 평점산식\n가) 입찰가격을 추정가격의 100분의 80 이상으로 입찰한 자에 대한 평가\n평점 = 입찰가격평가 배점한도 × (최저입찰가격 ÷ 해당입찰가격)\n* 최저입찰가격: 유효한 입찰자중 최저입찰가격\n* 해당입찰가격: 해당 평가대상자의 입찰가격\n* 입찰가격 평가시 사업예산으로 하는 경우에는 추정가격에 부가가치세를 포함하여 적용하고, 예정가격을 작성한 경우에는 추정가격을 예정가격으로 적용\n나) 입찰가격을 추정가격의 100분의 80 미만으로 입찰한 자에 대한 평가\n평점 = 입찰가격평가 배점한도 × (최저입찰가격 ÷ 추정가격의80%상당가격) + [2 × {(추정가격의80%상당가격 − 해당입찰가격) ÷ (추정가격의80%상당가격 − 추정가격의60%상당가격)}]\n* 최저입찰가격: 유효한 입찰자중 최저입찰가격\n* 해당입찰가격: 해당 평가대상자의 입찰가격으로 하되, 입찰가격이 추정가격의 100분의 60 미만일 경우에는 100분의 60으로 계산\n* 입찰가격 평가시 사업예산으로 하는 경우에는 추정가격에 부가가치세를 포함하여 적용하고, 예정가격을 작성한 경우에는 추정가격을 예정가격으로 적용\n다) 입찰가격 평점산식에 의한 계산결과 소수점이하의 숫자가 있는 경우에는 소수점 다섯째자리에서 반올림함","hist":"","src":"nego","id":334}]}</script>

<script>"use strict";
/* =====================================================================
   계약 규정 도우미 — Gemini + 규정 RAG + 음성 입출력 (단일 HTML)
   ===================================================================== */

/* ---------- 설정 ---------- */
const API_KEY = "__GEMINI_API_KEY__";
const API_ROOT = "https://generativelanguage.googleapis.com/v1beta/";
const BASE_PROMPT = "당신은 수협중앙회 계약 업무 담당자를 돕는 친절하고 정확한 AI 어시스턴트입니다. 사용자가 쓰는 언어로 답하세요.";

/* ---------- 공통 유틸 ---------- */
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },

function toast(msg, ms = 2600) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), ms);
}
const ICON = {
  bot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10c2 0 2-1.6 4.5-1.6S10 10 12 10s2-1.6 4.5-1.6S19 10 21 10"/><path d="M3 16c2 0 2-1.6 4.5-1.6S10 16 12 16s2-1.6 4.5-1.6S19 16 21 16"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h8"/></svg>',
  speak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 010 6"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  retry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 0114-5.3L20 9M20 4v5h-5"/><path d="M20 12a8 8 0 01-14 5.3L4 15M4 20v-5h5"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
};

/* ---------- 사용자 설정 ---------- */
const S = Object.assign({ model: "auto", scope: "all", voiceURI: "", rate: 1.05, autoSpeak: false, autoSend: true, theme: "system" },
  store.get("rg_settings", {}));
const saveSettings = () => store.set("rg_settings", S);
function applyTheme() {
  if (S.theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
}
applyTheme();

/* =====================================================================
   지식베이스
   ===================================================================== */
const KB = JSON.parse($("kb").textContent);
const CH = KB.chunks;
const SRC = Object.fromEntries(KB.sources.map((s) => [s.id, s]));

/* 조문 단위 묶음 (한 조문이 여러 청크로 나뉜 경우 합침) */
const ART = new Map();         // key -> {key, src, doc, art, label, chapter, page, docTitle, chunks:[], hist}
const artKey = (c) => `${c.src}|${c.doc}|${c.label}`;
for (const c of CH) {
  const k = artKey(c);
  if (!ART.has(k)) ART.set(k, { key: k, src: c.src, doc: c.doc, art: c.art, label: c.label, chapter: c.chapter, page: c.page, docTitle: c.docTitle, chunks: [], hist: c.hist || "" });
  ART.get(k).chunks.push(c);
}
const ART_LIST = [...ART.values()];
function findArticle(src, art) {
  return ART_LIST.find((a) => a.src === src && a.art === art && (a.doc === "main" || a.doc === "nego"));
}
const docName = (a) => {
  if (a.src === "nego") return a.doc === "nego" ? "협상에 의한 계약 요령" : "협상에 의한 계약 요령 " + (a.doc === "nego_annex" ? "별표" : "부칙");
  if (a.doc === "main") return "계약 규정";
  if (a.doc === "add") return "계약 규정 부칙";
  return a.docTitle;   // 별지 제N호 …
};
const shortDoc = (a) => (a.src === "nego" ? "협상요령" : a.doc === "main" ? "계약규정" : a.doc === "add" ? "부칙" : a.docTitle.replace(/^(별지 제\d+호).*$/, "$1"));
function artNo(a) {
  if (!a.art) return a.doc === "nego_annex" ? "별표" : /add/.test(a.doc) ? "부칙" : "";
  const [n, m] = a.art.split("-");
  return `제${n}조` + (m ? `의${m}` : "");
}
function artTitle(a) {
  const m = a.label.match(/^제\d+조(?:의\d+)?\((.*)\)$/);
  if (m) return m[1];
  if (a.label === "머리말") return "서식 전문";
  const t = a.label.replace(/^(별표|부칙)\s*/, "");
  return t || (a.doc === "nego_add" ? "시행일" : a.label);
}

/* =====================================================================
   모델 목록 · 상태 기억 · 호출
   ===================================================================== */
const modelSel = $("modelSel");
let chatModels = ["gemini-3.8-flash"];
let embedModelList = [];

async function loadModels() {
  try {
    const res = await fetch(`${API_ROOT}models?pageSize=200`, { headers: { "x-goog-api-key": API_KEY } });
    if (!res.ok) return;
    const data = await res.json();
    const models = data.models || [];
    embedModelList = models.filter((m) => /embed/i.test(m.name) && (m.supportedGenerationMethods || []).some((x) => /embed/i.test(x)))
      .map((m) => m.name.replace("models/", ""));
    const list = models.filter((m) => /gemini/i.test(m.name) && (m.supportedGenerationMethods || []).includes("generateContent") &&
      !/(embedding|image|tts|audio|live|vision|aqa|robotics|computer-use)/i.test(m.name));
    if (!list.length) return;
    list.sort((a, b) => b.name.localeCompare(a.name, "en", { numeric: true }));
    chatModels = list.map((m) => m.name.replace("models/", ""));
    modelSel.innerHTML = '<option value="auto">자동 선택 (응답 가능한 모델 우선)</option>' +
      list.map((m) => `<option value="${esc(m.name.replace("models/", ""))}">${esc(m.displayName || m.name)}</option>`).join("");
    modelSel.value = chatModels.includes(S.model) ? S.model : "auto";
  } catch (e) { console.warn("모델 목록을 불러오지 못했습니다:", e); }
}

const health = {
  get() { return store.get("rg_model_health", {}); },
  good(m) { const h = this.get(); h.lastGood = m; h.cool = h.cool || {}; delete h.cool[m]; store.set("rg_model_health", h); },
  bad(m, ms) { const h = this.get(); h.cool = h.cool || {}; h.cool[m] = Date.now() + ms; store.set("rg_model_health", h); },
};
function candidates() {
  const h = health.get(), cool = h.cool || {}, now = Date.now();
  const ok = chatModels.filter((m) => !(cool[m] > now)), cooling = chatModels.filter((m) => cool[m] > now);
  let order = [...ok, ...cooling];
  if (h.lastGood && ok.includes(h.lastGood)) order = [h.lastGood, ...order.filter((m) => m !== h.lastGood)];
  if (S.model !== "auto") order = [S.model, ...order.filter((m) => m !== S.model)];
  return order.slice(0, 6);
}

/** 모델 호출 (재시도·대체 모델 포함). stream=true면 SSE 응답(Response)을, 아니면 JSON을 돌려줌 */
async function callModel({ contents, system, stream = true, signal, onWait }) {
  const list = candidates();
  let firstErr = "";
  for (let i = 0; i < list.length; i++) {
    const model = list[i];
    const delays = i === 0 ? [1500, 3000, 6000] : [1500];
    for (let attempt = 0; attempt <= delays.length; attempt++) {
      const url = `${API_ROOT}models/${model}:${stream ? "streamGenerateContent?alt=sse" : "generateContent"}`;
      const body = { contents };
      if (system) body.systemInstruction = { parts: [{ text: system }] };
      const res = await fetch(url, { method: "POST", signal, headers: { "Content-Type": "application/json", "x-goog-api-key": API_KEY }, body: JSON.stringify(body) });
      if (res.ok) { health.good(model); return { res, model }; }
      let detail = "";
      try { detail = (await res.json()).error?.message || ""; } catch {}

      if (!firstErr) firstErr = err;

}

   ===================================================================== */

  "내용", "대해", "대한", "관련", "설명", "해줘", "어때", "언제", "누가", "어디", "어떤", "무슨", "몇", "규정", "조문"]);

  const t = q.replace(/제\s*\d+\s*조(?:\s*의\s*\d+)?/g, " ").replace(/제\s*\d+\s*[항호장절]/g, " ");

    const tf = new Map();
    for (const g of bigrams(chunkEmbedText(c) + " " + c.label + " " + c.label)) tf.set(g, (tf.get(g) || 0) + 1);

const CIRCLED = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";

let msgSeq = 0;
/**
 * 질문 보내기. opts.voice=true면 음성 대화용 짧은 답 + 자동 낭독

 */
async function ask(userText, opts = {}) {
  const scope = S.scope;
  convo.push({ role: "user", text: userText });
  addUser(userText, opts.viaVoice);
  const ui = addBot();
  const id = "m" + (++msgSeq);
  controller = new AbortController();
  setBusy(true);
  let full = "", hits = [], mode = "", usedModel = "", picked = "";
  const speakLive = opts.voice || S.autoSpeak;
  const feeder = speakLive ? makeSentenceFeeder(id) : null;
  if (speakLive) TTS.stop();
  let raf = 0;
  const paint = (final) => {
    ui.md.hidden = false; ui.status.hidden = true;
    renderMarkdown(ui.md, full, hits, final);
    ui.md.classList.toggle("typing-caret", !final);
    if (opts.onText) opts.onText(full, hits, final);
    scrollDown();
  };
  try {
    let system = BASE_PROMPT;
    let contents = convo.map((m) => ({ role: m.role, parts: [{ text: m.text }] }));
    if (scope !== "off") {
      const prevQ = convo.filter((m) => m.role === "user").slice(-2, -1)[0]?.text;
      const r = await retrieve(userText, prevQ, scope);
      hits = r.hits; mode = r.mode;
      if (hits.length) {
        system = RAG_PROMPT;
        contents[contents.length - 1] = { role: "user", parts: [{ text: `[참고 조문]\n${contextOf(hits, userText)}\n\n[질문]\n${userText}` }] };
      }
    }
    if (opts.voice) system += VOICE_STYLE;
    ui.st.textContent = hits.length ? `조문 ${hits.length}건을 찾았어요. 답변을 쓰는 중` : "답변을 쓰는 중";
    const { res, model } = await callModel({ contents, system, signal: controller.signal, onWait: (t) => (ui.st.textContent = t) });
    picked = model; usedModel = model;
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (!data || data === "[DONE]") continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        if (j.modelVersion) usedModel = j.modelVersion;
        if (j.promptFeedback?.blockReason) throw new Error("안전 정책 때문에 답변이 차단됐어요. 질문을 바꿔 보세요.");
        const chunk = (j.candidates?.[0]?.content?.parts || []).filter((p) => !p.thought).map((p) => p.text || "").join("");
        if (chunk) {
          full += chunk;
          if (feeder) feeder.feed(full, false);
          if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(false); });
        }
      }
    }
    cancelAnimationFrame(raf); raf = 0;
    if (!full.trim()) throw new Error("빈 답변이 왔어요. 다시 시도해 주세요.");
    convo.push({ role: "model", text: full });
    paint(true);
    if (feeder) feeder.feed(full, true);
    finishBot(ui, id, full, hits, mode, picked, usedModel, userText);
    return { text: full, hits };
  } catch (err) {
    cancelAnimationFrame(raf);
    if (err.name === "AbortError") {
      if (full) { convo.push({ role: "model", text: full }); paint(true); finishBot(ui, id, full, hits, mode, picked, usedModel, userText, true); }
      else { convo.pop(); ui.root.remove(); }

    }
    convo.pop();
    ui.status.hidden = true; ui.md.hidden = false;
    ui.md.innerHTML = `<div class="err"><b>답변을 받지 못했어요.</b>\n${esc(err.message || err)}</div>`;
    const foot = document.createElement("div");
    foot.className = "msg-foot";
    foot.innerHTML = `<span class="model"></span><button type="button" data-retry="${esc(userText)}">${ICON.retry}다시 묻기</button>`;
    ui.root.appendChild(foot);
    throw err;
  } finally {
    controller = null;
    setBusy(false);
  }
}
function finishBot(ui, id, full, hits, mode, picked, usedModel, q, stopped) {
  if (hits.length) {
    const seen = new Set();
    const arts = hits.map((c) => ART.get(artKey(c))).filter((a) => !seen.has(a.key) && seen.add(a.key));
    const basis = document.createElement("div");
    basis.className = "basis";
    basis.innerHTML = `<span class="basis-label">찾아본 조문 (${esc(mode)} 검색)</span>` +
      arts.map((a) => `<button type="button" class="stamp" data-key="${esc(a.key)}" title="${esc(docName(a))} ${esc(a.label)}">${esc(shortDoc(a))} <small>${esc(artNo(a))} ${esc(artTitle(a)).slice(0, 14)}</small></button>`).join("");
    ui.root.appendChild(basis);
  }
  const switched = S.model !== "auto" && picked !== S.model;
  const foot = document.createElement("div");
  foot.className = "msg-foot";
  foot.innerHTML = `<span class="model${switched ? " fallback" : ""}">${esc(usedModel)}${switched ? ` · 선택한 ${esc(S.model)} 대신 응답` : ""}${stopped ? " · 중간에 멈춤" : ""}</span>` +
    (synth ? `<button type="button" data-speak="${id}">${ICON.speak}읽어주기</button>` : "") +
    `<button type="button" data-copy>${ICON.copy}복사</button><button type="button" data-retry="${esc(q)}">${ICON.retry}다시 묻기</button>`;
  foot.querySelector("[data-copy]").onclick = () => navigator.clipboard.writeText(full).then(() => toast("답변을 복사했어요"), () => toast("복사하지 못했어요"));
  const sb = foot.querySelector("[data-speak]");
  if (sb) sb.onclick = () => { if (TTS.speaking && TTS.owner === id) TTS.stop(); else { TTS.stop(); TTS.push(full, id); } };
  ui.root.appendChild(foot);
  updateSpeakButtons();
  scrollDown();
}

/* =====================================================================
   음성 대화 모드 (듣기 → 답하기 → 읽기 → 다시 듣기)
   ===================================================================== */
const Voice = {
  on: false, state: "idle", raf: 0,
  el: $("voice"),
  set(state, label) {
    this.state = state;
    this.el.dataset.state = state;
    $("voiceState").textContent = label ?? ({ listening: "듣고 있어요. 말씀하세요", thinking: "조문을 찾고 답을 정리하는 중", speaking: "읽어 드리는 중이에요. 원을 누르면 끊고 바로 말할 수 있어요", idle: "원을 누르면 다시 들어요", transcribing: "받아 적는 중" })[state] ?? "";
  },
  async open() {
    if (sttBlockedReason()) { toast(sttBlockedReason(), 6000); return; }
    if (!synth) toast("이 브라우저는 음성 출력을 지원하지 않아 답변은 글로만 보여 드려요.", 4000);
    this.on = true;
    this.el.classList.add("show"); this.el.setAttribute("aria-hidden", "false");
    $("voiceScope").textContent = { all: "두 규정 모두에서 찾아요", contract: "계약 규정에서 찾아요", nego: "협상에 의한 계약 요령에서 찾아요", off: "규정 검색 없이 대화해요" }[S.scope];
    $("voiceText").textContent = ""; $("voiceAnswer").innerHTML = "";
    if (STT_MODE === "gemini" || !IS_MOBILE) { try { await Mic.open(); } catch (e) { /* 음량 표시는 생략, 인식은 계속 시도 */ } }
    const core = this.el.querySelector(".core");
    const loop = () => {
      const lv = this.state !== "listening" ? 1
        : Mic.analyser ? Math.min(1 + Mic.level * 4, 1.45)
        : Mic.hearing ? 1.12 + 0.1 * Math.sin(performance.now() / 120) : 1;
      core.style.setProperty("--lvl", lv.toFixed(3));
      this.raf = requestAnimationFrame(loop);
    };
    loop();
    this.listen();
  },
  close() {
    this.on = false;
    cancelAnimationFrame(this.raf);
    if (listenOnce.current) listenOnce.current.abort();
    if (controller) controller.abort();
    TTS.stop();
    Mic.close();
    this.set("idle", "");
    this.el.classList.remove("show"); this.el.setAttribute("aria-hidden", "true");
    $("voiceBtn").focus();
  },
  async listen() {
    if (!this.on) return;
    TTS.stop();
    $("voiceText").textContent = "";
    this.set("listening");
    let text = "";
    try {
      text = await listenOnce({
        onPhase: (p) => this.set(p),
        onInterim: (fin, interim) => { $("voiceText").innerHTML = esc(fin) + (interim ? `<span class="interim">${esc(interim)}</span>` : ""); },
      });
    } catch (e) {
      if (!this.on) return;
      this.set("idle", e.message);
      return;
    }
    if (!this.on) return;
    if (!text) { this.set("idle", "잘 들리지 않았어요. 원을 누르고 다시 말씀해 주세요"); return; }
    $("voiceText").textContent = text;
    this.set("thinking");
    $("voiceAnswer").innerHTML = "";
    TTS.onIdle = null;
    let started = false;
    try {
      const r = await ask(text, {
        voice: true, viaVoice: true,
        onText: (full, hits, final) => {
          if (!started && TTS.speaking) { started = true; this.set("speaking"); }
          renderMarkdown($("voiceAnswer"), full, hits, final);
          $("voiceAnswer").scrollTop = $("voiceAnswer").scrollHeight;
        },
      });
      if (!this.on || r.aborted) return;
      if (synth && (TTS.speaking || TTS.queue.length)) {
        this.set("speaking");
        TTS.onIdle = () => { if (this.on && this.state === "speaking") setTimeout(() => this.on && this.state === "speaking" && this.listen(), IS_MOBILE ? 450 : 150); };
      } else this.listen();
    } catch (e) {
      if (this.on) this.set("idle", "답변을 받지 못했어요. 원을 누르면 다시 들어요");
    }
  },
  tapOrb() {
    if (!this.on) return;
    if (this.state === "listening") { if (listenOnce.current) listenOnce.current.stop(); return; }
    if (this.state === "thinking") { if (controller) controller.abort(); }
    this.listen();
  },
};

/* 입력창 옆 마이크 (한 번 말하기) */
let micBusy = false;
async function micDictate() {
  const btn = $("micBtn");
  if (micBusy) { if (listenOnce.current) listenOnce.current.stop(); return; }
  if (sttBlockedReason()) { toast(sttBlockedReason(), 6000); return; }
  micBusy = true;
  btn.classList.add("live"); btn.setAttribute("aria-label", "받아쓰기 멈추기");
  const before = inputEl.value ? inputEl.value.replace(/\s*$/, " ") : "";
  inputEl.placeholder = "듣고 있어요. 말씀하세요";
  let text = "";
  try {
    if (STT_MODE === "gemini") await Mic.open();
    text = await listenOnce({
      onPhase: (p) => { if (p === "transcribing") inputEl.placeholder = "받아 적는 중"; },
      onInterim: (fin, interim) => { inputEl.value = before + fin + interim; autoResize(); },
    });
  } catch (e) { toast(e.message, 4000); }
  finally {
    if (STT_MODE === "gemini") Mic.close();
    micBusy = false;
    btn.classList.remove("live"); btn.setAttribute("aria-label", "말로 입력하기");
    inputEl.placeholder = "규정에 대해 물어보세요";
  }
  inputEl.value = (before + text).trim() ? before + text : inputEl.value;
  autoResize(); updateSendState();
  if (text && S.autoSend && !busy) submit(true);
  else inputEl.focus();
}

/* =====================================================================
   이벤트 연결
   ===================================================================== */
function autoResize() { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px"; }
function submit(viaVoice) {
  const t = inputEl.value.trim();
  if (!t || busy) return;
  inputEl.value = ""; autoResize(); updateSendState();
  ask(t, { viaVoice }).catch(() => {});
}
$("composer").addEventListener("submit", (e) => { e.preventDefault(); if (S.autoSpeak) unlockTTS(); if (busy) { controller && controller.abort(); return; } submit(false); });
inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) submit(false); } });
inputEl.addEventListener("input", () => { autoResize(); updateSendState(); });
$("micBtn").addEventListener("click", () => { unlockTTS(); micDictate(); });

/* 메시지 영역 클릭: 예시 질문, 조문 인용, 다시 묻기 */
messagesEl.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.ask) { inputEl.value = t.dataset.ask; autoResize(); updateSendState(); submit(false); }
  else if (t.dataset.key) openArticle(t.dataset.key, t.dataset.hang);
  else if (t.dataset.retry && !busy) ask(t.dataset.retry).catch(() => {});
});
$("voiceAnswer").addEventListener("click", (e) => { const t = e.target.closest("button[data-key]"); if (t) { Voice.close(); openArticle(t.dataset.key, t.dataset.hang); } });

/* 범위 선택 */
function renderScope() { document.querySelectorAll("#scope button").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.scope === S.scope))); }
$("scope").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-scope]"); if (!b) return;
  S.scope = b.dataset.scope; saveSettings(); renderScope();
  inputEl.placeholder = S.scope === "off" ? "무엇이든 물어보세요" : "규정에 대해 물어보세요";
});

/* 목차 */
$("docTabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-src]"); if (!b) return; tocSrc = b.dataset.src; renderDocTabs(); renderToc(); $("tocList").scrollTop = 0; });
$("tocFilter").addEventListener("input", renderToc);
$("tocList").addEventListener("click", (e) => { const b = e.target.closest(".toc-item"); if (b) openArticle(b.dataset.key); });
$("tocOpen").addEventListener("click", () => { $("shell").classList.add("toc-open"); updateScrim(); });
$("tocClose").addEventListener("click", () => { $("shell").classList.remove("toc-open"); updateScrim(); });

/* 뷰어 */
$("vClose").addEventListener("click", closeArticle);
$("vAsk").addEventListener("click", () => {
  if (!viewing) return;
  const a = viewing;
  if (S.scope !== "all" && S.scope !== a.src) { S.scope = a.src; saveSettings(); renderScope(); }
  inputEl.value = `${docName(a)} ${a.label}의 내용을 쉽게 설명해 줘`;
  autoResize(); updateSendState();
  if (window.matchMedia("(max-width: 1180px)").matches) closeArticle();
  submit(false);
});
$("vSpeak").addEventListener("click", () => {
  if (!viewing) return;
  if (TTS.speaking && TTS.owner === "viewer") { TTS.stop(); return; }
  TTS.stop();
  TTS.push(`${docName(viewing)} ${viewing.label}. ` + viewing.chunks.map((c) => c.text).join("\n").replace(/^제\d+조(의\d+)?\([^)]*\)\s*/, ""), "viewer");
});

/* 새 대화 */
$("newChat").addEventListener("click", () => { if (controller) controller.abort(); TTS.stop(); convo = []; showWelcome(); inputEl.focus(); });

/* 설정 */
function openSettings() { $("settings").classList.add("show"); $("settings").setAttribute("aria-hidden", "false"); updateScrim(); $("settingsClose").focus(); }
function closeSettings() { $("settings").classList.remove("show"); $("settings").setAttribute("aria-hidden", "true"); updateScrim(); }
$("settingsBtn").addEventListener("click", openSettings);
$("settingsClose").addEventListener("click", closeSettings);
modelSel.addEventListener("change", () => { S.model = modelSel.value; saveSettings(); });
$("voiceSel").addEventListener("change", (e) => { S.voiceURI = e.target.value; saveSettings(); });
$("voiceTest").addEventListener("click", () => { TTS.stop(); TTS.push("안녕하세요. 계약 규정 도우미입니다. 계약보증금은 계약금액의 100분의 10 이상입니다.", "test"); });
$("rateSel").value = S.rate; $("rateVal").textContent = (+S.rate).toFixed(2);
$("rateSel").addEventListener("input", (e) => { S.rate = +e.target.value; $("rateVal").textContent = S.rate.toFixed(2); saveSettings(); });
$("autoSpeak").checked = S.autoSpeak; $("autoSpeak").addEventListener("change", (e) => { S.autoSpeak = e.target.checked; saveSettings(); });
$("autoSend").checked = S.autoSend; $("autoSend").addEventListener("change", (e) => { S.autoSend = e.target.checked; saveSettings(); });
$("themeSel").value = S.theme; $("themeSel").addEventListener("change", (e) => { S.theme = e.target.value; saveSettings(); applyTheme(); });
let reindexArmed = false;
$("reindexBtn").addEventListener("click", () => {
  if (!reindexArmed) { reindexArmed = true; $("reindexBtn").textContent = "한 번 더 누르면 처음부터 다시 만들어요"; setTimeout(() => { reindexArmed = false; $("reindexBtn").textContent = "색인 다시 만들기"; }, 4000); return; }
  reindexArmed = false; $("reindexBtn").textContent = "색인 다시 만들기"; buildIndex(true);
});
$("sttNote").textContent = {
  web: "음성 입력은 브라우저의 음성 인식을 써요. 처음 쓸 때 마이크 권한을 허용해 주세요.",
  gemini: "이 브라우저는 실시간 음성 인식이 없어, 녹음한 뒤 Gemini로 받아 적어요. 말이 끝나고 잠시 조용하면 자동으로 멈춰요.",
  none: "이 브라우저에서는 음성 입력을 쓸 수 없어요. 크롬이나 엣지를 권해요.",
  insecure: "",
}[STT_MODE];
if (sttBlockedReason()) $("sttNote").textContent = sttBlockedReason();

/* 음성 대화 */
$("voiceBtn").addEventListener("click", () => { unlockTTS(); Voice.open(); });
$("voiceClose").addEventListener("click", () => Voice.close());
$("voiceEnd").addEventListener("click", () => Voice.close());
$("voiceMute").addEventListener("click", () => { TTS.stop(); if (Voice.on && Voice.state === "speaking") Voice.set("idle"); });
$("orb").addEventListener("click", () => { unlockTTS(); Voice.tapOrb(); });
$("orb").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); Voice.tapOrb(); } });

/* 덮개 · ESC */
function updateScrim() {
  const narrow = window.matchMedia("(max-width: 1180px)").matches, phone = window.matchMedia("(max-width: 820px)").matches;
  const show = $("settings").classList.contains("show") || (phone && $("shell").classList.contains("toc-open")) || (narrow && $("shell").classList.contains("viewing"));
  $("scrim").classList.toggle("show", show);
}
$("scrim").addEventListener("click", () => { closeSettings(); $("shell").classList.remove("toc-open"); if (window.matchMedia("(max-width: 1180px)").matches) closeArticle(); updateScrim(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (Voice.on) Voice.close();
  else if ($("settings").classList.contains("show")) closeSettings();
  else if (viewing) closeArticle();
  else if ($("shell").classList.contains("toc-open")) { $("shell").classList.remove("toc-open"); updateScrim(); }
});
window.addEventListener("resize", updateScrim);

/* =====================================================================
   시작
   ===================================================================== */
renderDocTabs();
renderToc();
renderScope();
showWelcome();
setBusy(false);
buildKeywordIndex();
loadModels().finally(() => buildIndex(false));
inputEl.focus();
</script>
