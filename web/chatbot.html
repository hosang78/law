<script type="application/json" id="kb">{"title":"수협중앙회 계약 관련 규정","sources":[{"id":"contract","title":"계약 규정","rev":"2025.05.07 개정","short":"계약규정"},{"id":"nego","title":"협상에 의한 계약 요령","rev":"2020.11.16 개정","short":"협상계약요령"}],"chunks":[{"doc":"main","docTitle":"계약 규정","art":"1","label":"제1조(목적)","chapter":"제1장 총칙","page":1,"part":"","text":"제1조(목적) 이 규정은 회계 및 사업규약 제29조에 따른 계약의 방법과 준칙을 정하여 계약체결의 적정을 기함을 목적으로 한다.","hist":"\u003c개정 2015.11.20.>","id":0,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"2","label":"제2조(적용범위)","chapter":"제1장 총칙","page":1,"part":"","text":"제2조(적용범위) 본회가 당사자가 되는 계약의 사무처리는 금전소비임치계약, 금전소비대차계약, 차관전대계약, 공제계약, 다른 법령 및 제규정에서 특별히 정한 것을 제외하고는 이 규정이 정하는 바에 의한다.","hist":"\u003c개정 2002. 7. 8, 2016.10.25., 2023.3.9>","id":1,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"3","label":"제3조(계약의 원칙)","chapter":"제1장 총칙","page":2,"part":"","text":"제3조(계약의 원칙) 계약 담당자는 이 규정 및 관계 규정에서 규정하고 있는 계약상대자의 계약상 이익을 부당하게 제한하는 특약 또는 조건을 정하여서는 아니된다.","hist":"","id":2,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"4","label":"제4조(정의)","chapter":"제1장 총칙","page":2,"part":"","text":"제4조(정의) 이 규정에서 사용하는 용어의 정의는 다음과 같다.\n1. “계약담당자”라 함은 직제규약에서 정하는 부서장 및 지사무소장을 말한다.\n2. “추정가격”이라 함은 물품, 공사, 용역 등의 계약을 체결함에 있어서 예정가격이 결정되기 전에 예산에 계상된 금액 등으로 추산한 가격을 말한다.\n3. “추정금액”이라 함은 공사에 있어서 제2호에 따른 추정가격에 「부가가치세법」에 따른 부가가치세와 관급재료로 공급될 부분의 가격을 합한 금액을 말한다.\n4. “예정가격”이라 함은 입찰 또는 계약체결 전에 낙찰자 및 계약금액의 결정기준으로 삼기 위하여 미리 작성 비치하여 두는 가액으로서 제8조에 따라 작성된 가격을 말한다.\n5. “공사이행보증서”라 함은 공사계약에 있어서 계약상대자가 계약상의 의무를 이행하지 못하는 경우 계약상대자를 대신하여 계약상의 의무를 이행할 것을 보증하되, 이를 보증한 기관이 의무를 이행하지 아니하는 경우에는 일정금액을 납부할 것을 보증하는 증서를 말한다.","hist":"\u003c개정 2002. 7. 8, 2014.12. 5> \u003c개정 2014.12. 5> \u003c신설 2014.12. 5> \u003c개정 2014.12. 5, 2015.11.20> \u003c신설 1997. 2.14, 개정 2014.12. 5>","id":3,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"5","label":"제5조(계약의 방법)","chapter":"제1장 총칙","page":2,"part":"","text":"제5조(계약의 방법) 계약담당자는 계약을 체결하는 경우에는 공고를 하여 일반경쟁에 부쳐야한다. 다만, 계약의 목적, 성질, 규모 등을 고려하여 필요하다고 인정할 때에는 참가자의 자격을 제한하거나 참가자를 지명하여 경쟁에 붙이거나 수의계약에 의할 수 있다.","hist":"","id":4,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"5-2","label":"제5조의2(청렴계약)","chapter":"제1장 총칙","page":2,"part":"","text":"제5조의2(청렴계약) ① 계약담당자는 공사․물품의 제조․구매․용역 계약시 청렴계약 이행사항을 고지하고 이를 승낙한 자에 한하여 입찰승낙 또는 계약을 체결하여야 한다. 이 경우, 「수협중앙회 임직원 행동강령」 제6조에서 정한 청렴계약 이행확약서(이하 “청렴계약 이행확약서”라 한다)를 첨부하여야 한다.\n② 제1항의 “청렴계약 이행확약서”에는 경쟁 입찰에서 입찰가격의 유지나 특정인의 낙찰을 위한 담합 등 공정한 경쟁을 방해하는 행위, 금품·향응 등의 부당한 이익을 제공하는 행위 등의 금지에 관한 사항과 이를 지키지 아니한 경우에는 당해 입찰·낙찰의 취소, 계약의 해제·해지, 입찰참가 제한 등을 할 수 있다는 내용이 포함되어야 한다.\n③ 삭제","hist":"\u003c개정 2016. 10. 25> \u003c개정 2014.12. 5> \u003c2014.12. 5>","id":5,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"5-3","label":"제5조의3(비위행위자 참여제한)","chapter":"제1장 총칙","page":3,"part":"","text":"제5조의3(비위행위자 참여제한) 계약담당자 및 제71조에 따른 감독자는 공사 또는 용역에 참여하는 기술자 등이 배치되거나 교체된 때에는 청렴의무 위반 여부를 검토·확인하고, 위반자가 있는 경우에는 계약상대자에게 교체를 요구하여야 한다. 제5조4(추정가격의 산정) 계약담당자는 예산에 계상된 금액 등을 기준으로 하여 추정가격을 산정하되, 다음 각 호의 어느 하나에 의한 기준에 따른 금액으로 한다.\n1. 공사계약의 경우에는 관급자재로 공급될 부분의 가격을 제외한 금액\n2. 단가계약의 경우에는 당해 물품의 추정단가에 조달예정수량을 곱한 금액\n3. 물품 또는 용역의 리스․임차․할부구매계약 및 총계약금액이 확정되지 아니한 계약의 경우에는 다음 각 목의 어느 하나에 의한 금액\n가. 계약기간이 정하여진 계약의 경우에는 총계약기간에 대하여 추정한 금액\n나. 계약기간이 정하여지지 아니하거나 불분명한 계약의 경우에는 1월분의 추정지급액에 48을 곱한 금액\n4. 조달하고자 하는 대상에 선택사항이 있는 경우에는 이를 포함하여 최대한 조달 가능한 금액","hist":"\u003c신설 2014.12. 5> \u003c본조신설 2021.10.28>","id":6,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"6","label":"제6조(예정가격의 비치)","chapter":"제2장 추정가격과 예정가격","page":3,"part":"","text":"제6조(예정가격의 비치) ① 계약담당자는 경쟁입찰 또는 수의계약에 부칠 사항에 대하여 당해 규격서 및 설계서 등에 따라 제7조에 따른 예정가격 기초금액 또는 예정가격을 결정한 후, 제8조에 따른 복수예비가격을 밀봉하여 미리 개찰장소 또는 가격협상 장소에 두어야 하며 사전에 누설되지 않도록 하여야 한다. 다만, 부동산을 매각하는 경우에는 예정가격을 공개할 수 있다.\n② 계약담당자는 제1항에도 불구하고 수산물을 경매의 방법에 의거 매매할 때와 제36조제2호, 제3호 및 제13호부터 제17호 까지 및 제20호의 규정에 따라 수의계약을 체결할 때, 제59조의2에 따른 협상에 의한 계약을 체결할 때 및 그 밖에 계약의 성질상 예정가격을 미리 작성할 수 없는 특수한 경우에는 예정가격을 정하지 아니할 수 있다.","hist":"\u003c개정 1999. 4.10, 1999.12.17, 2016.10.25, 2017.12. 1> \u003c개정 2003. 3.31, 2015.11.20., 2019.11.15, 2024. 10. 15.>","id":7,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"7","label":"제7조(예정가격 기초금액)","chapter":"제2장 추정가격과 예정가격","page":4,"part":"","text":"제7조(예정가격 기초금액) ① 계약담당자는 계약을 체결하고자 하는 사항에 대하여 거래실례가격, 원가계산가격, 감정가격 및 견적가격 등에 의하여 조사한 가격 또는 설계가격의 적정 여부를 검토․조정한 후 제9조제4항에 따른 부가가치세액 등 제세액을 합산하여 제6조에 따른 예정가격의 결정기준이 되는 기초금액을 작성하여야 한다.\n② 부동산의 매각 또는 임대에 있어서 예정가격을 공개하는 경우에는 입찰일 전일부터 기산하여 7일전까지 입찰장소의 게시판에 게시하여 공개하여야 한다.","hist":"\u003c개정 2015.11.20> \u003c개정 1999. 4.10, 1999.12.17, 2004.11.16, 2015.11.20., 2016.10.25., 2021.10.28.>","id":8,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"8","label":"제8조(예정가격의 결정방법)","chapter":"제2장 추정가격과 예정가격","page":4,"part":"","text":"제8조(예정가격의 결정방법) ① 예정가격은 계약을 체결하고자 하는 사항의 가격의 총액에 대하여 결정하여야 한다. 다만, 일정한 기간 계속하는 제조, 공사, 수리, 가공, 매매, 공급, 임차, 인쇄 등의 계약에 있어서는 단가로서 예정가격을 정할 수 있다.\n② 본회의 부담이 되는 공사, 용역, 물품의 제조․구매 계약의 경우에는 제1항 및 제7조제1항에 따라 작성한 기초금액의 ±2% 상당금액의 범위 내에서 서로 다른 15개(이하 “복수예비가격”이라 한다)의 가격을 작성하되, 특별한 사유가 없는 한 0% ~ 2% 범위 내에서 7개, 0% ~ -2% 범위 내에서 8개의 복수예비가격을 작성하여야 하며, 이 때 복수예비가격간 폭은 최대한 확대하여야 한다.\n③ 제2항에 따라 작성된 복수예비가격은 입찰현장에 비치하고 입찰을 실시한 후 낙찰자를 결정하기 전에 입찰참가자중에서 4인(입찰참가자가 4인 이하인 경우에는 입찰사무에 관계없는 본회 직원을 포함한다)을 선정하여 복수예비가격중에서 4개를 추첨토록 한 후 이들의 산술평균 가격을 예정가격으로 확정하며, 예정가격 선정에 참가한자가 각각 기명날인토록 한다. 다만, 제45조에 따른 전자조달시스템을 이용하는 입찰의 경우에는 해당 시스템에서 제공하는 추첨 프로그램을 이용할 수 있다.","hist":"\u003c개정 1999. 4.10, 1999.12.17, 2004.11.16, 2010.12. 2, 개정 2015.11.20> \u003c신설 2010.12. 2, 개정 2014.12. 5, 2023.3.9.>","id":9,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"9","label":"제9조(예정가격의 결정기준)","chapter":"제2장 추정가격과 예정가격","page":4,"part":"","text":"제9조(예정가격의 결정기준) ① 제6조제1항에 따른 예정가격은 다음 각 호의 기준으로 하여 결정하여야 한다.\n1. 적정한 거래가 형성된 경우에는 그 거래실례가격(법령에 따라 가격이 결정된 경우에는 그 결정가격의 범위안에서의 거래실례가격)\n2. 신규 개발품이거나 특수규격품 등의 특수한 물품, 공사, 용역 등 계약의 특수성으로 인하여 적정한 거래실례가격이 없는 경우에는 원가계산에 따른 가격, 이 경우 원가계산에 따른 가격은 계약의 목적이 되는 물품, 공사, 용역 등을 구성하는 재료비, 노무비, 경비와 일반관리비 및 이윤으로 이를 계산한다.\n3. 제1호 및 제2호의 가격에 따를 수 없을 때에는 감정가격, 유사한 거래실례가격 또는 견적가격\n② 제1항 각 호의 규정에 따라 예정가격을 정함에 있어서는 계약수량의 다과, 이행의 난이, 이행기간의 장단, 수급상황, 계약조건, 그 밖에 제반 여건을 고려하여야 한다.\n③ 예정가격을 결정하고자 할 때에는 미리 예정가격조서를 작성하여야 한다.\n④ 제1항에 따른 예정가격은 부가가치세, 개별소비세, 교육세, 관세 및 농어촌특별세를 포함한 가격으로 한다.","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":10,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"10","label":"제10조(거래실례가격에 의한 예정가격의 결정)","chapter":"제2장 추정가격과 예정가격","page":5,"part":"","text":"제10조(거래실례가격에 의한 예정가격의 결정) 제9조제1항제1호에 따른 거래실례가격으로 예정가격을 결정함에 있어서는 다음 각 호의 1의 가격에 의하되 당해 거래실례가격에 제11조제1항제4호 및 제5호에 따른 일반관리비 및 이윤을 따로 가산하여서는 아니된다.\n1. 조달청장이 조사하여 통보한 가격\n2. 기획재정부장관이 정하는 기준에 적합한 전문가격 조사기관으로 기획재정부장관에게 등록한 기관이 조사하여 공표한 가격\n3. 계약담당직원이 2인 이상의 사업자에 대하여 당해 물품의 거래실례를 직접 조사하여 확인한 가격","hist":"\u003c개정 2015.11.20> \u003c개정 2002. 7. 8, 2010.12. 2>","id":11,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"11","label":"제11조(원가계산에 의한 예정가격의 결정)","chapter":"제2장 추정가격과 예정가격","page":5,"part":"","text":"제11조(원가계산에 의한 예정가격의 결정) ① 공사, 제조, 구매(수입물품의 구매를 제외한다) 및 용역의 경우 원가계산에 의한 가격으로 예정가격을 결정함에 있어서 그 예정가격에는 다음 각 호의 비목을 포함시켜야 한다.\n1. 재료비 : 계약목적물의 제조, 시공 또는 용역 등에 소요되는 규격별 재료량에 단위당 가격을 곱한 금액\n2. 노무비 : 계약목적물의 제조, 시공 또는 용역 등에 소요되는 공종별 노무량에 그 노임단가를 곱한 금액\n3. 경비 : 계약목적물의 제조, 시공 또는 용역 등에 소요되는 비목별 경비의 합계액\n4. 일반관리비 : 재료비, 노무비 및 경비의 합계액에 제12조제1항(제10호를 제외한다)에 따른 일반관리비율을 곱한 금액\n5. 이윤 : 노무비, 경비 및 일반관리비의 합계액에 제12조제2항(제3호를 제외한다)에 따른 이윤율을 곱한 금액\n② 수입물품을 구매하는 경우 원가계산에 의한 가격으로 예정가격을 결정함에 있어서는 그 예정가격에 다음 각 호의 비목을 포함시켜야 한다.\n1. 수입물품의 외화표시원가\n2. 통관료\n3. 보세창고료\n4. 하역료\n5. 국내운반비\n6. 신용장개설수수료\n7. 일반관리비 : 제1호부터 제6호까지의 합계액에 제12조제1항제10호에 따른 일반관리비율을 곱한 금액\n8. 이윤 : 제1호부터 제7호까지의 합계액에 제12조제2항제3호에 따른 이윤율을 곱한 금액\n③ 재료비, 노무비 및 경비의 비목은 「국가를 당사자로 하는 계약에 관한 법률」을 준용한다.","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2014.12. 5, 개정 2015.11.20>","id":12,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"12","label":"제12조(원가계산에 의한 예정가격 결정시의 일반관리비율 및 이윤율)","chapter":"제2장 추정가격과 예정가격","page":6,"part":"","text":"제12조(원가계산에 의한 예정가격 결정시의 일반관리비율 및 이윤율) ① 원가계산에 의한 가격으로 예정가격을 결정함에 있어서 일반관리비의 비율은 다음 각 호의 1의 율을 초과하지 못한다.\n1. 공사 : 100분의 6\n2. 음․식료품의 제조․구매 : 100분의 14\n3. 섬유․의복․가죽제품의 제조․구매 : 100분의 8\n4. 나무․나무제품의 제조․구매 : 100분의 9\n5. 종이․종이제품․인쇄출판물의 제조․구매 : 100분의 14\n6. 화학․석유․석탄․고무․플라스틱의 제품의 제조․구매 : 100분의 8\n7. 비금속광물제품의 제조․구매 : 100분의 12\n8. 제1차 금속제품의 제조․구매 : 100분의 6\n9. 조립금속제품․기계․장비의 제조․구매 : 100분의 7\n10. 수입물품의 구매 : 100분의 8\n11. 그 밖에 물품의 제조․구매 : 100분의 11\n12. 폐기물 처리·재활용 용역 : 100분의 10\n13. 시설물 관리·경비 및 청소 용역 : 100분의 9\n14. 행사관리 및 그 밖의 사업지원 용역 : 100분의 8\n15. 여행, 숙박, 운송 및 보험 용역 : 100분의 5\n16. 장비 유지·보수 용역 : 100분의 10\n17. 그 밖의 용역 : 100분의 6\n② 원가계산에 의한 가격으로 예정가격을 결정함에 있어서 이윤율은 다음 각 호의 1의 율을 초과하지 못한다. 다만, 계약담당자는 다음 각 호의 이윤율의 적용으로는 계약의 목적달성이 곤란하다고 인정되는 특별한 사유가 있는 경우에는 지도경제사업대표이사(이하 “지도경제대표이사”라 한다)의 결재를 득하여 그 이윤율을 초과하여 정할 수 있다.\n1. 공사 : 100분의 15\n2. 제조·구매(「소프트웨어산업 진흥법」 제22조제1항에 따라 고시된 소프트웨어사업의 대가기준에 따른 소프트웨어개발을 포함한다) : 100분의 25\n3. 수입물품의 구매 : 100분의 10\n4. 용역(「소프트웨어산업 진흥법」 제22조제1항에 따라 고시된 소프트웨어사업의 대가기준에 따른 소프트웨어개발을 제외한다) : 100분의 10","hist":"\u003c개정 2014.12. 5> \u003c개정 2015.11.20> \u003c신설 2016.10.25> \u003c신설 2016.10.25> \u003c신설 2016.10.25> \u003c신설 2016.10.25> \u003c신설 2016.10.25> \u003c신설 2016.10.25> \u003c개정 2002. 7. 8, 2010.12. 2> \u003c개정 2016.10.25> \u003c개정 2016.10.25>","id":13,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"13","label":"제13조(원가계산서의 작성)","chapter":"제2장 추정가격과 예정가격","page":7,"part":"","text":"제13조(원가계산서의 작성) 계약담당자는 원가계산에 의한 가격으로 예정가격을 결정함에 있어서는 원가계산서를 작성하여야 한다. 다만, 계약목적물의 내용, 성질 등이 특수하여 스스로 원가계산을 하기 곤란한 경우에는 기획재정부장관에게 등록한 원가계산 용역기관에 원가계산을 의뢰할 수 있다.","hist":"\u003c개정 2002. 7. 8, 2010.12. 2>","id":14,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"14","label":"제14조(감정가격 등에 의한 예정가격의 결정)","chapter":"제2장 추정가격과 예정가격","page":7,"part":"","text":"제14조(감정가격 등에 의한 예정가격의 결정) 제9조제1항제3호에 따른 감정가격, 유사한 거래실례가격 또는 견적가격은 다음 각 호의 1의 가격을 말하며, 그 적용순서는 다음 각 호의 순서에 의한다.\n1. 감정가격 : 「감정평가 및 감정평가사에 관한 법률」에 따른 감정평가업자가 1년이내 감정평가한 가격\n2. 유사한 거래실례가격 : 기능과 용도가 유사한 물품의 거래실례가격\n3. 견적가격 : 계약상대자 또는 제3자로부터 직접 제출받은 가격","hist":"\u003c개정 2015.11.20> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20., 2023.12.22. >","id":15,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"15","label":"제15조(희망수량 경쟁입찰시 예정가격의 결정)","chapter":"제2장 추정가격과 예정가격","page":7,"part":"","text":"제15조(희망수량 경쟁입찰시 예정가격의 결정) ① 제26조에 따른 희망수량 경쟁 입찰에 있어서의 예정가격은 당해 물품의 단가로 이를 정하여야 한다.\n② 제1항의 경우 본회의 부담이 되는 물품의 제조 또는 구매에 관한 입찰인 때에는 그 입찰에 부치고자 하는 물품의 총수량을 기준으로 한 예정가격조서에 의하여 당해 물품의 단가를 정하여야 한다.","hist":"\u003c개정 2015.11.20>","id":16,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"16","label":"제16조(예정가격의 변경)","chapter":"제2장 추정가격과 예정가격","page":8,"part":"","text":"제16조(예정가격의 변경) ① 계약담당자는 제30조제2항에 따른 재공고입찰에 있어서도 입찰자 또는 낙찰자가 없는 경우로서 당초의 예정가격으로는 제37조제1항에 따른 수의계약을 체결할 수 없는 때에는 당초의 예정가격을 변경하여 새로운 절차에 의한 경쟁입찰에 부칠 수 있다.\n② 부동산 매각에 있어서는 제1항에도 불구하고 제1차 입찰에 있어서 낙찰자가 없는 경우에는 제2차 입찰 이후의 예정가격은 제1차 처분예정가격을 기준으로 100분의 10범위 안에서 순차로 인하하여 100분의 80까지 인하하여 결정할 수 있다. 다만, 선박의 경우에 있어서는 당초 예정가격의 100분의 80까지 인하하여도 낙찰자가 없는 경우에는 이사회에서 순차로 100분의 50까지 인하하여 예정가격을 조정할 수 있다.","hist":"\u003c개정 2015.11.20> \u003c신설 1999.12.17, 단서신설 2002. 7. 8, 개정 2010.12. 2, 2015.11.20, 2016.10.25>","id":17,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"17","label":"제17조(경쟁의 방법)","chapter":"제3장 계약의 방법","page":8,"part":"","text":"제17조(경쟁의 방법) ① 제5조에 따른 경쟁은 입찰방법으로 하여야 한다. 다만, 동산의 매각에 있어서 필요하다고 인정할 경우에는 입찰방법에 준하여 경매에 부칠 수 있다.\n② 계약담당자는 공사․제조․그 밖의 계약에 있어 필요하다고 인정할 때에는 계약 상대자를 2인 이상으로 하는 공동계약을 체결할 수 있다. 이 경우 계약방법 등은 정부의 공동계약에 관한 사항을 준용한다.","hist":"\u003c개정 2010.12. 2, 개정 2015.11.20> \u003c신설 2010.12. 2, 2015.11.20>","id":18,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"18","label":"제18조(경매)","chapter":"제3장 계약의 방법","page":8,"part":"","text":"제18조(경매) 제17조제1항의 단서에 따른 경매에 있어서는 예정가격을 발표한 후 경락 희망가격을 제시하게 하고 최고제시 가격을 발표하면서 더 이상 높은 가격제시자가 없을 때 최고가격 제시자를 경락자로 결정하여야 한다. 다만, 수산물경매에 있어서는 예정가격의 발표없이 경락희망가격을 제시하게 할 수 있다.","hist":"\u003c개정 2015.11.20>","id":19,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"19","label":"제19조(경쟁입찰의 성립)","chapter":"제3장 계약의 방법","page":8,"part":"","text":"제19조(경쟁입찰의 성립) 경쟁입찰은 2인 이상의 유효한 입찰로 성립한다. 다만, 「 국유재산법」제31조제2항에 따라 총괄청이 지정고시하는 정보처리장치(이하 “전자자산처분시스템”이라 한다)를 이용하는 다음 각 호의 경쟁입찰은 1인 이상의 유효한 입찰로 성립한다.\n1. 부동산 매각\n2. 불용자산의 매각\n3. 부동산의 임대","hist":"\u003c개정 2016.10.25.>","id":20,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"20","label":"제20조(경쟁입찰의 참가자격)","chapter":"제3장 계약의 방법","page":9,"part":"","text":"제20조(경쟁입찰의 참가자격) ① 경쟁입찰에 참가하고자 하는 자는 다음 각 호의 요건을 갖추어야 한다.\n1. 삭제\n2. 법령에 따라 허가․인가․면허․등록․신고 등을 요하거나 자격요건을 갖추어야 할 경우에는 당해 허가․인가․면허․등록․신고 등을 받았거나 당해 자격요건에 적합할 것\n3. 「소득세법」제168조․「법인세법」제111조 또는 「부가가치세법」제8조에 따라 해당사업에 관한 사업자등록증을 교부받거나 고유번호를 부여받은 자\n② 제1항 각 호의 사실은 관계관서에서 발행한 문서로 증명하여야 한다. 다만, 관계관서에서 발행한 문서로 증명하기가 곤란하다고 인정되는 경우에는 당해 사실을 증명하는 계약서 사본 등으로 이를 증명하게 할 수 있다.\n③ 제21조에 따라서 본회에 경쟁입찰 참가자격등록을 마친 자는 등록된 품종에 한하여 제2항의 증명에 갈음할 수 있다.\n④ 특수한 물품을 구입함에 있어 제1항에 따른 유자격자가 없거나 입찰이 성립될 수 없는 경우에는 지도경제대표이사의 승인을 얻어 제1항의 자격요건을 완화할 수 있다.\n⑤ 「중소기업협동조합법」에 따른 중소기업협동조합이 물품의 제조 및 구매 또는 용역에 관한 경쟁입찰에 참가하는 경우(제1항제2호에 따른 요건을 갖춘 조합원으로 하여금 당해 물품을 제조 또는 구매하게 하거나 용역을 수행하게 하는 경우에 한한다)에는 제1항제2호를 적용하지 아니한다.","hist":"\u003c2015.11.20> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20, 2024. 10. 15.> \u003c개정 2015.11.20> \u003c개정 2002. 7. 8, 2010.12. 2, 2015.11.20> \u003c신설 2010.12. 2, 2015.11.20.>","id":21,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"20-2","label":"제20조의2(산업재해 예방조치능력 평가)","chapter":"제3장 계약의 방법","page":9,"part":"","text":"제20조의2(산업재해 예방조치능력 평가) 본회 사업장 내에서 도급, 용역, 파견 등의 방법으로 업무를 위탁하는 경우에는 「수급업체관리 요령」제4조에 따른 산업재해 예방조치능력 평가 결과에 따라 계약상대자(「협상에 의한 계약 요령」제2조에 따른 협상대상자를 포함한다)를 선정하여야 한다.","hist":"\u003c신설 2023.03.09.>","id":22,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"21","label":"제21조(입찰참가자격의 등록)","chapter":"제3장 계약의 방법","page":9,"part":"","text":"제21조(입찰참가자격의 등록) 계약담당자는 입찰사무의 간편을 도모하기 위하여 지도경제대표이사의 결재를 득하여 매년 일정한 기준을 정하여 수회에 나누어 입찰참가자격 등록을 실시할 수 있다. 이 경우에는 미리 그 뜻을 신문에 게재 또는 그 밖의 방법으로 공고하여야 한다.","hist":"\u003c개정 2002. 7. 8, 2010.12. 2, 2015.11.20>","id":23,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"22","label":"제22조(입찰참가자격등록 등의 배제)","chapter":"제3장 계약의 방법","page":10,"part":"","text":"제22조(입찰참가자격등록 등의 배제) 다음 각 호의 1에 해당하는 경우에는 제20조를 적용하지 아니할 수 있다. 다만, 부정당업자 입찰참가 자격제한의 사실유무의 확인은 그러하지 아니하다.\n1. 회원, 어촌계, 국가, 지방자치단체, 「공공기관의 운영에 관한 법률」에 따라 기획재정부장관이 지정한 공공기관, 「금융실명거래 및 비밀보장에 관한 법률」 에 따른 금융회사, 본회가 납입자본금의 50%이상을 출자한 기업체, 회원이 납입자본금의 50%이상을 출자한 기업체가 일반경쟁입찰에 참가하고자 할 때\n2. 본회의 수입의 원인이 되는 계약을 체결한 때","hist":"\u003c개정 2015.11.20> \u003c개정 2021.10.28.>","id":24,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"23","label":"제23조(공사의 현장설명과 입찰)","chapter":"제3장 계약의 방법","page":10,"part":"","text":"제23조(공사의 현장설명과 입찰) ① 계약담당자는 공사를 입찰에 부치고자 할 때에는 입찰 또는 개찰 전에 미리 현장설명을 하여야 한다. 다만, 공사의 성질상 현장설명이 필요없다고 인정되는 때에는 그러하지 아니하다.\n② 제1항에 따른 현장설명에 있어서는 현장설명에 참여한 자에게 설계서(설계도면, 공사시방서 및 현장설명서를 말한다)를 열람하게 하고 현장설명에 참여한 자의 요구가 있을 때에는 설계서를 배부할 수 있다.\n③ 제1항에 따른 현장설명은 공사의 규모에 따라 입찰일 또는 개찰일의 전일부터 기산하여 다음 각 호의 1의 기간 전에 실시하여야 한다. 다만, 제46조제4항에 따른 경우에는 그 기간을 단축할 수 있다.\n1. 추정가격이 30억원 이상인 경우 : 20일\n2. 추정가격이 10억원 이상 30억원 미만인 경우 : 15일\n3. 추정가격이 1억원 이상 10억원 미만인 경우 : 10일\n4. 추정가격이 1억원 미만인 경우 : 5일","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2010.12. 2> \u003c개정 2010.12. 2> \u003c신설 2003. 3.31>","id":25,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"24","label":"제24조(계속공사의 입찰)","chapter":"제3장 계약의 방법","page":10,"part":"","text":"제24조(계속공사의 입찰) 제36조제6호 “가”목부터 “다”목까지의 규정에 따라 직전 또는 현재의 시공자와 수의계약을 체결할 수 있는 공사에 있어서 당해 수의계약을 체결하지 아니한 자는 당해 공사에 관련된 경쟁입찰에 참가하게 하여서는 아니된다.","hist":"\u003c개정 2015.11.20>","id":26,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"25","label":"제25조(입찰서의 표시)","chapter":"제3장 계약의 방법","page":10,"part":"","text":"제25조(입찰서의 표시) 입찰은 본회가 정하는 서식에 의한 입찰서에 의하여야 하며 입찰금액은 총액입찰의 경우에는 총액을, 단가에 대하여 실시하는 입찰의 경우에는 단가를 표시하여야 한다.","hist":"","id":27,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"26","label":"제26조(희망수량 경쟁입찰)","chapter":"제3장 계약의 방법","page":10,"part":"","text":"제26조(희망수량 경쟁입찰) ① 다량의 물품을 매각할 경우 일반경쟁 입찰은 그 매각수량의 범위 안에서 수요자의 매수희망 수량과 그 단가를 입찰하게 할 수 있다.\n② 다량의 수요물품을 제조 또는 구매할 경우의 일반경쟁 입찰은 그 수요 수량의 범위 안에서 공급자가 공급할 희망수량과 그 단가를 입찰하게 할 수 있다.","hist":"","id":28,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"27","label":"제27조(희망수량 경쟁입찰의 대상범위)","chapter":"제3장 계약의 방법","page":11,"part":"","text":"제27조(희망수량 경쟁입찰의 대상범위) 제26조에 따라 희망수량 경쟁입찰의 방법에 의할 수 있는 경우는 다음 각 호와 같다.\n1. 1인의 능력이나 생산시설로는 그 공급이 불가능하거나 곤란하다고 인정되는 다량의 동일물품을 제조하게 하거나 구매할 경우\n2. 1인의 능력으로는 그 매수가 불가능하거나 곤란하다고 인정되는 다량의 동일 물품을 매각할 경우\n3. 수인의 공급자 또는 매수자와 분할계약하는 것이 가격․품질, 그 밖의 조건에 있어서 본회에 유리하다고 인정되는 다량의 동일 물품을 제조․구매 또는 매각할 경우","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":29,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"28","label":"제28조(희망수량 경쟁입찰의 입찰공고)","chapter":"제3장 계약의 방법","page":11,"part":"","text":"제28조(희망수량 경쟁입찰의 입찰공고) 희망수량 경쟁입찰에 의하는 경우의 입찰공고에는 다음 각 호의 사항을 명시하여야 한다.\n1. 희망수량에 의한 일반경쟁입찰이라는 사항\n2. 제47조 각 호의 사항\n3. 제58조제3항에 따른 입찰수량과 낙찰수량의 조정에 관한 사항\n4. 그 밖에 입찰에 필요한 사항","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":30,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"29","label":"제29조(2종이상의 물품에 대한 희망수량경쟁입찰)","chapter":"제3장 계약의 방법","page":11,"part":"","text":"제29조(2종이상의 물품에 대한 희망수량경쟁입찰) 계약담당자는 2종이상의 물품에 대하여 희망수량 경쟁입찰에 부치고자 하는 경우에는 물품의 종류별로 단가 및 수량에 대하여 입찰을 하게 하여야 한다.","hist":"","id":31,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"30","label":"제30조(재입찰 및 재공고입찰)","chapter":"제3장 계약의 방법","page":11,"part":"","text":"제30조(재입찰 및 재공고입찰) ① 경쟁입찰에 있어서 2인 이상의 유효한 입찰자가 없거나 낙찰자가 없을 경우 재입찰에 부칠 수 있다. 이 경우 재입찰은 새로운 입찰로 보지 아니하며, 입찰자 또는 입찰횟수의 제한을 받지 아니한다.\n② 입찰자나 낙찰자가 없는 경우 또는 낙찰자가 계약을 체결하지 아니하는 경우에는 재공고 입찰에 부칠 수 있다.","hist":"\u003c개정 2021. 5.21>","id":32,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"31","label":"제31조(제한경쟁에 의할 계약)","chapter":"제3장 계약의 방법","page":11,"part":"1/2","text":"제31조(제한경쟁에 의할 계약) ① 제5조 단서에 따라 경쟁참가자의 자격을 제한할 수 있는 경우와 그 자격조건은 다음 각 호와 같다.\n1. 공사 추정가격이 30억원(「건설산업기본법」에 따른 전문공사, 「전기공사업법」에 따른 전기공사, 「정보통신공사업법」에 따른 정보통신공사 또는 「 소방시설공사업법」에 따른 소방공사의 경우에는 3억원)이상의 경우, 자격조건은 시공능력 또는 당해 공사와 같은 종류의 공사실적\n2. 물품의 제조․구매 추정가격이 3억원 이상의 경우, 자격조건은 당해 물품과 같은 종류의 제조 또는 납품실적\n3. 용역 추정가격이 3억원 이상의 경우, 자격조건은 당해 용역과 같은 종류의 용역수행실적\n4. 특수한 기술 또는 공법이 요구되는 공사계약의 경우에는 당해 공사수행에 필요한 기술의 보유상황 또는 당해 공사와 같은 종류의 공사실적\n5. 특수한 설비 또는 기술이 요구되는 물품제조계약의 경우에는 당해 물품 제조에 필요한 설비 및 기술의 보유상황 또는 당해 물품과 같은 종류의 물품제조실적\n6. 특수한 성능 또는 품질이 요구되는 물품구매계약의 경우에는 당해 물품의 납품능력\n7. 특수한 기술이 요구되는 용역계약의 경우에는 당해 용역수행에 필요한 기술의 보유상황 또는 당해 용역과 같은 종류의 용역수행실적\n8. 공사의 현장 또는 납품지를 관할하는 특별시․광역시․특별자치시․도 또는 특별자치도의 지역안에 본사 또는 주된 공장이 있는 자로 제한하는 경우\n9. 「중소기업제품 구매촉진 및 판로지원에 관한 법률 시행령」 제6조에 따라 중소벤처기업부장관이 지정․고시한 물품을 제조․구매하는 경우에는 「 중소기업기본법」 제2조에 따른 중소기업자\n10. 「중소기업제품 구매촉진 및 판로지원에 관한 법률 시행령」 제2조의2에 따라 고시금액 미만의 물품의 제조․구매 또는 용역의 경우에는 「중소기업기본법」 제2조에 따른 중소기업자\n11. 그 밖에 지도경제대표이사가 필요하다고 인정하는 경우\n② 계약담당자는 제1항에 따라 제한경쟁입찰에 참가할 자의 자격을 제한함에 있어 공사·용역 또는 제조 등의 실적, 시공능력에 따라 제한하는 경우에는 다음 각 호의 기준에 따른다.\n1. 공사·제조 또는 용역 등의 경우에는 다음 각 목의 실적\n가. 공사·제조 또는 용역 등의 실적의 규모 또는 양에 의하는 경우에는 당해 계약목적물의 규모 또는 양의 1배 이내","hist":"\u003c개정 2015.11.20> \u003c개정 1999. 4.10, 2002. 7. 8, 2014.12. 5, 2015.11.20> \u003c신설 2015.11.20> \u003c신설 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2014.12. 5, 개정 2015.11.20> \u003c개정 2015.11.20> \u003c신설 2010.12. 2, 2015.11.20, 2021. 5.21> \u003c신설 2015.11.20> \u003c개정 2002. 7. 8, 2010.12. 2, 2014.12. 5, 2015.11.20> \u003c신설 2015.11.20> \u003c개정 2015.11.20.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.>","id":33,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"31","label":"제31조(제한경쟁에 의할 계약)","chapter":"제3장 계약의 방법","page":11,"part":"2/2","text":"나. 공사·제조 또는 용역 등의 실적의 금액에 의하는 경우에는 당해 계약목적물의 추정가격(다른 법령에서 시공능력 적용 시 지급자재비를 포함하고 있는 경우에는 추정금액을 말한다. 이하 이 항에서 같다)의 1배 이내\n2. 시공능력의 경우에는 당해 추정가격의 2배 이내\n③ 계약담당자는 제1항에 따라 입찰참가자의 자격을 제한하고자 할 때에는 입찰공고에 그 제한기준을 명시하여야 한다.\n④ 계약담당자는 제1항에 따라 제한경쟁입찰에 참가할 자의 자격을 제한하고자 하는 경우에 이행의 난이도, 규모의 대소, 수급상황 등을 적정하게 고려하여야 한다. 다만, 다음 각호와 같이 경쟁참가자의 자격을 제한하여서는 아니 된다.\n1. 물품의 제조·구매입찰시 부당하게 특정상표 또는 특정규격 또는 모델을 지정하여 입찰에 부치는 경우\n2. 입찰조건, 시방서 및 규격서 등에서 정한 규격⋅품질⋅성능과 동등이상의 물품을 납품한 경우에 특정상표 또는 모델이 아니라는 이유로 납품을 거부하는 경우","hist":"\u003c개정 2015.11.20> \u003c개정 1999. 4.10, 2002. 7. 8, 2014.12. 5, 2015.11.20> \u003c신설 2015.11.20> \u003c신설 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2014.12. 5, 개정 2015.11.20> \u003c개정 2015.11.20> \u003c신설 2010.12. 2, 2015.11.20, 2021. 5.21> \u003c신설 2015.11.20> \u003c개정 2002. 7. 8, 2010.12. 2, 2014.12. 5, 2015.11.20> \u003c신설 2015.11.20> \u003c개정 2015.11.20.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.>","id":34,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"32","label":"제32조(지명경쟁에 의할 계약)","chapter":"제3장 계약의 방법","page":13,"part":"","text":"제32조(지명경쟁에 의할 계약) 제5조 단서에 따라 지명경쟁에 부칠 수 있는 경우는 다음 각 호와 같다.\n1. 계약의 성질 또는 목적에 비추어 특수한 설비․기술․자재․물품 또는 실적이 있는 자가 아니면 계약의 목적을 달성하기 곤란하다고 인정할 때\n2. 「산업표준화법」 제15조에 따라 규격 표시를 인증 받은 제품을 구매할 경우\n3. 삭제\n4. 「자원의 절약과 재활용촉진에 관한 법률」 제33조에 적합하고 「환경기술 및 환경산업 지원법」 제17조에 따른 환경표지의 인증을 받은 제품을 제조하게 하거나 구매하는 경우\n5. 「중소기업제품 구매촉진 및 판로지원에 관한 법률 시행령」 제6조에 따라 중소벤처기업부장관이 지정․고시한 물품을 「중소기업기본법」 제2조의 중소기업자와 제조 또는 구매계약을 할 경우\n6. 추정가격이 3억원(「건설산업기본법」에 따른 전문공사, 「전기공사업법」에 따른 전기공사, 「정보통신공사업법」에 따른 정보통신공사 또는 「소방시설공사업법」 에 따른 소방공사의 경우에는 1억원)이하인 공사를 하거나 추정가격이 1억원 이하인 물품을 제조할 때와 추정가격이 5천만원 이하인 재산의 매매를 할 때, 다만 경제사업 수행상 따로 정한 경우에는 그러하지 아니하다.\n7. 추정임대차료의 연액 또는 총액이 5천만원 이하인 물건을 임대차 할 때\n8. 제6호 및 제7호 이외의 계약으로서 추정가격이 5천만원 이하인 때\n9. 수출입상 부득이 할 때\n10. 시일․그 밖에 관계로 지도경제대표이사가 부득이하다고 인정할 때","hist":"\u003c개정 2015.11.20> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20, 2017.12. 1> \u003c2002. 7. 8> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20> \u003c개정 2002. 7. 8, 2010.12. 2, 2014.12. 5, 2015.11.20, 2021. 5.21> \u003c개정 2002. 7. 8, 2008. 6.20, 2014.12. 5, 2015.11.20> \u003c개정 2008. 6.20> \u003c개정 2008. 6.20> \u003c개정 2002. 7. 8, 2010.12. 2, 2015.11.20>","id":35,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"33","label":"제33조(지명경쟁입찰 대상자의 지명)","chapter":"제3장 계약의 방법","page":14,"part":"","text":"제33조(지명경쟁입찰 대상자의 지명) ① 계약담당자는 제32조에 따라 지명경쟁 입찰에 부치고자 할 때에는 5인 이상의 입찰대상자를 지명하여 2인 이상의 입찰참가신청이 있어야 한다. 다만, 지도경제대표이사가 부득이하다고 인정한 경우에는 지명대상자를 5인 미만으로 할 수 있다.\n② 제1항의 경우에는 제47조 각 호의 사항을 입찰대상자에게 통지하여야 한다.\n③ 제1항에 따라 입찰대상자를 지명하고자 할 때에는 입찰일 또는 개찰일의 전일부터 기산하여 7일 전에 통지하여야 한다. 다만, 제46조 제4항 각 호의 어느 하나에 해당하는 경우에는 입찰일 5일전까지 통지할 수 있다.","hist":"\u003c개정 2002. 7. 8, 2010.12. 2, 2015.11.20, 2021. 5.21> \u003c개정 2015.11.20., 2016.10.25., 2019.11.15., 2022.4.12>","id":36,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"34","label":"제34조(지명경쟁계약 근거)","chapter":"제3장 계약의 방법","page":14,"part":"","text":"제34조(지명경쟁계약 근거) 계약담당자가 지명경쟁에 의한 계약을 체결하고자 할 경우에는 다음 각 호의 사유를 명백히 한 서류를 구비하여야 한다.\n1. 계약의 목적\n2. 품명․수량․규격․소요예산 및 예산과목\n3. 적용조문 및 구체적인 적용사유\n4. 지명기준\n5. 지명대상자의 주소, 성명\n6. 지명대상자의 업태현황\n7. 그 밖에 참고사항","hist":"\u003c개정 2015.11.20>","id":37,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"35","label":"제35조(유사물품의 복수경쟁)","chapter":"제3장 계약의 방법","page":14,"part":"","text":"제35조(유사물품의 복수경쟁) 계약담당자는 품질․성능 또는 효율 등에 차이가 있는 유사한 종류의 물품중에서 품질․성능 또는 효율 등이 일정한 수준 이상인 물품을 지정하여 구매하고자 하는 경우에는 복수경쟁에 부칠 수 있다. 이 경우에는 유사한 종류의 물품별로 작성된 예정가격에 대한 입찰금액의 비율이 가장 낮은 입찰자로 낙찰자로 한다.","hist":"","id":38,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"36","label":"제36조(수의계약에 의할 수 있는 경우)","chapter":"제3장 계약의 방법","page":15,"part":"1/4","text":"제36조(수의계약에 의할 수 있는 경우) 제5조 단서에 따라 수의계약에 의할 수 있는 경우는 다음 각 호와 같다.\n1. 천재지변, 긴급한 행사, 비상재해, 원자재의 가격급등, 그 밖에 이에 준하는 경우로서 경쟁에 부칠 여유가 없을 때\n2. 추정가격이 다음 각 목의 금액 이하인 계약의 경우. 다만, 경제사업 관련 제규정에서 별도로 정한 경우에는 그러하지 아니한다.\n가. 「건설산업기본법」에 의한 건설공사 : 4억원\n나. 「건설산업기본법」에 의한 전문공사 : 2억원\n다. 「전기공사업법」에 의한 전기공사, 「정보통신공사업법」에 의한 정보통신공사, 「 소방시설공사업법」에 의한 소방시설공사 : 1억6천만원\n라. 물품의 제조․구매, 용역, 동산․부동산의 매각 등 그 밖의 계약 : 2천만원\n3. 추정임대차료의 연액 또는 총액이 5천만원이하인 물건을 임대차할 때\n4. 물품의 가공․하역․운송 또는 보관을 하게 함에 있어서 경쟁에 부치는 것이 불리하다고 인정될 때\n5. 회원, 어촌계, 국가, 지방자치단체, 「공공기관의 운영에 관한 법률」에 따라 기획재정부장관이 지정한 공공기관, 「금융실명거래 및 비밀보장에 관한 법률」 에 따른 금융회사, 「농업협동조합법」 또는 「산림조합법」에 따라 설립된 법인, 본회가 납입자본금의 50%이상을 출자한 기업체, 회원이 납입자본금의 50% 이상을 출자한 기업체, 「농업협동조합법」 또는 「산림조합법」에 따라 설립된 법인이 납입자본금의 50%이상을 출자한 기업체를 상대로 하는 계약을 할 때\n6. 특정인의 기술․용역 또는 특정한 위치․구조․품질․성능․효율 등으로 인하여 경쟁을 할 수 없는 경우로서 다음 각 목의 경우\n가. 공사에 있어서 장래 시설물의 하자에 대한 책임구분이 곤란한 경우로서 직전 또는 현재의 시공자와 계약을 하는 경우\n나. 작업상의 혼잡 등으로 동일현장에서 2인이상이 시공자가 공사를 할 수 없는 경우로서 현재의 시공자와 계약을 하는 경우\n다. 마감공사에 있어서 직전 또는 현재의 시공자와 계약을 하는 경우\n라. 특수지역의 공사로서 사실상 경쟁이 불가능한 경우","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 1999. 4.10, 2002. 7. 8, 2008. 6.20, 2010.12. 2, 2011. 5.19, 2014.12. 5, 2015.11.20., 2021.10.28., 2023.3.9., 2023.12.22., 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c개정 2010.12. 2> \u003c개정 2002. 7. 8, 2014.12. 5, 2015.11.20., 2021.10.28.> \u003c개정 2014.12. 5, 2015.11.20, 2025. 5. 7.> \u003c개정 2014.12. 5> \u003c개정 2019.11.15, 2021. 5.21> \u003c개정 2016.10.25> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20, 2017.12. 1> \u003c개정 2014.12. 5, 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5> \u003c개정 2015.11.20> \u003c개정 2019.11.15> \u003c개정 2016.10.25> \u003c개정 2010.12. 2> \u003c신설 2015.11.20, 개정 2016.10.25> \u003c신설 2015.11.20, 개정 2016.10.25., 2020.10.23., 2022.4.12.> \u003c신설 2019.11.15.> \u003c신설 2020.10.23., 개정 2025. 5. 7.> \u003c신설 2023.12.22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c개정 2015.11.20., 2016.10.25., 2019.11.15., 2020.10.23., 2023.12.22.>","id":39,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"36","label":"제36조(수의계약에 의할 수 있는 경우)","chapter":"제3장 계약의 방법","page":15,"part":"2/4","text":"마. 특허공법을 적용하는 공사 또는 「건설기술 진흥법」 제14조에 따라 지정·고시된 신기술, 「환경기술 및 환경산업 지원법」 제7조에 따라 인증받은 신기술이나 검증받은 기술 또는 「재난안전산업 진흥법」 제14조에 따라 지정된 재난안전신기술(각 해당 법률에 따라 지정된 보호기간 또는 유효기간 내의 경우로 한정한다)을 적용하는 공사로서 사실상 경쟁이 불가능한 경우\n바. 당해 물품을 제조, 공급한 자가 직접 그 물품을 설치․조립 또는 정비하는 경우\n사. 특허를 받았거나 실용신안등록 또는 의장등록이 된 물품을 제조하게 하거나 구매하는 경우. 다만, 일정한 규격 및 내용을 제시하여 제조하게 할 수 있거나 다른 물품의 구매로도 사업목적을 달성할 수 있는 경우를 제외한다.\n아. 당해 물품의 생산자, 소지자 또는 홍보용역수행자가 1인뿐인 경우로서 다른 물품을 제조, 구매하거나 다른 홍보용역수행자로는 사업목적을 달성할 수 없는 경우\n자. 이미 조달된 물품의 부품교환 또는 설비확충 등을 위하여 조달하는 경우로서 해당 물품을 제조·공급한 자 외의 자로부터 제조·공급을 받게 되면 호환성이 없게 되는 경우\n차. 특정인의 기술을 요하는 조사․설계․감리․특수측량․훈련․시설관리와 특정인과의 학술연구 및 전산프로그램 개발을 위한 용역계약\n카. 특정인의 토지․건물 등 부동산을 매입하거나 재산을 임차 또는 특정인에게 임대하는 경우\n7. 「산업표준화법」 제15조에 따라 규격 표시를 인증받은 제품, 「중소기업제품 구매촉진 및 판로지원에 관한 법률」 제15조에 따라 성능 인정을 받은 제품, 「 환경기술 및 환경산업 지원법」 제17조에 따라 환경표지의 인증을 받은 제품으로서 동 물품의 생산자가 1인뿐인 경우에 그 생산자로 부터 제조․구매하는 경우\n8. 국가유공자 또는 장애인 등에게 일자리나 보훈⋅복지서비스 등을 제공하기 위한 목적으로 설립된 다음 각 목의 어느 하나에 해당하는 단체 등과 물품의 제조·구매·임차계약 또는 용역 계약(해당 단체가 직접 생산하는 물품 및 직접 수행하는 용역에 한정한다)을 체결하거나, 그 단체 등에 직접 물건을 매각·임대하는 경우\n가. 국가보훈부장관이 지정하는 국가유공자 자활집단촌의 복지공장\n나. 「국가유공자 등 단체설립에 관한 법률」에 따라 설립된 단체 중 상이를 입은 자들로 구성된 단체\n다. 「중증장애인생산품 우선구매 특별법」 제9조제1항에 따라 지정받은 중증장애인생산품 생산시설","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 1999. 4.10, 2002. 7. 8, 2008. 6.20, 2010.12. 2, 2011. 5.19, 2014.12. 5, 2015.11.20., 2021.10.28., 2023.3.9., 2023.12.22., 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c개정 2010.12. 2> \u003c개정 2002. 7. 8, 2014.12. 5, 2015.11.20., 2021.10.28.> \u003c개정 2014.12. 5, 2015.11.20, 2025. 5. 7.> \u003c개정 2014.12. 5> \u003c개정 2019.11.15, 2021. 5.21> \u003c개정 2016.10.25> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20, 2017.12. 1> \u003c개정 2014.12. 5, 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5> \u003c개정 2015.11.20> \u003c개정 2019.11.15> \u003c개정 2016.10.25> \u003c개정 2010.12. 2> \u003c신설 2015.11.20, 개정 2016.10.25> \u003c신설 2015.11.20, 개정 2016.10.25., 2020.10.23., 2022.4.12.> \u003c신설 2019.11.15.> \u003c신설 2020.10.23., 개정 2025. 5. 7.> \u003c신설 2023.12.22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c개정 2015.11.20., 2016.10.25., 2019.11.15., 2020.10.23., 2023.12.22.>","id":40,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"36","label":"제36조(수의계약에 의할 수 있는 경우)","chapter":"제3장 계약의 방법","page":15,"part":"3/4","text":"라. 「사회복지사업법」 제16조에 따라 설립된 사회복지법인\n마. 「장애인고용촉진 및 직업재활법」 제22조의4제1항에 따라 인증받은 장애인 표준사업장\n9. 「농어촌정비법」에 따른 농공단지에 입주한 공장(새마을공장을 포함한다)이 직접 생산하는 물품을 이들로 부터 제조․구매할 경우\n10. 특별법으로 설립된 법인이 당해 법률에서 정한 사업을 영위함으로써 직접 생산하는 물품의 제조․구매 또는 용역계약(해당 단체가 직접 생산하는 물품 및 직접 수행하는 용역에 한정한다)을 하는 경우\n11. 「사회복지사업법」에 따라 설립된 법인이 직접 생산하는 물품을 제조․구매하는 경우\n12. 국가보훈처장이 지정하는 국가유공자 자활 집단촌의 복지공장에서 직접 생산하는 물품을 그 생산자로부터 제조․구매하는 경우\n13. 외자도입 및 수출입계약(수출용 특정 물품의 제조·구매 계약을 포함한다)\n14. 본회「선수물자․기자재 업무방법서」에 따른 어업용 선수물자 및 기자재 계통구매계약상 필요할 때\n15. 수산물 가격지지 및 가격안정을 위하여 수산물을 구매․판매할 때\n16. 본회의 업무용부동산 중 공동주택(아파트, 연립주택, 휴양시설 등)을 분양가격에 따라 취득하거나 공인중개사의 중개를 통하여 처분할 경우\n17. 법률(소송 포함)․회계․세무․신용평가․감정평가업무를 외부 법무법인, 회계법인, 신용평가법인 및 감정평가법인 등에 의뢰하면서 업무의 연속성 또는 전문성을 위해 필요하다고 지도경제대표이사가 인정하는 경우. 다만, 신용평가업무는 「 수산업협동조합법」에 따른 수산금융채권 발행업무에 한한다.\n18. 본회「유류공급사업요령」에 따른 어업용 면세유류 구매 계약상 필요할 때\n19. 본회「해외사무소 운영 요령」에 따른 해외사무소(이하 “해외사무소”라 한다)에서 사용하는 물품을 현지에서 제조하게 하거나 구매 또는 임차하는 경우\n20. 추정가격이 2천만원 초과 1억원 이하인 계약으로서 다음의 어느 하나에 해당하는 자와 체결하는 물품의 제조․구매계약 또는 용역 계약의 경우\n가. 「중소기업기본법」제2조제2항에 따른 소기업 또는 「소상공인기본법」제2조에 따른 소상공인과 체결하는 경우\n나. 학술연구․원가계산․건설기술 등과 관련된 계약으로서 특수한 지식․기술 또는 자격을 요구하는 경우\n다. 「여성기업지원에 관한 법률」제2조제1호에 따른 여성기업\n라. 「장애인기업활동 촉진법」제2조제2호에 따른 장애인기업","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 1999. 4.10, 2002. 7. 8, 2008. 6.20, 2010.12. 2, 2011. 5.19, 2014.12. 5, 2015.11.20., 2021.10.28., 2023.3.9., 2023.12.22., 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c개정 2010.12. 2> \u003c개정 2002. 7. 8, 2014.12. 5, 2015.11.20., 2021.10.28.> \u003c개정 2014.12. 5, 2015.11.20, 2025. 5. 7.> \u003c개정 2014.12. 5> \u003c개정 2019.11.15, 2021. 5.21> \u003c개정 2016.10.25> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20, 2017.12. 1> \u003c개정 2014.12. 5, 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5> \u003c개정 2015.11.20> \u003c개정 2019.11.15> \u003c개정 2016.10.25> \u003c개정 2010.12. 2> \u003c신설 2015.11.20, 개정 2016.10.25> \u003c신설 2015.11.20, 개정 2016.10.25., 2020.10.23., 2022.4.12.> \u003c신설 2019.11.15.> \u003c신설 2020.10.23., 개정 2025. 5. 7.> \u003c신설 2023.12.22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c개정 2015.11.20., 2016.10.25., 2019.11.15., 2020.10.23., 2023.12.22.>","id":41,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"36","label":"제36조(수의계약에 의할 수 있는 경우)","chapter":"제3장 계약의 방법","page":15,"part":"4/4","text":"마. 「사회적기업 육성법」제2조제1호에 따른 사회적기업, 「협동조합 기본법」 제2조제3호에 따른 사회적협동조합, 「국민기초생활 보장법」제18조에 따른 자활기업 또는 「도시재생 활성화 및 지원에 관한 특별법」제2조제1항제9호에 따른 마을기업 중 기획재정부장관이 정하는 요건을 충족하는 자\n21. 제1호부터 제20호까지의 규정 이외에 계약의 목적, 성질상 수의계약에 의하는 것이 불가피할 때","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 1999. 4.10, 2002. 7. 8, 2008. 6.20, 2010.12. 2, 2011. 5.19, 2014.12. 5, 2015.11.20., 2021.10.28., 2023.3.9., 2023.12.22., 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c개정 2010.12. 2> \u003c개정 2002. 7. 8, 2014.12. 5, 2015.11.20., 2021.10.28.> \u003c개정 2014.12. 5, 2015.11.20, 2025. 5. 7.> \u003c개정 2014.12. 5> \u003c개정 2019.11.15, 2021. 5.21> \u003c개정 2016.10.25> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20, 2017.12. 1> \u003c개정 2014.12. 5, 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5> \u003c개정 2015.11.20> \u003c개정 2019.11.15> \u003c개정 2016.10.25> \u003c개정 2010.12. 2> \u003c신설 2015.11.20, 개정 2016.10.25> \u003c신설 2015.11.20, 개정 2016.10.25., 2020.10.23., 2022.4.12.> \u003c신설 2019.11.15.> \u003c신설 2020.10.23., 개정 2025. 5. 7.> \u003c신설 2023.12.22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c신설 2023. 12. 22.> \u003c개정 2015.11.20., 2016.10.25., 2019.11.15., 2020.10.23., 2023.12.22.>","id":42,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"36-2","label":"제36조의2(공사, 물품, 용역 등에 대한 수의계약 특례)","chapter":"제3장 계약의 방법","page":18,"part":"","text":"제36조의2(공사, 물품, 용역 등에 대한 수의계약 특례)","hist":"\u003c삭제 2021.10.28.>","id":43,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"36-3","label":"제36조의3(계약심의위원회 설치)","chapter":"제3장 계약의 방법","page":18,"part":"","text":"제36조의3(계약심의위원회 설치) ① 계약담당자는 제36조제21호의 경우에는 계약심의위원회의 심의를 거쳐야 한다.\n② 계약심의위원회의 설치 및 운영 등에 관하여는 지도경제대표이사가 별도로 정한다.","hist":"\u003c개정 2015.11.20., 2016.10.25., 2019.11.15., 2020. 9. 11., 2020.10.23., 2023.12.22.> \u003c신설 2011.10.31>","id":44,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"37","label":"제37조(재공고 입찰등과 수의계약)","chapter":"제3장 계약의 방법","page":18,"part":"","text":"제37조(재공고 입찰등과 수의계약) ① 제30조제2항에 따라 재공고 입찰에 부친 경우로써 입찰자 또는 낙찰자가 없을 때 또는 제17조에 따라 경쟁입찰을 실시하였으나 입찰자가 1인뿐인 경우로써 재공고 입찰을 실시하더라도 제20조에 따른 입찰참가 자격을 갖춘 자가 1인밖에 없음이 명백하다고 인정될 때에는 수의계약에 의할 수 있다. 이 경우 보증금과 기한을 제외하고는 최초의 입찰에 부칠 때에 정한 가격 및 그 밖의 조건을 변경할 수 없다.\n② 제1항은 재지명 경쟁입찰에 부친 경우에 이를 준용한다.","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":45,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"38","label":"제38조(낙찰자가 계약을 체결하지 아니할 때의 수의계약)","chapter":"제3장 계약의 방법","page":18,"part":"","text":"제38조(낙찰자가 계약을 체결하지 아니할 때의 수의계약) ① 낙찰자가 계약을 체결하지 아니할 때에는 그 낙찰금액보다 불리하지 아니한 금액의 범위안에서 수의계약에 의할 수 있다. 다만, 기한을 제외하고는 최초의 입찰에 부칠 때 정한 가격 및 그 밖의 조건을 변경할 수 없다.\n② 제1항은 낙찰자가 계약체결 후 소정의 기일내에 계약의 이행에 착수하지 아니하거나, 계약이행에 착수한 후 계약상의 의무를 이행하지 아니하여 계약을 해제 또는 해지한 경우에 이를 준용한다.","hist":"\u003c개정 2015.11.20> \u003c개정 1997. 2.14, 2015.11.20>","id":46,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"39","label":"제39조(분할 수의계약)","chapter":"제3장 계약의 방법","page":19,"part":"","text":"제39조(분할 수의계약) 제37조 및 제38조의 경우에 있어서는 예정가격 또는 낙찰금액을 분할하여 계산할 수 있는 경우에 한하여 그 가격 또는 금액보다 불리하지 아니한 금액의 범위안에서 수인에게 분할하여 계약을 할 수 있다.","hist":"","id":47,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"40","label":"제40조(견적서의 제출요구)","chapter":"제3장 계약의 방법","page":19,"part":"","text":"제40조(견적서의 제출요구) ① 계약담당자는 수의계약을 체결하고자 할 때에는 2인 이상으로부터 견적서를 받아야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 1인으로부터 받은 견적서에 의할 수 있다.\n1. 제36조 제5호(본회 또는 회원이 납입자본금의 50%이상을 출자한 기업체, 국가, 지방자치단체를 상대로 하는 계약에 한한다)부터 제7호까지, 제13호(다만, 수출용 특정 물품의 제조·구매 계약은 불가피한 경우에 한한다), 제14호 및 제16호부터 제18호까지의 규정에 따른 계약의 경우\n2. 제37조 및 제38조에 따른 계약의 경우\n3. 추정가격이 2천만원 이하인 경우. 다만, 제36조 제20호 다목부터 마목까지의 어느 하나에 해당하는 자와 계약을 체결하는 경우에는 5천만원 이하인 경우로 한다.\n② 제1항에도 불구하고 다음 각 호의 경우에는 견적서 제출을 생략하게 할 수 있다.\n1. 전기․가스․수도 등의 공급계약\n2. 추정가격이 10만원 미만인 물품의 제조․구매․임차 및 용역계약\n3. 제36조 제3호에 따른 임대차 계약","hist":"\u003c개정 2002. 7. 8, 2011. 5.19, 2015.11.20., 2019.11.15> \u003c개정 2021.10.28.> \u003c개정 2023.12.22., 2024. 10. 15.> \u003c개정 2015.11.20> \u003c신설 2021.10.28.>","id":48,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"41","label":"제41조(견적에 의한 가격결정)","chapter":"제3장 계약의 방법","page":19,"part":"","text":"제41조(견적에 의한 가격결정) ① 계약담당자는 수의계약을 체결하고자할 경우에는 계약상대자에게 견적서를 제출하게 하여야 한다.\n② 제1항에 따라 제출받은 견적서에 기재된 견적가격이 예정가격의 범위에 포함되지 아니하는 경우 등 계약상대자를 결정할 수 없는 때에는 다시 견적서를 제출받아 계약금액을 결정하여야 한다.\n③ 계약담당자는 제1항 또는 제2항에 따라 견적서를 제출받은 경우 견적서를 제출한 자 중 최저가격으로 견적서를 제출한 자를 계약상대자로 결정한다.","hist":"\u003c개정 2015.11.20.> \u003c신설 2024. 10. 15.>","id":49,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"42","label":"제42조(계속공사에 대한 수의계약시의 계약금액)","chapter":"제3장 계약의 방법","page":20,"part":"","text":"제42조(계속공사에 대한 수의계약시의 계약금액) 계속공사에 있어서 당해 공사이후의 계약금액은 예정가격에 제1차 공사의 낙찰률(예정가격에 대한 낙찰금액 또는 계약금액의 비율을 말한다)을 곱한 금액이하로 하여야 한다. 다만, 공사집행상 불가피하다고 인정할 경우에는 그러하지 아니할 수 있다.","hist":"","id":50,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"43","label":"제43조(수의계약 적용사유에 대한 근거서류)","chapter":"제3장 계약의 방법","page":20,"part":"","text":"제43조(수의계약 적용사유에 대한 근거서류) 계약담당자는 수의계약을 체결하고자 할 때에는 다음 각 호의 사항을 명백히 한 근거 서류를 구비하여야 한다.\n1. 계약의 목적\n2. 품명, 규격, 수량, 단가, 금액, 단가 또는 금액의 산출기초와 예산과목\n3. 적용조문 및 구체적인 적용사유\n4. 삭제\n5. 계약서(안)\n6. 「수협중앙회 임직원의 이해충돌 방지제도 운영지침」(이하 이 조에서 “운영지침”이라 한다)제11조에 따른 수의계약 체결 제한 여부 확인서.\n7. 법령에 따라 인증·허가·면허·등록·신고 등을 요하거나 자격요건을 갖추어야 할 경우에는 이를 확인할 수 있는 관계관서에서 발행한 문서\n8. 그 밖에 참고사항","hist":"\u003c2024. 10. 15.> \u003c신설 2023.03.09., 개정 2025. 5. 7.> \u003c개정 2024. 10. 15.> \u003c개정 2015.11.20> \u003c신설 2024. 10. 15.>","id":51,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"44","label":"제44조(경쟁계약에 관한 규정의 준용)","chapter":"제3장 계약의 방법","page":20,"part":"","text":"제44조(경쟁계약에 관한 규정의 준용) 제20조 및 제20조의2는 수의계약의 경우에 이를 준용한다.","hist":"\u003c개정 2014.12. 5, 2015.11.20., 2023.03.09.>","id":52,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"44-2","label":"제44조의2(용역업무의 재위탁)","chapter":"제3장 계약의 방법","page":20,"part":"","text":"제44조의2(용역업무의 재위탁) ① 본회가 수탁받은 용역업무를 효율적으로 수행하기 위하여 용역업무의 일부를 재위탁할 경우에는 제5조에 따라 경쟁입찰에 부쳐야 한다. 다만, 위탁자가 재위탁자 등을 지정하여 위탁하거나 추정가격이 2천만 원 미만인 경우에는 수의계약으로 체결할 수 있다.\n② 용역담당자는 용역비의 집행과 정산이 포함된 계약서 또는 승낙서, 증빙서 등을 작성·비치하여야 한다.","hist":"\u003c신설 2014.12. 5>","id":53,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"45","label":"제45조(입찰공고)","chapter":"제4장 입찰 및 낙찰절차","page":20,"part":"","text":"제45조(입찰공고) ① 경쟁입찰에 부치고자 할 때에는 「전자조달의 이용 및 촉진에 관한 법률」제2조제4호에 따른 국가종합전자조달시스템(이하 “전자조달시스템”이라 한다)의 이용 또는 일간신문에 게재하거나 게시판에 게시하는 방법 등으로 공고하여야 한다.\n② 추정가격이 다음 각 호의 1에 해당할 경우에는 전자조달시스템을 이용하거나 일간신문에 게재하는 방법으로 공고하여야 한다. 다만, 전자조달시스템이나 일간신문에 공고할 필요가 없는 부득이한 사유가 있을 때에는 그러하지 아니할 수 있다.\n1. 공사의 경우 : 3억원 이상\n2. 물품제조의 경우 : 1억원 이상\n3. 물품의 구매, 용역, 그 밖의 경우 : 5천만원 이상\n③ 제19조 단서에 따른 전자자산처분시스템을 이용하는 경우, 제1항 및 제2항을 적용하지 아니할 수 있다.\n④ 계약담당자는 제1항에 따른 입찰공고 중 내용의 오류나 법령위반사항이 발견되어 공고사항의 정정이 필요한 경우에는 남은 공고기간에 5일 이상을 더하여 공고하여야 한다.","hist":"\u003c개정 2003. 3.31, 2016.10.25> \u003c개정 2003. 3.31, 2016.10.25> \u003c개정 2015.11.20> \u003c신설 2016.10.25> \u003c신설 2016.10.25>","id":54,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"46","label":"제46조(입찰공고의 시기)","chapter":"제4장 입찰 및 낙찰절차","page":21,"part":"","text":"제46조(입찰공고의 시기) ① 입찰공고는 그 입찰일 또는 개찰일의 전일부터 기산하여 7일 전에 이를 행하여야 한다. 다만, 수산물 판매를 위한 경우에는 그러하지 아니할 수 있다.\n② 공사입찰일 경우에는 제1항에도 불구하고 제23조에 따른 현장설명일의 전일부터 기산하여 7일전에 공고하여야 한다.\n③ 공사입찰일 경우로서 제23조제1항 단서에 따라 현장설명을 실시하지 아니하는 경우에는 제1항 및 제2항에도 불구하고 입찰일 또는 개찰일 전일부터 기산하여 다음 각 호의 기간전에 공고하여야 한다.\n1. 추정가격이 30억원 이상인 경우 : 25일\n2. 추정가격이 10억원 이상 30억원 미만인 경우 : 15일\n3. 추정가격이 10억원 미만인 경우 : 7일\n4. 삭제\n④ 제1항부터 제3항까지의 규정에도 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 입찰일 또는 개찰일 전일부터 기산하여 5일전까지 공고할 수 있다.\n1. 제30조제2항에 따른 재공고 입찰의 경우\n2. 다른 사업과 연계되어 일정조정을 위하여 불가피한 경우\n3. 긴급한 행사 또는 긴급한 재해예방･복구 등을 위하여 필요한 경우\n4. 그 밖에 제2호 및 제3호에 준하는 경우\n⑤ 제59조의2에 따른 협상에 의한 계약의 경우에는 제1항 및 제4항에도 불구하고 제안서 제출마감일의 전일부터 기산하여 25일전에 공고하여야 한다. 다만, 제4항 각 호의 어느 하나에 해당하는 경우에는 제안서 제출마감일의 전일부터 기산하여 10일 전까지 공고할 수 있다.","hist":"\u003c개정 2016.10.25., 2019.11.15> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2010.12. 2, 2019.11.15> \u003c개정 2010.12. 2, 2019.11.15> \u003c2019.11.15> \u003c전문개정 2003. 3.31, 2015.11.20, 2019.11.15> \u003c신설 2022.4.12>","id":55,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"47","label":"제47조(입찰공고의 내용)","chapter":"제4장 입찰 및 낙찰절차","page":22,"part":"","text":"제47조(입찰공고의 내용) 제45조에 따른 공고에는 다음의 사항을 명시하여야 한다.\n1. 입찰에 부치는 사항(공동도급 입찰의 경우에는 공동도급에 관한 사항)\n2. 입찰참가자의 자격에 관한 사항\n3. 별지 제7호부터 별지 제9호까지에 따른 입찰유의서 및 계약조건을 제시하는 일시 및 장소\n4. 입찰참가 신청마감, 입찰 또는 개찰의 일시 및 장소\n5. 공사 입찰의 경우에는 현장설명의 일시, 장소 및 참가자격\n6. 입찰보증금과 그 본회 귀속에 관한 사항\n7. 입찰의 무효에 관한 사항\n8. 복수예비가격 산정을 위한 예정가격기초금액을 작성한 경우에는 그 기초금액\n9. 낙찰자 결정방법\n10. 제17조제2항에 따른 공동계약을 허용할 경우에는 공동계약이 가능하다는 뜻과 공동 계약의 이행방식\n11. 청렴계약제 대상 계약 여부\n12. 입찰과 관련하여 각종 불공정행위, 부당요구 등을 근절하기 위해 감사 담당부서 연락처 및 전자민원 신고제도 운영에 대한 사항\n13. 그 밖에 입찰에 관하여 필요한 사항","hist":"\u003c개정 2015.11.20> \u003c개정 2024. 10. 15.> \u003c신설 2002. 7. 8> \u003c개정 2002. 7. 8> \u003c신설 2010.12. 2, 2015.11.20> \u003c신설 2010.12. 2> \u003c신설 2015.11.20> \u003c개정 2010.12. 2, 2015.11.20>","id":56,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"47-2","label":"제47조의2(분리발주)","chapter":"제4장 입찰 및 낙찰절차","page":22,"part":"","text":"제47조의2(분리발주) 삭제","hist":"\u003c2024. 10. 15.>","id":57,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"47-3","label":"제47조의3(공사의 분할계약금지)","chapter":"제4장 입찰 및 낙찰절차","page":22,"part":"","text":"제47조의3(공사의 분할계약금지) 계약담당자는 동일 구조물공사 및 단일공사로서 설계서등에 의하여 전체 사업내용이 확정된 공사는 이를 시기적으로 분할하거나 공사량을 분할하여 계약할 수 없다. 다만, 다음 각 호의 어느 하나에 해당하는 공사의 경우에는 그러하지 아니하다.\n1. 다른 법률에 의하여 다른 업종의 공사와 분리발주할 수 있도록 규정된 공사\n2. 공사의 성질이나 규모 등에 비추어 분할시공함이 효율적인 공사\n3. 하자책임구분이 용이하고 공정관리에 지장이 없는 다음 각 목의 어느 하나에 해당하는 공사로서 분리 시공하는 것이 효율적이라고 인정되는 공사\n가. 설계서가 별도로 작성되는 공사\n나. 공사의 성격상 공사의 종류별로 시공의 목적물, 시기와 장소 등이 명확히 구분되는 공사\n[본조신설 2024. 10. 15.]","hist":"","id":58,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"48","label":"제48조(입찰참가 신청)","chapter":"제4장 입찰 및 낙찰절차","page":23,"part":"","text":"제48조(입찰참가 신청) ① 계약담당자는 경쟁입찰에 부치고자 할 때에는 입찰참가 신청인으로 하여금 다음 각 호의 서류를 제출하게 하여야 한다. 다만, 제21조에 따라 자격등록을 한 자에 대하여는 입찰보증금의 납부로써 다음 각 호의 서류의 제출에 갈음하게 할 수 있다.\n1. 입찰참가 신청서\n2. 입찰참가자격을 증명하는 서류\n3. 그 밖에 입찰공고 또는 지명통지에서 요구한 서류\n② 입찰자가 입찰공고에 명시된 입찰참가 신청서류를 제출한 때에는 그 서류의 내용을 검토하여 접수하고 필요한 사항에 대하여 사실조사를 할 수 있다.\n③ 삭제","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c2015.11.20>","id":59,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"49","label":"제49조(입찰유의서 등의 승낙)","chapter":"제4장 입찰 및 낙찰절차","page":23,"part":"","text":"제49조(입찰유의서 등의 승낙) 계약담당자는 경쟁입찰에 부치고자 할 때에는 입찰참가자로 하여금 본회가 정하는 입찰유의서, 계약일반조건, 당해 계약의 특수조건, 설계서 등을 숙지하게 하고 이를 승낙한 자에 한하여 입찰에 참가하게 하여야 한다.","hist":"","id":60,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"50","label":"제50조(입찰방법)","chapter":"제4장 입찰 및 낙찰절차","page":23,"part":"","text":"제50조(입찰방법) ① 계약담당자는 경쟁입찰에 참가하고자 하는 자로 하여금 본회가 정한 서식에 의한 입찰서를 제출하게 하여야 한다.\n② 제1항에 따라 제출하는 입찰서는 1인 1통으로 한다.\n③ 계약담당자는 입찰에 참가하고자 하는 자가 입찰참가신청서 제출시 입찰대리인을 지정하는 경우에는 그 대리인을 당해 입찰에 참가하게 할 수 있다.\n④ 계약담당자는 입찰서를 접수한 때에는 개찰시까지 개봉하지 아니하고 보관하여야 한다.\n⑤ 제1항에 따라 제출하는 입찰서에 사용되는 인감은 입찰참가 신청서 제출시 신고한 인감과 같아야 한다.","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":61,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"51","label":"제51조(입찰보증금)","chapter":"제4장 입찰 및 낙찰절차","page":23,"part":"1/2","text":"제51조(입찰보증금) ① 경쟁입찰에 참가하고자 하는 자는 현금(체신관서 또는 「 은행법」의 적용을 받는 은행이 발행한 자기앞수표를 포함한다. 이하 같다), 외화(수출입시에 한한다. 이하 같다)로 입찰금액의 100분의 5이상의 보증금을 납부하여야 한다. 다만, 다음 각 호에 정한 보증서 또는 증권 등으로 현금에 갈음하여 납부할 수 있다.\n1. 「국가재정법 시행령」 제46조제4항에 따른 금융기관(이하 `금융기관'이라 한다.) 및 「은행법」에 따른 외국은행이 발행한 지급보증서\n2. 「자본시장과 금융투자업에 관한 법률 시행령」 제192조에 따른 증권\n3. 「보험업법」에 따른 보험사업자가 발행한 보증보험증권\n4. 다음 각 목의 어느 하나에 해당하는 기관이 발행한 채무액 등의 지급을 보증하는 보증서\n가. 「건설산업기본법」에 따른 공제조합\n나. 「전기공사공제조합법」에 따른 전기공사공제조합\n다. 「신용보증기금법」에 따른 신용보증기금\n라. 「기술신용보증기금법」에 따른 기술신용보증기금\n마. 「정보통신공사업법」에 따른 정보통신공제조합\n바. 「엔지니어링 산업진흥법」에 따른 엔지니어링공제조합\n사. 「산업발전법」에 따른 공제조합\n아. 「소프트웨어산업 진흥법」에 따른 소프트웨어공제조합\n자. 「전력기술관리법」에 따른 전력기술인단체(산업통상자원부장관이 기획재정부장관과 협의하여 고시하는 단체에 한정한다)\n차. 「건설폐기물의 재활용촉진에 관한 법률」에 따른 공제조합\n카. 「골재채취법」에 따른 공제조합\n타. 「지역신용보증재단법」에 따른 신용보증재단\n파. 「관광진흥법」에 따른 한국관광협회중앙회\n하. 「방위사업법」 제43조에 따라 보증업무를 수행하는 기관으로 지정받은 자\n거. 「건설기술 진흥법」에 따른 공제조합\n너. 「소방산업의 진흥에 관한 법률」에 따른 소방산업공제조합\n더. 「국가유산수리 등에 관한 법률」에 따른 국가유산수리협회\n러. 「건축사법」에 따른 건축사공제조합\n머. 「중소기업협동조합법」에 따른 중소기업중앙회\n버. 「콘텐츠산업 진흥법」 제20조의2에 따른 콘텐츠공제조합\n서. 「폐기물관리법」 제41조에 따른 폐기물 처리 공제조합\n어. 「공간정보산업 진흥법」 제24조에 따른 공간정보산업협회\n저. 「한국해양진흥공사법」에 따른 한국해양진흥공사\n처. 「조달사업에 관한 법률」 제32조의2에 따른 조달기업공제조합\n5. 제1호에 따른 금융기관 및 외국금융기관과 체신관서가 발행한 정기예금증서","hist":"\u003c개정 2014.12. 5> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20, 2016.10.25> \u003c개정 2002. 7. 8, 2010.12. 2, 2014.12. 5> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2016.10.25> \u003c개정 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2010.12. 2, 2014.12. 5> \u003c개정 2006. 4.26, 2010.12. 2, 2014.12. 5> \u003c개정 2021. 5.21> \u003c개정 2015.11.20, 2017.03.03, 2024. 10. 15.> \u003c개정 2016.10.25> \u003c개정 2002. 7. 8, 2014.12. 5, 2015.11.20> \u003c신설 1994. 4.10, 2014.12. 5, 2015.11.20> \u003c신설 1994. 4.10, 2015.11.20>","id":62,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"51","label":"제51조(입찰보증금)","chapter":"제4장 입찰 및 낙찰절차","page":23,"part":"2/2","text":"6. 「자본시장과 금융투자업에 관한 법률」에 따라 신탁업자가 발행하는 수익증권\n7. 「자본시장과 금융투자업에 관한 법률」에 따라 집합투자업자가 발행하는 수익증권\n② 단가입찰인 때에는 입찰하고자 하는 총예정량에 단가를 곱한 금액의 100분의 5이상을 입찰보증금으로 납부하여야 한다. 다만, 희망수량 경쟁입찰의 경우에는 당해 입찰참가자의 희망수량에 대하여 이를 적용한다.\n③ 다음 각 호의 1에 해당하는 경우에는 제1항 및 제2항의 입찰보증금의 전부 또는 일부의 납부를 면제할 수 있다.\n1. 제60조의2제1항제4호에 따라 계약할 때\n2. 국가기관 및 지방자치단체,「공공기관의 운영에 관한 법률」에 따른 공공기관, 정부가 납입자본금의 50% 이상을 출자한 기업체, 금융기관, 회원, 어촌계 및 본회가 납입자본금의 50% 이상을 출자한 기업체와 계약을 할 때\n3. 「농업협동조합법」, 「수산업협동조합법」 및 「산림조합법」에 따라 설립된 법인 및 동법인이 납입자본금의 50% 이상을 출자한 기업체와 계약을 할 때\n4. 「건설산업기본법」, 「전기공사업법」 또는 「정보통신공사업법」 등의 법령에 따라 면허․허가 또는 인가 등을 받은 법인으로서 본회 입찰유의서에 정하는 기준에 해당하는 자\n5. 그 밖에 경쟁입찰에서 낙찰자로 결정된 후 계약체결을 기피할 우려가 없다고 인정되는 자\n④ 제3항의 경우에 보증금의 본회 귀속사유가 발생할 때에는 계약상대자로 하여금 입찰보증금에 해당하는 금액을 납부할 것을 보장하기 위하여 그 지급을 확약하는 내용의 문서를 제출하게 하여야 한다.\n⑤ 본회가 입찰보증금을 납부하지 아니하고는 입찰에 참가할 수 없는 부득이한 경우에는 입찰보증금을 지급할 수 있다.","hist":"\u003c개정 2014.12. 5> \u003c개정 2010.12. 2, 2014.12. 5, 2015.11.20, 2016.10.25> \u003c개정 2002. 7. 8, 2010.12. 2, 2014.12. 5> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2016.10.25> \u003c개정 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c신설 2025. 5. 7.> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2010.12. 2, 2014.12. 5> \u003c개정 2006. 4.26, 2010.12. 2, 2014.12. 5> \u003c개정 2021. 5.21> \u003c개정 2015.11.20, 2017.03.03, 2024. 10. 15.> \u003c개정 2016.10.25> \u003c개정 2002. 7. 8, 2014.12. 5, 2015.11.20> \u003c신설 1994. 4.10, 2014.12. 5, 2015.11.20> \u003c신설 1994. 4.10, 2015.11.20>","id":63,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"52","label":"제52조(입찰보증금의 납부)","chapter":"제4장 입찰 및 낙찰절차","page":25,"part":"","text":"제52조(입찰보증금의 납부) 계약담당자는 입찰참가자로 하여금 입찰신청 마감일까지 소정절차에 따라 제51조에 정한 보증금을 납부하게 하여야 한다. 다만, 계약담당자의 결정에 따라 입찰당일 입찰서와 함께 납부하게 할 수 있다.","hist":"","id":64,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"53","label":"제53조(입찰보증금의 본회 귀속)","chapter":"제4장 입찰 및 낙찰절차","page":26,"part":"","text":"제53조(입찰보증금의 본회 귀속) ① 계약담당자는 낙찰자가 계약을 체결하지 아니한 때에는 당일 입찰보증금을 본회에 귀속시켜야 한다. 다만, 희망수량 경쟁입찰의 경우에는 그 낙찰된 수량에 비례한 입찰보증금만을 귀속시켜야 한다.\n② 입찰보증금을 제51조제1항 단서에 따라 보증서 등으로 받은 경우, 제1항에 따른 입찰보증금의 본회 귀속사유가 발생한 때에는 지체없이 그 뜻을 해당 금융기관 또는 보증기관에 통지하여 당해 입찰보증금을 현금으로 징수하여야 한다.\n③ 제51조제3항에 따라 입찰보증금의 전부 또는 일부의 납부를 면제받은 자에게 제1항에 따른 본회 귀속사유가 발생한 때에는 당해 낙찰자로부터 입찰보증금에 상당하는 금액을 현금으로 징수하게 하여야 한다.","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":65,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"54","label":"제54조(입찰서의 제출)","chapter":"제4장 입찰 및 낙찰절차","page":26,"part":"","text":"제54조(입찰서의 제출) ① 입찰서는 입찰공고에 표시한 장소와 일시에 입찰자가 직접 제출하는 것을 원칙으로 한다. 다만, 우편입찰 등이 허용된 경우에는 우편으로 제출하게 할 수 있다.\n② 입찰자가 제출한 입찰서는 교환․변경 또는 취소하지 못한다.","hist":"","id":66,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"55","label":"제55조(입찰의 무효)","chapter":"제4장 입찰 및 낙찰절차","page":26,"part":"","text":"제55조(입찰의 무효) ① 다음 각 호의 1에 해당하는 경우에는 그 입찰은 무효로 한다.\n1. 입찰참가자격이 없는 자가 한 입찰\n2. 입찰보증금의 납부일시까지 소정의 입찰보증금을 납부하지 아니하고 한 입찰\n3. 입찰서의 도착일시까지 소정의 입찰장소에 도착하지 아니한 입찰\n4. 동일사항에 동일인이 2통 이상의 입찰서를 제출한 입찰\n5. 입찰 또는 개찰전에 미리 현장설명에 참가를 요하는 공사입찰에 있어서 당해 현장설명에 참가하지 아니한 자가 한 입찰\n6. 입찰조건 및 그 밖에 입찰유의서에 위반한 입찰\n7. 제51조에 따른 입찰보증금이 미달하는 입찰\n② 계약담당자는 입찰을 무효로 하는 경우에는 무효여부를 확인하는데 장시간이 소요되는 등 부득이한 사유가 없는 한 개찰장소에서 개찰에 참가한 입찰자에게 이유를 명시하고 그 뜻을 알려야 한다.","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":67,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"56","label":"제56조(개찰 및 낙찰 선언)","chapter":"제4장 입찰 및 낙찰절차","page":26,"part":"","text":"제56조(개찰 및 낙찰 선언) ① 개찰은 입찰공고에 표시한 장소와 일시에 입찰자가 참석한 자리에서 이를 행하여야 한다.\n② 계약담당자는 지정된 시간까지 입찰서를 접수한 때에는 입찰서의 접수마감을 선언하고 입찰자의 참석하에 입찰서를 개봉하여야 한다. 다만, 입찰자로서 출석하지 아니한 자가 있을 때에는 입찰사무에 관계없는 직원으로 하여금 개찰에 입회하게 하여야 한다.\n③ 계약담당자는 개봉된 입찰서를 확인하고 유효한 입찰서의 입찰금액과 예정가격을 대조하여 지체없이 적격자를 낙찰자로 선정하여야 한다. 다만, 낙찰자 결정에 장시간이 소요되는 경우에는 그러하지 아니할 수 있다.\n④ 제19조에 따른 전자자산처분시스템 또는 제45조에 따른 전자조달시스템을 이용하는 입찰의 경우에는 제1항부터 제3항까지의 규정에 불구하고 입찰공고에 표시한 절차와 방법에 의하여 개찰 및 낙찰선언을 한다.","hist":"\u003c신설 2021.10.28.>","id":68,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"57","label":"제57조(낙찰자 결정)","chapter":"제4장 입찰 및 낙찰절차","page":27,"part":"","text":"제57조(낙찰자 결정) ① 본회의 수입의 원인이 되는 경쟁입찰에 있어서는 예정가격 이상으로서 최고가격으로 입찰한 자를 낙찰자로 한다.\n② 공사를 제외한 본회의 부담이 되는 경쟁입찰에 있어서는 예정가격 이하로서 최저가격으로 입찰한 자를 낙찰자로 결정한다. 다만, 「중소기업제품 구매촉진 및 판로지원에 관한 법률」에서 정하는 중소기업자간 경쟁제품에 대해서는 중소벤처기업부장관이 정하는 「중소기업자간 경쟁제품 중 물품의 구매에 관한 계약이행능력심사 세부기준」에 따라 낙찰자를 결정한다.\n③ 본회의 부담이 되는 공사계약의 경쟁입찰에 있어서는 예정가격 이하로서 최저가격으로 입찰한 자의 순으로 본회 적격심사기준에 의하여 당해 계약이행 능력을 심사하여 낙찰자를 결정한다. 다만, 추정가격이 30억원 이상인 공사의 경우에는 예정가격이하의 최저가격으로 입찰한 자를 낙찰자로 결정할 수 있다.\n④ 제3항에 따른 심사는 당해 입찰자의 이행실적, 기술능력, 재무상태, 과거 계약이행 성실도, 자재 및 인력조달 가격의 적정성, 계약질서의 준수정도, 과거공사의 품질정도 및 입찰가격 등을 종합적으로 고려하여 지도경제대표이사가 정하는 적격심사기준에 의하여 심사한 결과 적격하다고 인정되는 경우 당해 입찰자를 낙찰자로 결정한다.","hist":"\u003c개정 2010.12. 2, 2014.12. 5, 2021. 5.21, 2023.3.9.> \u003c개정 2010.12. 2> \u003c개정 1999. 4.10, 1999.12.17, 2002. 7. 8, 2006. 4.26, 2010.12. 2, 2015.11.20>","id":69,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"58","label":"제58조(희망수량경쟁입찰의 낙찰자 결정)","chapter":"제4장 입찰 및 낙찰절차","page":27,"part":"","text":"제58조(희망수량경쟁입찰의 낙찰자 결정) ① 다량의 물품을 희망수량에 따라 분할하여 매각하고자 할 경우에는 제57조에도 불구하고 예정가격 이상의 단가로 입찰한 자 중 최고가격으로 입찰한 자순으로 매각수량에 도달할 때까지의 입찰자를 낙찰자로 한다.\n② 다량의 물품을 희망수량에 따라 분할하여 제조․구매하고자 할 경우에는 제57조에도 불구하고 예정가격 이하의 단가로 입찰한 자 중 최저가격으로 입찰한 입찰자 순으로 수요 수량에 도달할 때까지의 입찰자를 낙찰자로 한다.\n③ 제1항 및 제2항에 따라 낙찰자를 결정함에 있어서 최후순위의 낙찰자의 수량이 다른 낙찰자의 수량과 합산하여 수요량 또는 매각량을 초과하는 경우에는 그 초과하는 수량은 이를 낙찰되지 아니한 것으로 본다.","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":70,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"59","label":"제59조(동일가격 입찰인 경우의 낙찰자 결정)","chapter":"제4장 입찰 및 낙찰절차","page":28,"part":"","text":"제59조(동일가격 입찰인 경우의 낙찰자 결정) ① 낙찰이 될 수 있는 동일가격으로 입찰한 자가 2인 이상인 때에는 즉시 추첨에 의하여 낙찰자를 결정하여야 한다. 다만, 제57조 제3항에 따른 입찰에 있어서는 본회 적격심사기준에 의한 당해 계약이행능력 심사결과 최고점수인 자를 낙찰자로 결정하되, 계약이행능력 심사결과도 동일한 때에는 추첨에 의하여 낙찰자를 결정한다.\n② 제1항의 경우 그 입찰자 중 출석하지 아니한 자 또는 추첨을 하지 아니한 자가 있을 때에는 입찰사무에 관계없는 직원으로 하여금 이를 대신하여 추첨하게 할 수 있다.\n③ 제58조의 희망수량경쟁입찰의 낙찰자 결정에 있어서 낙찰자가 될 동일가격의 입찰자가 2인이상 있을 때에는 입찰수량이 많은 자를 우선순위의 낙찰자로 하며, 입찰수량이 동일한 때에는 제1항 및 제2항에 준하여 추첨으로 낙찰자를 결정한다.\n④ 제19조에 따른 전자자산처분시스템 또는 제45조에 따른 전자조달시스템을 이용하는 입찰의 경우에는 해당 시스템에서 제공하는 추첨 프로그램을 이용할 수 있다.","hist":"\u003c단서신설 2021.10.28.> \u003c개정 2015.11.20> \u003c신설 2016.10.25>","id":71,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"59-2","label":"제59조의2(협상에 의한 계약체결)","chapter":"제4장 입찰 및 낙찰절차","page":28,"part":"","text":"제59조의2(협상에 의한 계약체결) ① 계약담당자는 물품․용역․부동산의 처분 또는 임대계약에 있어서 계약의 전문성, 특수성, 긴급성, 그 밖의 사유로 필요하다고 인정되는 경우에는 제57조에도 불구하고 다수의 제안서를 제출받아 평가한 후 협상절차를 통하여 본회에 가장 유리하다고 인정되는 자와 계약을 체결할 수 있다.\n② 계약담당자는 제1항에 따른 계약을 체결하고자 하는 경우에는 입찰공고시 협상에 의한 계약이라는 뜻을 명시하여야 한다.\n③ 계약담당자는 협상에 의한 계약에 참가하고자 하는 자에게 제안요청서 등 필요한 서류를 교부하여야 한다.\n④ 계약담당자는 제1항에 따른 계약체결에 필요한 기준 및 절차 등을 정하여 협상에 의한 계약에 참가하고자 하는 자가 이를 열람할 수 있도록 하여야 한다.\n⑤ 협상에 의한 계약체결 방법은 지도경제대표이사가 따로 정하는 바에 따른다.","hist":"\u003c개정 2015.11.20., 2020.10.23.> \u003c개정 2015.11.20> \u003c본조신설 2003. 3.31, 2015.11.20> \u003c신설 2016.10.25>","id":72,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"60","label":"제60조(계약서의 작성)","chapter":"제5장 계약의 체결 및 이행","page":29,"part":"","text":"제60조(계약서의 작성) ① 계약담당자는 계약을 체결하고자 할 때에는 별지 제1호부터 별지 제3호까지의 표준계약서 및 별지 제4호부터 별지 제6호까지의 계약일반조건을 작성하여야 한다. 다만, 공사도급계약서를 작성하는 경우에는 「 건설산업기본법」제88조 및 동법 시행령 제84조에 따라 노임을 도급계약서에 별도로 명시하여야 한다.\n② 계약담당자는 다음 각 호의 1에 해당하는 경우를 제외하고 계약금액 1억원 이상인 계약 또는 이행책임이 본회에 귀속되는 업무협약(양해각서, 합의각서 등을 포함한다) 체결에 대해서는 반드시 본회 변호사 또는 외부 고문변호사의 법률 검토를 받은 후 계약서를 작성하여야 한다.\n1. 관련 법규 및 본회 제규정에서 정한 표준계약서를 사용하는 경우(제1항에서 정한 사항외 표준계약서에서 필요에 따라 생략할 경우 포함)\n2. 법률 자문을 득한 계약서에서 계약상대자, 대상물품, 단가, 기간연장 등 단순변경 및 관련법령에 의한 내용변경 계약\n③ 삭제\n④ 삭제\n⑤ 삭제\n⑥ 계약서에는 계약담당자와 계약상대자가 기명날인함으로써 계약이 확정된다. 다만, 외국인과 계약을 체결하는 경우 기타 특별한 사유가 있는 경우에는 서명으로써 이에 갈음할 수 있다.\n⑦ 계약담당자는 제1항의 규정에 의한 서식에 의하기가 곤란하다고 인정될 때에는 이와 다른 양식에 의한 계약서에 의하여 계약을 체결할 수 있으며, 제1항의 규정에 의한 표준계약서에 기재된 계약일반사항 외에 당해계약에 필요한 특약사항을 명시하여 계약을 체결할 수 있다.\n[제목개정 2024. 10. 15.]","hist":"\u003c개정 2017.12. 1, 2024. 10. 15.> \u003c신설 2017.03.03, 개정 2017.12. 1, 2025. 5. 7.> \u003c2024. 10. 15.> \u003c2024. 10. 15.> \u003c2024. 10. 15.> \u003c신설 2024. 10. 15.> \u003c신설 2024. 10. 15.>","id":73,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"60-2","label":"제60조의2(계약서 작성의 생략)","chapter":"제5장 계약의 체결 및 이행","page":29,"part":"","text":"제60조의2(계약서 작성의 생략) ①계약담당자는 다음 각 호의1에 해당하는 경우에는 제60조제1항에 따른 표준계약서 및 계약일반조건의 작성을 생략할 수 있다.\n1. 계약금액이 3천만원 이하인 계약을 체결할 때\n2. 경매에 있어서 경락인이 즉시 대금을 납부하고 경락물을 인수할 때\n3. 물품의 매매에 있어서 즉시 대금을 정산하고 물품을 인수도 할 때\n4. 본회의 중도매인, 매매참가인 및 지정거래인과 수산물을 거래할 때\n5. 국가기관 또는 지방자치단체와 계약을 체결할 때\n6. 본회와 회원 및 본회가 납입자본금의 50%이상을 출자한 기업체와 계약을 체결할 때\n7. 전기ㆍ가스ㆍ수도의 공급계약등 성질상 계약서의 작성이 필요하지 아니한 때\n8. 제1호부터 제7호까지에서 정한 경우 외의 계약으로서 계약서의 작성 생략이 일반적으로 거래관례로 되어 있거나 계약의 목적·성질상 계약서의 작성이 어려운 때\n② 계약담당자는 제1항에 따라 표준계약서 및 계약일반조건의 작성을 생략하는 경우에는 청구서, 영수증, 각서, 승락서, 협정서 등 계약성립의 증거가 될 수 있는 서류를 받아 비치하여야 한다.\n[본조신설 2024. 10. 15.]","hist":"","id":74,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"61","label":"제61조(계약보증금)","chapter":"제5장 계약의 체결 및 이행","page":30,"part":"","text":"제61조(계약보증금) ① 계약담당자는 본회와 계약을 체결하고자 하는 자로 하여금 계약금액의 100분의 10이상으로 납부하게 하여야 한다.\n② 단가계약에 의하는 경우로서 여러차례로 분할하여 계약을 이행하게 하는 때에는 제1항에도 불구하고 매회별 이행예정량 중 최대량에 계약단가를 곱한 금액의 100분의 10이상을 계약보증금으로 납부하게 하여야 한다.\n③ 공사계약에 있어서 제70조에 따른 연대보증인을 세우지 아니하는 경우에는 제1항에도 불구하고 계약보증금을 계약금액의 100분의 20이상으로 납부하게 하거나 계약금액의 100분의 30이상을 납부할 것을 보증하는 공사이행보증서를 제출하여야 한다.\n④ 다음 각 호의 1에 해당하는 경우에는 제1항 및 제2항의 계약보증금의 전부 또는 일부의 납부를 면제할 수 있다.\n1. 제51조제3항제2호부터 제3호까지 및 제60조의2제1항에 따른 자와 계약을 체결하는 경우. 다만, 해외사무소의 경우에는 제60조의2제1항제1호의 규정에도 불구하고 계약금액이 5천만원 이하인 계약을 체결하는 경우\n2. 삭제\n3. 본회「선수물자․기자재 업무방법서」에 따른 어업용 선수물자 및 기자재 계통구매계약을 체결할 때\n4. 본회「유류공급사업요령」에 따른 어업용 면세유류 구매 계약을 체결할 때\n5. 일반적으로 공정․타당하다고 인정되는 계약의 관습에 따라 계약보증금 징수가 적합하지 아니한 경우\n6. 그 밖에 수의계약에 의하는 경우로서 지도경제대표이사의 승인을 얻을 때\n⑤ 제4항에 따라 계약보증금의 전부 또는 일부의 납부를 면제하는 경우에는 제51조제4항을 준용한다.","hist":"\u003c개정 2015.11.20> \u003c개정 2002. 7. 8, 2015.11.20> \u003c개정 1994. 4.10, 2015.11.20., 2017.03.03., 2020.10.23., 2024. 10. 15.> \u003c2010.12. 2> \u003c개정 2016.10.25> \u003c신설 2019.11.15> \u003c개정 2002. 7. 8, 2010.12. 2, 2015.11.20> \u003c개정 1997. 2.14, 2015.11.20, 2019.11.15, 2021. 5.21>","id":75,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"62","label":"제62조(계약보증금 납부)","chapter":"제5장 계약의 체결 및 이행","page":31,"part":"","text":"제62조(계약보증금 납부) ① 계약담당자는 계약을 체결하고자 할 때에는 낙찰자 또는 계약상대자로 하여금 계약체결전까지 계약보증금을 납부하게 하여야 한다.\n② 제1항의 계약보증금 납부에 관하여는 제51조제1항을 준용한다.\n③ 계약담당자는 계약상대자가 제51조제1항 및 제2항에 따라 납부한 입찰보증금을 계약보증금으로 대체할 것을 요청한 때에는 입찰보증금의 계약보증금 대체납부신청서를 받고 계약보증금으로 대체정리할 수 있다.","hist":"\u003c개정 1999. 4.10, 2015.11.20> \u003c개정 2015.11.20>","id":76,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"63","label":"제63조(보증보험증권 등에 의한 보증금 납부)","chapter":"제5장 계약의 체결 및 이행","page":31,"part":"","text":"제63조(보증보험증권 등에 의한 보증금 납부) 계약담당자는 입찰참가자 또는 계약상대자가 제51조, 제61조 및 제81조의 보증금을 이 규정이 정한 지급보증서, 보증보험증권, 또는 보증서(이하 \"보증보험증권 등\"이라 한다)로 납부하고자 할 때에는 다음 각 호의 요건이 충족된 것을 제출하게 하여 이를 확인한 후 보관․관리하여야 한다.\n1. 피보증인의 명의를 수산업협동조합중앙회(이하 “수협”이라 한다)로 할 것\n2. 보증금액이 납부하여야 할 보증금액 이상일 것\n3. 삭제\n4. 보증보험증권 등에 기재된 보증내용이 입찰참가자 또는 계약상대자의 의무이행과 동일한 내용을 보증하는 것일 것\n5. 보증보험증권인 경우에는 보증보험 보통보험약관에 규정된 면책사유에 불구하고 수협에 귀속시켜야할 금액을 보증하는 특약조항이 있을 것\n6. 보증기간은 보증금에 따라 다음 각 목의 어느 하나에 해당할 것\n가. 입찰보증금 (1) 보증기간의 초일 : 입찰서 제출마감일 이전일 것 (2) 보증기간의 만료일 : 입찰서 제출마감일 다음날부터 30일 이후일 것\n나. 계약보증금 (1) 보증기간의 초일 : 계약기간 개시일 (2) 보증기간의 만료일 : 계약기간의 종료일 이후일 것\n다. 하자보수보증금 (1) 보증기간의 초일 : 목적물을 인수한 날과 준공검사를 완료한 날 중에서 먼저 도래한 날 (2) 보증기간의 만료일 : 하자담보책임기간 종료일 이후일 것","hist":"\u003c개정 2015.11.20> \u003c2010.12. 2> \u003c신설 2021.10.28.>","id":77,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"64","label":"제64조(정기예금증서 등에 의한 보증금납부)","chapter":"제5장 계약의 체결 및 이행","page":32,"part":"","text":"제64조(정기예금증서 등에 의한 보증금납부) 계약담당자는 입찰자 또는 계약상대자가 보증금에 갈음하여 제51조제1항제5호부터 제7호까지의 규정에 따른 정기예금 증서 또는 수익증권을 제출하고자 할 때에는 정기예금증서 또는 수익증권과 함께 질권설정 동의서를 제출받아 질권설정 조치를 취하고 보관하여야 한다.","hist":"\u003c개정 2015.11.20>","id":78,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"65","label":"제65조(보증기간중 의무)","chapter":"제5장 계약의 체결 및 이행","page":32,"part":"","text":"제65조(보증기간중 의무) 계약담당자는 보증기간중 당해 보증보험계약 등의 약관․특약 또는 「상법」에 따라 피보험자에게 주어진 다음 각 호의 의무를 성실히 이행하여야 한다.\n1. 「상법」 제652조에 따른 위험의 변경 또는 증가의 통지의무\n2. 「상법」 제657조에 따른 보험사고 발생의 통지의무\n3. 「상법」 제680조에 따른 손해방지의 의무\n4. 약관에 따른 조사 승낙의 의무\n5. 그 밖에 약관 또는 특약에서 정한 의무","hist":"\u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":79,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"66","label":"제66조(보증보험증권 등의 보증기간의 연장)","chapter":"제5장 계약의 체결 및 이행","page":32,"part":"","text":"제66조(보증보험증권 등의 보증기간의 연장) 계약담당자는 계약의 체결일을 연기하거나 계약의 이행기간 또는 하자담보책임기간을 연장하고자 할 때에는 계약상대자로 하여금 당초의 보증기간내에 그 연장하고자 하는 기간을 가산한 기간을 보증기간으로 하여 제63조에 적합하게 작성된 보증보험증권을 제출하게 하여야 한다.","hist":"\u003c개정 2015.11.20>","id":80,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"67","label":"제67조(계약금액 변경시의 보증금의 조정 및 추가납부 등)","chapter":"제5장 계약의 체결 및 이행","page":32,"part":"","text":"제67조(계약금액 변경시의 보증금의 조정 및 추가납부 등) 계약담당자는 제82조, 제85조 및 제86조에 따라 계약금액이 조정된 때에는 이에 상응하는 금액의 보증금을 추가로 납부하게 하거나 계약상대자의 요청에 의하여 이를 반환하여야 한다.","hist":"\u003c개정 2015.11.20>","id":81,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"68","label":"제68조(보증금의 반환)","chapter":"제5장 계약의 체결 및 이행","page":33,"part":"","text":"제68조(보증금의 반환) 계약담당자는 제51조, 제62조 및 제81조에 따라 납부된 보증금이 보증목적을 달성할 때에는 계약상대자의 요청에 의하여 즉시 이를 반환하도록 조치하여야 한다.","hist":"\u003c개정 2015.11.20>","id":82,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"69","label":"제69조(계약보증금의 본회 귀속)","chapter":"제5장 계약의 체결 및 이행","page":33,"part":"","text":"제69조(계약보증금의 본회 귀속) ① 계약담당자는 계약상대자가 계약상의 의무를 이행하지 아니한 때에는 당해 계약보증금을 본회에 귀속시켜야 한다.\n② 제1항에 따라 계약보증금을 본회에 귀속시키는 경우에는 계약에 특별히 정한 것이 없는 한 당해 계약을 해제 또는 해지하고 계약상대자에게 그 사유를 통지하여야 한다.\n③ 제53조제2항 및 제3항은 계약보증금의 본회 귀속의 경우에 준용한다.\n④ 연대보증인이 계약상 의무를 연대하여 이행한 경우에는 계약보증금 또는 하자보수보증금은 이를 본회에 귀속시키지 아니한다.","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":83,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"70","label":"제70조(연대보증인)","chapter":"제5장 계약의 체결 및 이행","page":33,"part":"","text":"제70조(연대보증인) ① 계약담당자는 공사계약을 체결하고자 하는 경우 계약상대자로 하여금 당해 계약상의 의무이행을 보증하는 1인 이상의 연대보증인을 세우도록 하여야 한다. 다만, 제61조제3항에 따라 계약보증금을 계약금액의 100분의 20이상으로 납부하거나 계약금액의 100분의 30이상을 납부할 것을 보증하는 공사이행보증서를 제출하는 경우에는 그러하지 아니하다.\n② 연대보증인은 제47조의 입찰공고 등에서 요구한 자격과 동등 이상의 자격을 갖춘 자이어야 한다.\n③ 연대보증인은 당해 계약자와 「독점규제 및 공정거래에 관한 법률」에 따른 계열회사가 아니어야 하고, 본회의 규정에 의한 입찰참가자격 제한을 받은 사실이 없거나 그 제한을 받고 당해 제한기간이 만료된 후 1년 이상 경과된 자이어야 한다.\n④ 계약담당자는 계약상대자가 계약상의 의무를 이행하지 아니하는 경우에는 지체없이 제1항에 따른 연대보증인에게 그 의무를 이행할 것을 청구하여야 한다.\n⑤ 계약담당자는 제4항에 따른 청구에 의하여 연대보증인이 그 의무를 이행한 경우에는 계약금액 중 연대보증인의 이행부분에 상당하는 금액을 연대보증인에게 지급할 수 있도록 계약을 체결할 때에 미리 필요한 조치를 하여야 한다.\n⑥ 계약담당자는 제4항에 따른 청구에 의하여 연대보증인이 하자보수의무를 이행한 경우에는 하자보수보증금을 반환함에 있어서 하자보수보증금 중 연대보증인의 이행부분에 상당하는 금액을 연대보증인에게 직접 반환할 수 있도록 필요한 조치를 하여야 한다.\n⑦ 계약담당자는 제1항에 따라 연대보증인으로 된 자가 부적격하다고 인정되는 경우에는 계약상대자에게 연대보증인의 변경을 청구할 수 있다.","hist":"\u003c개정 1997. 2.14, 2015.11.20., 2021.10.28.> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":84,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"71","label":"제71조(감독)","chapter":"제5장 계약의 체결 및 이행","page":34,"part":"","text":"제71조(감독) ① 계약담당자는 공사․제조․용역 등의 도급계약을 체결한 경우에는 그 계약의 적정한 이행을 확보하기 위하여 필요하다고 인정할 때에는 감독자를 지명하여 계약서․설계서․그 밖의 관계서류에 의하여 감독을 하게 하여야 한다. 다만, 「건설기술 진흥법」 제39조제2항 또는 「전력기술관리법」 제12조, 그 밖에 공사 관련 법령상 의무적으로 건설사업관리 또는 감리를 하는 공사계약과 전문적인 지식 또는 기술을 필요로 하거나 그 밖에 부득이한 사유로 인하여 본회에서 감독을 할 수 없는 제조, 그 밖에 도급계약의 경우에는 전문기관을 따로 지정하여 필요한 감독을 하게 할 수 있다.\n② 제1항에 따른 공사감독 사항에 관하여는 별도로 정한다.","hist":"\u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2002. 7. 8, 2015.11.20>","id":85,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"72","label":"제72조(검사)","chapter":"제5장 계약의 체결 및 이행","page":34,"part":"","text":"제72조(검사) ① 계약담당자는 계약의 전부 또는 일부의 이행을 완료한 때에는 이를 확인하기 위하여 검사원을 지명하여 계약서․설계서․그 밖의 관계서류에 의하여 필요한 검사를 하게 하여야 한다. 다만, 제71조제1항 단서에 따른 계약의 경우에는 전문기관을 따로 지정하여 필요한 검사를 하게 할 수 있다.\n② 제1항에 따른 검사는 계약상대자로 부터 당해 계약의 이행을 완료한 사실을 통지받은 날로부터 14일 이내에 완료하여야 한다. 다만, 부득이한 경우에는 그 검사기간을 연장할 수 있다.\n③ 계약담당자는 검사를 함에 있어서 계약상대자의 계약이행 내용의 전부 또는 일부가 계약에 위반되거나 부당함을 발견한 때에는 지체없이 필요한 시정조치를 하여야 한다. 이 경우 계약상대자로 부터 그 시정을 완료한 사실을 통지받은 날부터 제2항에 따른 기간을 계산한다.\n④ 공사에 관한 검사사항은 별도로 정한다.","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c신설 2002. 7. 8>","id":86,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"73","label":"제73조(검사조서의 작성)","chapter":"제5장 계약의 체결 및 이행","page":34,"part":"","text":"제73조(검사조서의 작성) ① 제72조제1항에 따라 검사를 하는 자는 검사조서를 작성하여야 한다.\n② 다음 각 호의 1에 해당하는 계약의 경우에는 제1항의 검사조서 작성을 생략할 수 있다.\n1. 계약금액이 3천만원 이하인 계약의 경우\n2. 매각계약의 경우\n3. 전기․가스․수도의 공급계약 등 그 성질상 검사조서의 작성을 필요로하지 아니하는 계약의 경우","hist":"\u003c개정 2015.11.20> \u003c개정 2002. 7. 8>","id":87,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"74","label":"제74조(감독 및 검사를 위탁한 경우의 확인)","chapter":"제5장 계약의 체결 및 이행","page":35,"part":"","text":"제74조(감독 및 검사를 위탁한 경우의 확인) 계약담당자는 제71조제1항 단서 및 제72조제1항 단서에 따라 감독 또는 검사를 전문기관으로 하여금 수행하게 하는 경우에는 그 결과를 문서로 통보받아 이를 확인하여야 한다.","hist":"\u003c개정 2015.11.20>","id":88,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"75","label":"제75조(감독과 검사직무의 겸직)","chapter":"제5장 계약의 체결 및 이행","page":35,"part":"","text":"제75조(감독과 검사직무의 겸직) 제71조에 따른 감독의 직무와 제72조에 따른 검사의 직무는 겸할 수 없다. 다만, 다음 각 호의 1에 해당하는 경우에는 그러하지 아니하다.\n1. 특별한 기술을 요하는 검사에 있어서 감독을 행하는 자외의 자로 하여금 검사를 행하게 하는 것이 현저하게 곤란한 경우\n2. 유지․보수에 관한 공사 등 당해 계약의 이행후 지체없이 검사를 하지 아니하면 그 이행의 확인이 곤란한 경우\n3. 계약금액이 3억원 이하인 물품의 제조 또는 공사계약의 경우\n4. 제71조의 제1항 단서에 따른 공사계약의 경우","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20>","id":89,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"76","label":"제76조(대가의 지급)","chapter":"제5장 계약의 체결 및 이행","page":35,"part":"","text":"제76조(대가의 지급) ① 계약담당자는 공사․제조․매매․용역, 그 밖에 본회의 부담이 되는 계약에 있어서는 검사 또는 검사조서를 작성한 후에 그 대가를 지급하여야 한다. 다만, 일반관례 등 부득이한 사유가 있다고 인정되는 경우에는 예외로 한다.\n② 제1항에 따른 대가지급은 검사 또는 검사조서 작성후 계약상대자의 청구를 받은 날부터 5일 이내에 이를 지급하여야 한다. 다만, 부득이한 사정이 있는 경우에는 당사자와 합의하여 일정기간동안 대가의 지급기한을 연장할 수 있다.\n③ 계약에 따라 공사, 제조, 구매, 용역, 그 밖에 본회의 부담이 되는 계약에 있어서 기성부분 또는 기납부분에 대하여 완성전 또는 완납전에 대가의 일부를 지급할 수 있으며, 이 경우에는 계약의 수량, 이행의 실적 및 전망, 이행기간 등을 참작하여 적어도 30일마다 지급할 수 있으며, 제1항 및 제2항을 준용한다.\n④ 제3항에도 불구하고 해외사무소의 경우에는 본회의 부담이 되는 계약에 있어서 기성부분 또는 기납부분에 대하여 완성전 또는 완납전에 대가의 일부를 지급할 수 있으며, 제1항 및 제2항을 준용한다.","hist":"\u003c개정 2015.11.20> \u003c개정 2009. 2. 4, 2015.11.20> \u003c개정 2016.10.25> \u003c개정 1997. 2.14, 2015.11.20., 2020.10.23.> \u003c신설 2020.10.23.>","id":90,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"77","label":"제77조(대가의 선납)","chapter":"제5장 계약의 체결 및 이행","page":36,"part":"","text":"제77조(대가의 선납) 계약담당자는 재산의 매각․대부․용역의 제공, 그 밖에 본회의 수입의 원인이 되는 계약에 있어서는 관계법령이나 다른 규정에 특별한 규정이 없는 한 계약상대자로 하여금 그 대가를 미리 납부하게 하여야 한다.","hist":"\u003c개정 2015.11.20>","id":91,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"78","label":"제78조(대가의 선급)","chapter":"제5장 계약의 체결 및 이행","page":36,"part":"","text":"제78조(대가의 선급) ① 계약담당자는 다음 각 호의 요건을 충족하는 경우로서 계약상대자가 계약대가의 선금지급을 요청한 때에는 선금을 지급할 수 있다.\n1. 계약금액(단가계약의 경우에는 선금지급요청일 까지의 발주금액)이 3천만원 이상인 공사 또는 물품제조 계약과 5백만원 이상인 용역계약\n2. 삭제\n3. 본회로부터 입찰참가자격 제한을 받은 사실이 없거나 입찰참가자격 제한을 받고 당해 제한기간 만료후 동 제한기간 이상이 경과된 경우\n② 제1항에 따라 계약대가의 선금을 지급할 경우에는 계약금액에 대해 다음 각 호의 율에 해당하는 금액 이내에서 지급하여야 한다.\n1. 공사\n가. 계약금액의 100억원 이상인 경우 : 100분의 30\n나. 계약금액이 20억원 이상 100억원 미만인 경우 : 100분의 40\n다. 계약금액이 20억원 미만인 경우 : 100분의 50\n2. 물품의 제조 및 용역\n가. 계약금액이 10억원 이상인 경우 : 100분의 30\n나. 계약금액이 3억원 이상 10억원 미만인 경우 : 100분의 40\n다. 계약금액이 3억원 미만인 경우 : 100분의 50\n3. 삭제\n③ 제1항 및 제2항의 경우에 기성부분 또는 기납부분에 대하여 대가를 지급한 때에는 계약금액(단가계약의 경우에는 발주금액)에서 그 대가를 공제한 금액을 기준으로 한다.\n④ 삭제\n⑤ 계약대가의 선금을 지급함에 있어 선금채권확보, 선금의 사용제한, 선금의 정산방법, 선금의 반환청구 등에 관하여 필요한 사항은 정부의 「계약예규」(\"정부 입찰․계약 집행기준“을 말한다)를 준용한다. 다만, 본회가 납입자본금의 50%이상을 출자한 기업체, 회원이 납입자본금의 50%이상을 출자한 기업체에 선금을 지급하는 경우에는 선금채권확보조치를 제외할 수 있으며, 이 경우에는 제51조제4항을 준용한다.","hist":"\u003c2020.10.23.> \u003c개정 2015.11.20> \u003c개정 2009. 2. 4> \u003c개정 2009. 2. 4., 2020.10.23.> \u003c개정 2009. 2. 4., 2020.10.23.> \u003c개정 2020.10.23.> \u003c개정 2009. 2. 4> \u003c개정 2009. 2. 4., 2020.10.23.> \u003c개정 2009. 2. 4., 2020.10.23.> \u003c2020.10.23.> \u003c2020.10.23.> \u003c개정 2014.12. 5, 2023.3.9.>","id":92,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"79","label":"제79조(선금지급조건)","chapter":"제5장 계약의 체결 및 이행","page":37,"part":"","text":"제79조(선금지급조건) 선금을 지급하고자 하는 경우에는 계약체결시에 채권확보조치, 선금의 사용, 정산 및 반환청구 등 그 밖에 필요한 사항을 선금지급 조건으로 명시하여야 한다.","hist":"\u003c개정 2015.11.20>","id":93,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"80","label":"제80조(공사계약의 하자담보책임)","chapter":"제5장 계약의 체결 및 이행","page":37,"part":"","text":"제80조(공사계약의 하자담보책임) 계약담당자는 공사의 도급계약을 체결할 때에는 준공검사를 완료한 날로부터 1년이상 10년이하의 기간내에서 공사의 하자보수를 보증하기 위한 하자담보책임기간을 정하여야 한다. 다만, 공사의 성질상 하자보수가 필요하지 아니한 경우와 계약금액이 2천만원 이하인 공사(조경공사를 제외한다)의 경우에는 예외로 한다.","hist":"","id":94,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"80-2","label":"제80조의2(하자검사)","chapter":"제5장 계약의 체결 및 이행","page":37,"part":"","text":"제80조의2(하자검사) ① 계약담당자는 제80조에 따른 하자담보책임기간중 연 2회이상 정기적으로 하자를 검사하거나 본회 소속 직원에게 그 사무를 위임하여 검사하게 하여야 한다.\n② 계약담당자는 하자담보책임기간이 만료되기 14일 전부터 만료일까지의 기간 중에 따로 최종검사를 하여야 한다.\n③ 제1항 및 제2항의 규정에 따른 하자검사가 특히 전문적인 지식 또는 기술을 필요로 하는 것인 경우에는 계약담당자는 전문기관에 의뢰하여 필요한 검사를 하여야 한다.\n④ 제1항부터 제3항까지의 규정에 따라 하자를 검사하는 자는 하자검사조서를 작성하여야 한다. 다만, 계약금액이 3천만원 이하인 공사계약의 경우에는 하자검사조서의 작성을 생략할 수 있다.\n⑤ 계약담당자는 하자검사를 하는 때에는 당해 공사에 대한 하자보수관리부를 비치하고 다음 각 호의 사항을 기록․유지하여야 한다.\n1. 공사명 및 계약금액\n2. 계약상대자\n3. 준공년월일\n4. 하자발생내용 및 처리사항\n5. 그 밖에 참고사항","hist":"\u003c개정 2015.11.20., 2019.11.15> \u003c신설 2023.3.9.> \u003c개정 2015.11.20., 2023.3.9.> \u003c개정 2015.11.20> \u003c신설 2004.11.16, 개정 2015.11.20>","id":95,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"81","label":"제81조(하자보수보증금)","chapter":"제5장 계약의 체결 및 이행","page":37,"part":"","text":"제81조(하자보수보증금) ① 계약담당자는 제80조에 따른 하자담보책임기간동안 계약상대자로 하여금 하자보수를 보증하기 위하여 계약금액의 100분의2 이상 10 이하로 하여 그 공사대가의 최종지급시까지 하자보수보증금을 납부하게 하여야 한다.\n② 제51조 제1항 단서는 제1항에 따른 하자보수보증금을 납부할 경우에 준용한다.\n③ 공사이외의 도급계약에 있어서도 하자보증금이 필요하다고 인정될 때에는 제1항 및 제2항에 따라 하자보증금을 받을 수 있다.\n④ 하자보수보증금율 및 하자담보책임기간 등은 제1항 및 제80조의 범위내에서 「 국가를 당사자로 하는 계약에 관한 법률」의 정하는 바를 준용하여 하자담보책임기간 및 하자보수보증금률을 정한다.","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2014.12. 5>","id":96,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"82","label":"제82조(물가변동으로 인한 계약금액의 조정)","chapter":"제5장 계약의 체결 및 이행","page":38,"part":"","text":"제82조(물가변동으로 인한 계약금액의 조정) ① 계약담당자는 본회의 부담이 되는 계약을 체결(장기계속공사 및 장기물품제조 등의 경우에는 제1차 계약의 체결을 말한다. 이하 이조에서 같다)한 날로부터 90일이상 경과하고 동시에 다음 각 호의 1에 해당되는 때에는 계약금액을 조정할 수 있다. 이 경우 조정기준일(조정사유가 발생한 날을 말한다)부터 90일 이내에는 이를 다시 조정하지 못한다. 다만, 천재지변 또는 원자재의 가격급등으로 인해 당해 조정제한 기간내에 계약금액을 조정하지 아니하고는 계약이행이 곤란하다고 인정되는 경우에는 계약을 체결한 날 또는 직전 조정기준일로부터 90일 이내에 계약금액을 조정할 수 있다.\n1. 품목조정률이 100분의 3이상 증감된 때\n2. 지수조정률이 100분의 3이상 증감된 때\n② 동일한 계약에 대하여는 제1항제1호 및 제2호를 동시에 적용할 수 없으며 계약체결시 그 중 하나의 방법을 택하여 계약금액을 조정할 수 있다는 뜻을 계약서에 명시하여야 한다.\n③ 제78조에 따라 당해 계약상대자에게 선금을 지급한 경우에는 제1항에 따라 산출한 증가액에서 다음 산식에 의하여 산출한 금액을 공제하여야 한다. 공제금액 = 물가변동적용대가 × (품목조정률 또는 지수조정률) × 선금급률","hist":"\u003c개정 2008. 6.20> \u003c개정 2010.12. 2> \u003c개정 2010.12. 2> \u003c개정 2015.11.20> \u003c개정 2015.11.20.>","id":97,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"83","label":"제83조(품목조정 및 지수조정)","chapter":"제5장 계약의 체결 및 이행","page":38,"part":"","text":"제83조(품목조정 및 지수조정) ① 제82조제1항제1호에 따른 품목조정률과 이에 관련된 등락폭 및 등락률의 산정은 다음 각 호의 산식에 따른다. 이 경우 품목 또는 비목 및 계약금액 등은 조정기준일 이후에 이행될 부분을 그 대상으로 하며, \"계약단가\"라 함은 제85조제2항제1호의 품목 또는 비목의 계약단가를, \"물가변동당시가격\"이라 함은 물가변동당시 산정한 각 품목 또는 비목의 가격을, \"계약체결당시 가격\"이라 함은 계약체결당시 산정한 각 품목 또는 비목의 가격을 말한다.\n1. 품목조정률 = 각 품목 또는 비목의 수량에 등락폭을 곱하여 산출한 금액의 합계액 /계약금액\n2. 등락폭 = 계약단가×등락률\n3. 등락률 = (물가변동당시가격 - 계약체결당시가격) / 계약체결당시가격\n② 제9조제1항제2호에 따른 예정가격을 기준으로 계약한 경우에는 제1항제1호 산식 중 각 품목 또는 비목의 수량에 등락폭을 곱하여 산출한 금액의 합계액에는 동 합계액에 비례하여 증감되는 일반관리비 및 이윤 등을 포함하여야 한다.\n③ 제1항제1호의 등락폭을 산정함에 있어서는 다음 각 호의 기준에 따른다.\n1. 물가변동당시 가격이 계약단가보다 높고 동 계약단가가 계약체결당시 가격보다 높을 경우의 등락폭은 물가변동당시 가격에서 계약단가를 뺀 금액을 한다.\n2. 물가변동당시 가격이 계약체결당시 가격보다 높고 계약단가보다는 낮을 경우의 등락폭은 영으로 한다.\n④ 제82조제1항제2호에 따라 계약금액을 조정하는 경우에는 계약상대자가 제9조제1항제2호에 따른 예정가격을 기준으로 작성한 산출내역서를 첨부하여 체결한 계약의 경우로 하되, 지수조정률은 계약금액의 산출내역을 구성하는 비목군 및 다음 각 호의 지수등에 따라서 산출한다.\n1. 한국은행이 조사하여 공표하는 생산자물가기본분류지수 또는 수입물가지수\n2. 국가․지방지차단체 또는 정부투자기관이 결정․허가 또는 인가하는 노임․가격 또는 요금의 평균지수\n3. 거래실례가격 또는 「통계법」 제15조에 따라 통계작성 승인을 받은 기관이 조사하여 공표한 가격의 평균지수\n4. 그 밖에 제1호부터 제3호까지와 유사한 지수로서 기획재정부장관이 정하는 지수","hist":"\u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2002. 7. 8, 2014.12. 5, 2015.11.20> \u003c개정 2002. 7. 8, 2011. 5.19, 2015.11.20>","id":98,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"84","label":"제84조(물가변동 적용대가)","chapter":"제5장 계약의 체결 및 이행","page":39,"part":"","text":"제84조(물가변동 적용대가) 제82조제1항에 따라 계약금액을 조정함에 있어서 그 조정금액은 계약금액중 조정기준일 이후에 이행되는 부분의 대가(이하 \"물가변동적용대가\"라 한다)에 품목조정률 또는 지수조정률을 곱하여 산출하되, 계약상 조정기준일전에 이행이 완료되어야 할 부분은 이를 물가변동적용대가에서 제외한다. 다만, 본회의 책임이 있는 사유 또는 천재지변 등 불가항력의 사유로 이행이 지연된 경우에는 물가 변동 적용대가에 이를 포함한다.","hist":"\u003c개정 2015.11.20>","id":99,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"85","label":"제85조(설계변경으로 인한 계약금액의 조정)","chapter":"제5장 계약의 체결 및 이행","page":40,"part":"","text":"제85조(설계변경으로 인한 계약금액의 조정) ① 공사계약에 있어서 설계변경으로 인하여 공사량의 증감이 발생한 때에는 당해 계약금액을 조정할 수 있다.\n② 제1항에 따른 계약금액의 조정은 다음 각 호의 기준에 의한다.\n1. 증감된 공사량의 단가는 입찰자가 제출한 산출내역서상의 단가(이하 \"계약단가\"라 한다)로 한다. 다만, 계약단가가 제8조에 따른 예정가격상의 단가(이하 \"예정가격단가\"라 한다)보다 높은 경우로서 물량이 증가하게 되는 경우 그 증가된 물량에 대한 적용단가는 예정가격단가로 한다.\n2. 계약단가가 없는 신규 비목의 단가는 설계변경당시를 기준으로 산정한 단가에 낙찰률(당초의 예정가격에 대한 낙찰금액 또는 수의계약금액의 비율을 말한다)을 곱한 금액으로 한다.\n3. 본회에서 설계변경을 요구한 경우에는 제1호 및 제2호에도 불구하고 증가된 물량 또는 신규비목의 단가는 설계변경 당시를 기준으로 산정한 단가와 동 단가에 낙찰률을 곱한 금액의 범위안에서 본회와 계약상대자가 상호 협의하여 결정한다.\n③ 제1항의 경우 외에 계약상대자가 새로운 기술․공법 등을 사용함으로서 공사비의 절감, 시공기간의 단축 등의 효과가 현저할 것으로 인정되어 계약상대자의 요청에 의하여 필요한 설계변경을 할 때에는 계약금액의 조정에 있어서 당해 절감액의 100분의 50에 해당하는 금액을 감액한다.\n④ 계약금액의 증감분에 대한 일반관리비 및 이윤 등은 계약체결시 제출한 일반관리비율 및 이윤율 등에 의한다.\n⑤ 제1항부터 제4항까지는 제조․용역 등의 계약에 있어서 계약금액을 조정하는 경우에 이를 준용할 수 있다.","hist":"\u003c개정 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5> \u003c개정 1997. 2.14, 2015.11.20> \u003c개정 2002. 7. 8> \u003c개정 2015.11.20>","id":100,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"86","label":"제86조(그 밖에 계약내용의 변경으로 인한 계약금액의 조정)","chapter":"제5장 계약의 체결 및 이행","page":40,"part":"","text":"제86조(그 밖에 계약내용의 변경으로 인한 계약금액의 조정) ① 계약담당자는 제82조 및 제85조에 따른 경우 외에 계약내용의 변경으로 계약금액을 조정하여야 할 필요가 있는 경우에는 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위안에서 이를 조정할 수 있다. 다만, 수의계약의 경우 조정금액이 당초 계약금액의 100%를 초과하는 경우에는 해당하지 아니한다.\n② 제85조제4항은 제1항의 경우에 이를 준용한다.","hist":"\u003c개정 2015.11.20., 2020.10.30.> \u003c개정 2015.11.20>","id":101,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"87","label":"제87조(단가계약)","chapter":"제5장 계약의 체결 및 이행","page":40,"part":"","text":"제87조(단가계약) 계약담당자는 일정한 기간 계속하여 제조․수리․가공․매매․공급․사용 등의 계약을 할 필요가 있을 때에는 단가에 대하여 계약을 체결할 수 있다. 제87조2(장기계약) 계약담당자는 보관･시설관리등의 용역계약, 전기･수도･가스등의 공급계약, 임차, 유지보수계약, 그 밖에 그 성질상 수년간 계속하여 존속할 필요가 있거나 이행에 수년이 필요한 계약을 체결할 수 있으며, 이 경우에는 총계약금액과 연차별 계약이행 내용에 관한 사항을 명백히 하여야 한다.","hist":"\u003c본조신설 2021.10.28.>","id":102,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"88","label":"제88조(지체상금)","chapter":"제5장 계약의 체결 및 이행","page":41,"part":"","text":"제88조(지체상금) ① 계약담당자는 본회의 부담이 되는 계약에 있어서 계약상대자가 정당한 이유없이 계약의 이행을 지체한 때에는 계약금액에 다음 각 호에서 정하는 율과 지체일수를 곱한 지체상금을 현금으로 납부하게 하여야 한다. 다만, 본회의 수입이 되는 계약에 있어서 계약상대자가 대가의 지급을 지체할 경우 또는 임차계약의 종료 등으로 인하여 본회가 임차보증금을 반환받는 경우에는 그 대가에 대하여 지체일수에 본회의 일반자금대출 연체이율을 곱하여 산출한 지연이자를 붙여서 납부하게 할 수 있다.\n1. 공사 : 1000분의 0.5\n2. 물품의 제조․구매 : 1000분의 0.75\n3. 물품의 수리․가공․대여, 용역 및 기타 : 1000분의 1.25\n4. 군납용 음․식료품 제조․구매 : 1000분의 1.5\n5. 운송 및 보관 : 1000분의 2.5\n② 제1항의 경우 기성부분 또는 기납부분에 대하여 검사를 거쳐 이를 인수한 때에는 그 부분에 상당하는 금액을 계약금액에서 공제한 금액을 기준으로 지체상금을 계산하여야 한다. 이 경우 기성부분 또는 기납부분의 인수는 성질상 분할할 수 있는 제조 또는 공사에 대한 완성부분으로서 인수하는 것에 한한다.\n③ 제1항에 따른 지체상금의 징수사유가 발생하고 그 금액이 계약보증금상당액(면제된 계약보증금을 포함한다)에 달하는 경우로서 계약상대자의 귀책사유로 인하여 계약을 수행할 가능성이 없음이 명백하다고 인정될 때에는 계약담당자는 계약보증금을 본회에 귀속시키고 당해계약을 해제 또는 해지할 수 있다.\n④ 계약의 이행지체가 본회의 사정 또는 천재지변, 그 밖에 불가항력적인 사유라고 인정되거나 선수물자사업을 위한 계약에 있어서 지도경제대표이사가 따로 정하는 바에 의하였을 경우, 그 밖에 지도경제대표이사가 부득이하다고 인정한 경우에는 그 해당일수에 대한 지체상금을 감면할 수 있다.","hist":"\u003c개정 2019.11.15> \u003c개정 2019.11.15> \u003c개정 2019.11.15> \u003c신설 1997. 2.14, 개정 2019.11.15> \u003c신설 1997. 2.14, 개정 2019.11.15> \u003c개정 2015.11.20> \u003c개정 2002. 7. 8, 2010.12. 2, 2015.11.20>","id":103,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"89","label":"제89조(부정당업자의 입찰참가자격 제한)","chapter":"제5장 계약의 체결 및 이행","page":42,"part":"1/2","text":"제89조(부정당업자의 입찰참가자격 제한) ① 계약담당자는 계약상대자, 입찰자 또는 제40조제1항에 따라 견적서를 제출하는 자(이하 이 항에서 “계약상대자 등”이라 하며, 계약상대자 등의 대리인, 지배인 또는 그 밖의 사용인을 포함한다)가 다음 각 호의 어느 하나에 해당하여, 경쟁의 공정한 집행 또는 계약의 적정한 이행을 해칠 염려가 있거나 그 밖의 입찰에 참가시키는 것이 적합하지 않다고 인정되는 경우(이하 “부정당업자”라 한다)에는 해당 계약상대자 등에게 지체 없이 1개월 이상 2년 이하의 범위에서 해당 계약상대자 등의 자격(입찰참가자격, 수의계약 체결을 포함한다)을 제한하여야 한다. 다만, 제14호의 경우에는 그 기간을 1개월 이상 5년 이하로 한다.\n1. 부실시공 또는 부실설계를 한 자\n2. 「건설산업기본법」․「전기공사업법」․「정보통신공사업법」 그 밖에 다른 법령에 따른 하도급의 제한 규정에 위반(하도급 통지의무위반의 경우를 제외한다)하여 하도급한 자 및 본회의 승인없이 하도급을 하거나 본회의 승인을 얻은 하도급조건을 변경한 자\n3. 「독점규제 및 공정거래에 관한 법률」 또는 「하도급거래 공정화에 관한 법률」에 위반하여 공정거래위원회로부터 입찰참가자격제한 요청이 있는 자\n4. 계약을 이행함에 있어서 조잡 또는 부당하게 하거나 부정한 행위를 한 자 또는 조사 설계용역계약에 있어서 고의 또는 중대한 과실로 총사업비를 적정하게 산정하지 아니한 자\n5. 공사의 경우 안전대책을 소홀히 하여 공중에게 위해를 가한 자\n6. 정당한 이유없이 계약을 체결 또는 이행하지 아니한 자\n7. 삭제\n8. 입찰 또는 계약에 관한 서류를 위조․변조하거나 부정하게 행사한 자 또는 허위서류를 제출한 자\n9. 고의로 무효의 입찰을 한 자\n10. 삭제\n11. 입찰참가자격신청서 또는 입찰참가승낙서를 제출하고도 정당한 이유없이 당해 회계연도 중 3회이상 입찰에 참가하지 아니한 자\n12. 입찰참가를 방해하거나 낙찰자의 계약체결 또는 그 이행을 방해한 자\n13. 감독 또는 검사에 있어서 그 직무의 수행을 방해한 자\n14. 제5조의2에 따른 청렴계약 이행사항을 위반한 자\n② 제1항에 따른 입찰참가자격 제한의 세부기준은 「국가를 당사자로 하는 계약에 관한 법률」의 정하는 바를 준용한다.\n③ 부정당업자가 수개의 위반행위를 하여 제1항 각 호의 제한사유 중 두 개 이상에 해당하는 경우에는 그 중 무거운 제한기준에 따른다.","hist":"\u003c개정 2002. 7. 8, 2011. 5.19, 2014.12. 5, 2015.11.20> \u003c개정 2002. 7. 8, 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20> \u003c2011. 5.19> \u003c개정 2015.11.20> \u003c2011. 5.19> \u003c신설 2011. 5.19> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20>","id":104,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"89","label":"제89조(부정당업자의 입찰참가자격 제한)","chapter":"제5장 계약의 체결 및 이행","page":42,"part":"2/2","text":"④ 부정당업자에 대한 입찰참가자격을 제한할 때 위반정도가 경미하거나 그 밖에 정상을 참작할 특별한 사유가 있는 경우에는 입찰참가자격의 제한기간을 6개월 이내에서 경감할 수 있다. 다만, 제5조의2를 위반한 경우에는 제재기간을 경감할 수 없다.\n⑤ 제1항 및 제2항에 따라 입찰참가자격의 제한을 받은 자가 법인, 그 밖에 단체인 경우에는 그 대표자에 대하여도, 중소기업협동조합인 경우에는 그 원인을 직접 야기시킨 조합원에 대하여도 제1항을 적용한다. 다만, 대표자가 수인이 있는 경우로 당해 입찰 또는 계약에 관한 업무를 관장하지 아니한 대표자에 대하여는 예외로 한다.\n⑥ 제1항 및 제2항에 따라 자격이 제한된 자를 대표자로 사용하여 그 대표자가 입찰에 관하여는 경우에는 그 사용자에 대하여도 제1항을 적용한다.\n⑦ 제1항에 따른 처분을 하고자할 때에는 미리 당해 처분의 상대방 또는 그 대리인에게 의견을 진술할 기회를 주어야 하며, 필요하다고 인정될 때에는 이해관계인의 의견을 들어야 한다. 다만, 해당 처분의 상대방 또는 그 대리인이 정당한 사유없이 이에 응하지 아니하거나 주소불명 등으로 의견진술의 기회를 줄 수 없는 경우에는 예외로 한다.\n⑧ 본회에 재직하고 있는 임직원 또는 임직원의 4촌 이내의 친족(「민법」 제767조에 따른 친족을 말한다)이 설립하거나 취업한 업체(임원으로 취업한 경우를 말한다)에 대해서는 입찰참가자격과 제36조에 따른 수의계약 체결을 제한하여야 한다. 다만, 제5조에 따라 경쟁입찰에 부치거나 제36조제1호, 제5호부터 제7호까지, 제16호에 해당하는 경우에는 예외로 할 수 있다. ⑨ 본회 퇴직자가 설립하거나 재취업한 업체(임원으로 취업한 경우를 말한다)에 대해서는 설립일 또는 재취업일부터 2년 이내에서 입찰참가자격과 제36조에 따른 수의계약 체결을 제한하여야 한다. 다만, 제5조에 따라 경쟁입찰에 부치거나 제36조제1호, 제5호부터 제7호까지, 제16호에 해당하는 경우에는 예외로 할 수 있다.","hist":"\u003c개정 2002. 7. 8, 2011. 5.19, 2014.12. 5, 2015.11.20> \u003c개정 2002. 7. 8, 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20> \u003c2011. 5.19> \u003c개정 2015.11.20> \u003c2011. 5.19> \u003c신설 2011. 5.19> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20> \u003c개정 2014.12. 5, 2015.11.20>","id":105,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"89-2","label":"제89조의2(계약서 기재 사항)","chapter":"제5장 계약의 체결 및 이행","page":43,"part":"","text":"제89조의2(계약서 기재 사항) 계약담당자가 계약을 체결할 때에는 제60조의2에 따라 계약서 작성이 생략되는 경우를 제외하고는 다음 각 호의 사항을 계약서에 기재하여야 한다.\n1. 본회의 해당 업무 관련 직원에게 향응 또는 금품제공을 한 업체 및 업체관련자가 있는 것으로 판명된 때에는 본회가 당해 계약의 해지 또는 해제권을 가진다.\n2. 제1호에 따라 성립된 계약해지 또는 해제권이 행사된 경우 당해 업체의 계약보증금은 본회에 귀속된다.\n3. 제89조 제1항 각 호의 사항","hist":"\u003c개정 2015.11.20, 2024. 10. 15.> \u003c개정 2015.11.20> \u003c개정 2015.11.20> \u003c본조신설 2002. 7. 8>","id":106,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"89-3","label":"제89조의3(계약관리)","chapter":"제5장 계약의 체결 및 이행","page":44,"part":"","text":"제89조의3(계약관리) ① 계약담당자는 계약을 체결한 동시에 계약종류(공사, 물품, 용역 등), 계약명, 계약금액, 계약기간, 계약상대자, 계약방법 등을 포함하는 계약현황을 관리하여야 한다.\n② 계약담당자는 계약금액이 3천만원을 초과하는 수의계약을 체결한 경우 본회 홈페이지에 수의계약 사유 및 세부 계약정보를 1년간 공시하여야 한다.","hist":"\u003c신설 2017.12. 1> \u003c신설 2011. 5. 19, 개정 2014.12. 5, 2017.12. 1>","id":107,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"90","label":"제90조(부정당업자 통보)","chapter":"제5장 계약의 체결 및 이행","page":44,"part":"","text":"제90조(부정당업자 통보) ① 계약담당자는 입찰참가자격을 제한한 때에는 다음 각 호의 사항을 명백히 하여 제4조제1호에 정한 계약담당자와 회원에게 통보하여야 한다.\n1. 업체(상호)명․주소․성명(법인인 경우 대표자성명, 법인등록번호\n등)․생년월일․사업자등록번호․관계법령상 면허 또는 등록번호\n2. 입찰참가자격 제한기간\n3. 입찰참가자격을 제한하는 구체적인 사유\n② 계약담당자는 부정당업자로 입찰참가자격 제한의 통보를 받은 자에 대하여는 필요한 대장을 작성 비치하고 당해 제한기간내에는 본회에서 집행하는 모든 입찰에 참가할 수 없도록 하여야 하며, 부득이한 사유가 없는 한 그와 수의계약을 체결하여서는 안된다.\n③ 계약담당자는 「국가를 당사자로 하는 계약에 관한 법률」에 따라 입찰참가자격을 제한한 사실을 통보받거나 관보에 게재된 자에 대하여도 제2항의 조치를 할 수 있다.","hist":"\u003c개정 2016.10.25> \u003c개정 2014.12. 5, 2015.11.20>","id":108,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"90-2","label":"제90조의2(계약행위 위임)","chapter":"제5장 계약의 체결 및 이행","page":44,"part":"","text":"제90조의2(계약행위 위임) ①「조달사업에 관한 법률」에 따라 조달청을 통하여 물품(공사․용역 포함)을 구매하고자 할 때에는 조달청에 구매를 위임할 수 있다.\n② 본회가 발주하는 공사․구매․용역 등에 대하여는 본회 또는 회원이 납입자본금의 50% 이상을 출자한 법인에 이를 위임할 수 있으며, 이 경우 계약금액 총액의 5% 이내에서 당사자가 상호 협의하여 수수료를 결정할 수 있다.","hist":"\u003c신설 2010.12. 2, 개정 2014.12. 5, 2015.11.20.> \u003c신설 2021. 5.21>","id":109,"src":"contract"},{"doc":"main","docTitle":"계약 규정","art":"90-3","label":"제90조의3(계약의 자동연장)","chapter":"제5장 계약의 체결 및 이행","page":45,"part":"","text":"제90조의3(계약의 자동연장) ① 계약담당자는 계약내용에 따라 당해 계약을 자동연장할 경우 계약 종료 전에 신규 계약의 체결에 준하여 계약 유지의 적정성을 검토하여야 한다. 이 경우 계약상대자의 주소의 변경 등 경미한 사항과 계약 기간을 제외하고는 최초에 체결한 계약금액, 계약내용을 변경할 수 없다.\n② 전항의 경우 계약담당자는 계약목적 달성여부, 계약상대자의 계약이행 능력, 계약 연장의 이익여부 등을 고려하여야 한다.","hist":"\u003c개정 2021.10.28.> \u003c본조신설 2019.11.15>","id":110,"src":"contract"} 합중앙회 지도경제대표이사 계약상대자 ·상호 또는 법인명칭 ·법인등록번호 ·주소 ··대표자 연대보증인 계약내용 공사명 계약금액 금 원정(￦ ) (직‧간접노무비 포함) (노무비 : ￦ 부가가치세 : ￦ ) 총공사부기금액 금 원정(￦ ) 계약보증금 금 원정(￦ ) 현장 지체상금률 % 물가변동계약 금액조정방법 착공연월일 년월일 준공연월일 년월일 기타사항 하자담보책임(복합공종의 경우 공종별 구분 기재) 공종 공종별 계약 금액 하자보수보증금율(%) 하자담보책임기간 수산업협동조합중앙회와 계약상대자는 상호 대등한 입장에서 붙임의 계약문서에 의하여 위의 공사에 대한 도급계약을 체결하고 신의에 따라 성실히 계약상의 의무를 이행할 것을 확약하며, 연대보증인은 계약자와 연대하여 계약상의 의무를 이행할 것을 확약한다. 이 계약의 증거로서 계약서를 작성하여 당사자가 기명날인한 후 각각 1통씩 보관한다. 붙임서류 : 1. 공사입찰유의서 1부\n2. 공사계약일반조건 1부\n3. 공사계약특수조건 1부\n4. 설계서 1부\n5. 시방서 1부. ... 수산업협동조합중앙회 지도경제대표이사 (인) 위 대리인 0000부장 0 0 0 계약상대자 (인) 연대보증인 (인)","hist":"","id":143,"src":"contract"},{"doc":"annex2","docTitle":"별지 제2호 물품구매표준계약서(안)","art":"","label":"머리말","chapter":"","page":50,"part":"","text":"물품구매표준계약서(안) 계약번호 제0000-000호 공고번호 제0000-000호 계약자 발주처 수산업협동조합중앙회 지도경제대표이사 계약상대자 ·상호 또는 법인명칭 ·법인등록번호 ·주소 ··대표자 계약내용 물품명 계약금액 금 원정(￦ ) 총제조부기금액 금 원정(￦ ) 계약보증금 금 원정(￦ ) 지체상금률 % 물가변동계약 금액조정방법 납품일자 ... 납품장소 ... 기타사항 수산업협동조합중앙회와 계약상대자는 상호 대등한 입장에서 붙임의 계약문서에 의하여 위의 물품에 대한 구매계약을 체결하고 신의에 따라 성실히 계약상의 의무를 이행할 것을 확약하며, 이 계약의 증거로서 계약서를 작성하여 당사자가 기명날인한 후 각각 1통씩 보관한다. 붙임서류 : 1. 물품구매입찰유의서 1부\n2. 물품구매계약일반조건 1부\n3. 물품구매계약특수조건 1부\n4. 규격 및 내용서 1부\n5. 산출내역서 1부 ... 수산업협동조합중앙회 지도경제대표이사 (인) 위 대리인 0000부장 0 0 0 계약상대자 (인) 물품내역서 품명 규격 단위 수량 단가 금액","hist":"","id":144,"src":"contract"},{"doc":"annex3","docTitle":"별지 제3호 용역표준계약서(안)","art":"","label":"머리말","chapter":"","page":51,"part":"","text":"용역표준계약서(안) 계약번호 제0000-000호 공고번호 제0000-000호 계약자 발주처 수산업협동조합중앙회 지도경제대표이사 계약상대자 ·상호 또는 법인명칭 ·법인등록번호 ·주소 ··대표자 계약내용 용역명 계약금액 금 원정(￦ ) 총용역부기금액 금 원정(￦ ) 계약보증금 금 원정(￦ ) 지체상금률 % 계약기간 ...~... 위치 ... 기타사항 수산업협동조합중앙회와 계약상대자는 상호 대등한 입장에서 붙임의 계약문서에 의하여 위의 용역에 대한 도급계약을 체결하고 신의에 따라 성실히 계약상의 의무를 이행할 것을 확약하며, 이 계약의 증거로서 계약서를 작성하여 당사자가 기명날인한 후 각각 1통씩 보관한다. 붙임서류 : 1. 용역입찰유의서 1부\n2. 용역계약일반조건 1부\n3. 용역계약특수조건 1부\n4. 과업내용서 1부 ... 수산업협동조합중앙회 지도경제대표이사 (인) 위 대리인 0000부장 0 0 0 계약상대자 (인)","hist":"","id":145,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"","label":"머리말","chapter":"","page"
