:52,"part":"","text":"공사계약일반조건 (안)","hist":"","id":146,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"1","label":"제1조(총칙)","chapter":"","page":52,"part":"","text":"제1조(총칙) 수협중앙회(이하 “수협”이라 한다)와 계약상대자는 공사도급표준계약서(이하 \"계약서\"라 한다)에 기재한 공사의 도급계약에 관하여 제3조에 의한 계약문서에서 정하는 바에 따라 신의와 성실의 원칙에 입각하여 이를 이행한다.","hist":"","id":147,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"2","label":"제2조(정의)","chapter":"","page":52,"part":"","text":"제2조(정의) 이 조건에서 사용하는 용어의 정의는 다음과 같다.\n1. \"계약상대자\"라 함은 수협과 공사계약을 체결한 자연인 또는 법인을 말한다.\n2. \"공사감독자\"라 함은 공사의 수행과 품질의 확보 및 향상을 위한 업무를 수행하기 위하여 수협이 임명한 직원 또는 그의 대리인을 말한다.\n3. \"설계서\"라 함은 공사시방서, 설계도면, 현장설명서, 산출내역서 등을 말한다.\n4. \"공사시방서\"라 함은 공사에 쓰이는 재료, 설비, 시공체계, 시공기준 및 시공기술에 대한 기술설명서와 이에 적용되는 행정명세서로서, 설계도면에 대한 설명 또는 설계도면에 기재하기 어려운 기술적인 사항을 표시해 놓은 도서를 말한다.\n5. \"설계도면\"이라 함은 시공될 공사의 성격과 범위를 표시하고 설계자의 의사를 일정한 약속에 근거하여 그림으로 표현한 도서로서 공사목적물의 내용을 구체적인 그림으로 표시해 놓은 도서를 말한다.\n6. \"현장설명서\"라 함은 현장설명 시 교부하는 도서로서 시공에 필요한 현장상태 등에 관한 정보 또는 단가에 관한 설명서 등을 포함한 입찰가격 결정에 필요한 사항을 제공하는 도서를 말한다.","hist":"","id":148,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"3","label":"제3조(계약문서)","chapter":"","page":52,"part":"","text":"제3조(계약문서) ①계약문서는 계약서, 설계서, 유의서, 공사계약일반조건, 공사계약특수조건 등으로 구성되며 상호보완의 효력을 가진다.\n②이 조건이 정하는 바에 의하여 계약당사자간에 행한 통지문서등은 계약문서로서의 효력을 가진다.","hist":"","id":149,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"4","label":"제4조(사용언어)","chapter":"","page":52,"part":"","text":"제4조(사용언어) ①계약을 이행함에 있어서 사용하는 언어는 한국어로 함을 원칙으로 한다.\n②수협은 계약체결시 제1항에도 불구하고 필요하다고 인정하는 경우에는 계약이행과 관련하여 계약상대자가 외국어를 사용하거나 외국어와 한국어를 병행하여 사용할 수 있도록 필요한 조치를 할 수 있다.\n③제2항에 의하여 외국어와 한국어를 병행하여 사용한 경우에 외국어로 기재된 사항이 한국어와 상이할 때에는 한국어로 기재한 사항이 우선한다.","hist":"","id":150,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"5","label":"제5조(통지 등)","chapter":"","page":53,"part":"","text":"제5조(통지 등) ①구두에 의한 통지·신청·청구·요구·회신·승인 또는 지시(이하 \"통지 등\"이라 한다)는 문서로 보완되어야 효력이 있다.\n②통지 등의 장소는 계약서에 기재된 주소로 하며, 주소를 변경하는 경우에는 이를 즉시 계약당사자에게 통지하여야 한다.\n③통지 등의 효력은 계약문서에서 따로 정하는 경우를 제외하고는 계약당사자에게 도달한 날부터 발생한다. 이 경우 도달일이 공휴일인 경우에는 그 익일부터 효력이 발생한다.\n④계약당사자는 계약이행중 이 조건 및 관계법령 등에서 정한 바에 따라 서면으로 정당한 요구를 받은 경우에는 이를 성실히 검토하여 회신하여야 한다.","hist":"","id":151,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"6","label":"제6조(계약보증금)","chapter":"","page":53,"part":"1/2","text":"제6조(계약보증금) ①계약을 체결하고자 하는 자는 계약체결일까지 수협중앙회 「계약 규정」(이하 “계약 규정”이라 한다) 제61조에 따라 계약금액의 100분의 10이상의 계약보증금을 현금(금융기관 또는 체신관서발행 자기앞수표를 포함한다)으로 수협에 납부하여야 하며, 다음에 열거한 보증서 또는 증권 등으로 현금에 갈음하여 납부할 수 있다.\n1. 국가재정법 시행령 제46조 제4항의 규정에 의한 금융기관(이하 ‘금융기관’이라 한다.) 및 은행법에 의한 외국인금융기관이 발행한 지급보증서\n2. 자본시장과 금융투자업에 관한 법률 시행령 제192조에 따른 증권\n3. 보험업법에 의한 보험회사가 발행한 보증보험증권\n4. 건설산업기본법에 따른 공제조합, 전기공사공제조합법에 따른 전기공사공제조합, 신용보증기금법에 따른 신용보증기금, 기술보증기금법에 따른 기술보증기금, 정보통신공사업법에 따른 정보통신공제조합, 엔지니어링산업 진흥법에 따른 엔지니어링공제조합, 산업발전법에 의한 공제조합, 소프트웨어산업진흥법에 의한 소프트웨어공제조합, 전력기술관리법에 따른 전력기술인단체, 건설폐기물의 재활용촉진에 관한 법률에 따른 공제조합, 골재채취법에 따른 공제조합, 지역신용보증재단법에 따른 신용보증재단, 관광진흥법에 따른 한국관광협회중앙회, 건설기술진흥법에 따른 공제조합, 소방산업의 진흥에 관한 법률에 따른 소방산업공제조합, 문화재수리 등에 관한 법률에 따른 문화재수리협회, 건축사법에 따른 건축사공제조합, 중소기업협동조합법에 따른 중소기업중앙회, 콘텐츠산업 진흥법에 따른 콘텐츠공제조합이 발행한 채무액 등의 지급을 보증하는 보증서\n5. 제1호에 규정된 금융기관 및 외국금융기관과 체신관서가 발행한 정기예금증서\n6. 자본시장과 금융투자업에 관한 법률에 따라 신탁업자가 발행하는 수익증권\n7. 자본시장과 금융투자업에 관한 법률에 따라 집합투자업자가 발행하는 수익증권\n②공사계약에 있어서 계약규정 제70조에 따른 연대보증인을 세우지 아니하는 경우에는 제1항에도 불구하고 계약보증금을 계약금액의 100분의 20이상으로 납부하게 하거나 계약금액의 100분의 30이상을 납부할 것을 보증하는 공사이행보증서를 제출하여야 한다.","hist":"","id":152,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"6","label":"제6조(계약보증금)","chapter":"","page":53,"part":"2/2","text":"③계약상대자가 계약보증금의 전부 또는 일부의 납부를 면제받은 경우에는 수협에 귀속사유가 발생할 때에 계약보증금에 해당하는 금액을 현금으로 납입할 것을 보장하기 위하여 그 지급을 확약하는 내용의 문서(이하 “계약보증금지급각서”라 한다)를 제출하여야 한다.\n④계약상대자는 이 조건에 의하여 계약금액이 증액된 경우에는 이에 상응하는 금액의 계약보증금을 제1항에 따라 추가로 납부하여야 하며, 수협은 계약금액이 감액된 경우에는 이에 상응하는 금액의 계약보증금을 반환해야 한다.","hist":"","id":153,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"7","label":"제7조(계약보증금의 처리)","chapter":"","page":53,"part":"","text":"제7조(계약보증금의 처리) ①수협은 계약상대자가 정당한 이유없이 계약상의 의무를 이행하지 아니하거나 제30조제1항 각호에 해당하는 사유로 계약이 해제 또는 해지된 때에는 계약보증금을 수협에 귀속한다.\n②제6조제2항에 의하여 계약보증금지급각서를 제출한 경우로서 계약보증금의 귀속사유가 발생하여 수협의 납입요청이 있을 때에는 계약상대자는 해당 계약보증금을 지체없이 현금으로 납부하여야 한다.\n③계약상대자가 납부한 계약보증금은 계약이 이행된 후에 계약상대자에게 지체없이 반환한다.","hist":"","id":154,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"8","label":"제8조(공사자재의 검사)","chapter":"","page":53,"part":"","text":"제8조(공사자재의 검사) ①공사에 사용할 자재는 신품이어야 하며 품질·규격 등은 반드시 설계서와 일치되어야 한다. 다만, 설계서에 명확히 규정되지 아니한 자재는 표준품 이상으로서 계약의 목적을 달성하는 데에 가장 적합한 것이어야 한다.\n②계약상대자는 공사자재를 사용하기 전에 공사감독자의 검사를 받아야 하며, 불합격된 자재는 즉시 대체하여 다시 검사를 받아야 한다.\n③제2항에 의한 검사에 이의가 있을 경우에 계약상대자는 수협에 대하여 재검사를 요청할 수 있으며, 재검사가 필요하다고 인정되는 경우에 수협은 지체없이 재검사하도록 조치하여야 한다.\n④수협은 계약상대자로부터 공사에 사용할 자재의 검사를 요청받거나 제3항에 의한 재검사의 요청을 받은 때에는 정당한 이유없이 검사를 지체할 수 없다.\n⑤계약상대자가 불합격된 자재를 즉시 이송하지 않거나 대체하지 아니하는 경우에는 수협이 일방적으로 불합격 자재를 제거하거나 대체시킬 수 있다.\n⑥계약상대자는 시험 또는 조합이 필요한 자재가 있는 경우 공사감독자의 참여하에 그 시험 또는 조합을 하여야 한다.\n⑦수중 또는 지하에 매몰하는 공작물 기타 준공후 외부로부터 검사할 수 없는 공작물의 공사는 공사감독자의 참여하에 시공하여야 한다.\n⑧계약상대자가 제1항 내지 제7항이 정한 조건에 위배하거나 또는 설계서에 합치되지 않는 시공을 하였을 때에는 수협은 공작물의 대체 또는 개조를 명할 수 있다.\n⑨제2항 내지 제8항의 경우에 계약금액을 증감하거나 계약기간을 연장할 수 없다. 다만, 제3항에 의하여 재검사 결과에서 적합한 자재인 것으로 판명될 경우에는 재검사에 소요된 기간에 대하여는 계약기간을 연장할 수 있다.","hist":"","id":155,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"9","label":"제9조(관급자재 및 대여품)","chapter":"","page":54,"part":"","text":"제9조(관급자재 및 대여품) ①수협은 공사의 수행에 필요한 특정자재 또는 기계·기구 등을 계약상대자에게 공급하거나 대여할 수 있으며, 이 경우에 관급자재 등(관급자재 및 대여품을 말한다. 이하 같다)은 설계서에 명시되어 있어야 한다.\n②관급자재 등은 공사공정예정표에 따라 적기에 공급되어야 하며, 인도일시 및 장소는 계약당사자간에 협의하여 결정한다.\n③관급자재 등의 소유권은 수협에 있으며, 잉여분이 있을 경우에는 계약상대자는 수협의 지시에 따라 이를 반환하여야 한다.\n④제2항에 의한 인도후의 관급자재 등에 대한 관리상의 책임은 계약상대자에게 있으며, 계약상대자가 이를 멸실 또는 훼손하였을 경우에는 수협에 변상하여야 한다.\n⑤계약상대자는 관급자재 등을 계약의 수행외의 목적으로 사용할 수 없으며, 공사감독자의 서면승인 없이는 현장외부로 반출하여서는 아니된다.\n⑥계약상대자는 관급자재 등을 인수할 때에는 이를 검수하여야 하며 그 품질 또는 규격이 시공에 적당하지 아니하다고 인정될 경우에는 즉시 수협에게 이를 통지하여 대체를 요구하여야 한다.\n⑦수협은 필요하다고 인정할 경우에는 관급자재 등의 수량·품질·규격·인도시기·인도장소 등을 변경할 수 있다.","hist":"","id":156,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"10","label":"제10조(공사현장대리인)","chapter":"","page":54,"part":"","text":"제10조(공사현장대리인) ①계약상대자는 계약된 공사에 적격한 공사현장대리인(건설산업기본법시행령 제35조\n[별표5] 등 공사관련 법령에 따른 기술자 배치기준에 적합한 자를 말한다. 이하 같다)을 지명하여 수협에게 통지하여야 한다.\n②공사현장대리인은 공사현장에 상주하여 계약문서와 공사감독자의 지시에 따라 공사현장의 관리 및 공사에 관한 모든 사항을 처리하여야 한다.","hist":"","id":157,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"11","label":"제11조(공사현장 근로자)","chapter":"","page":54,"part":"","text":"제11조(공사현장 근로자) ①계약상대자는 해당계약의 시공 또는 관리에 필요한 기술과 경험을 가진 근로자를 채용하여야 하며 근로자의 행위에 대하여 책임을 져야 한다. 다만, 계약상대자가 근로자의 관리·감독에 상당한 주의와 의무를 다한 경우에는 그러하지 아니하다.\n②계약상대자는 수협이 계약상대자가 채용한 근로자에 대하여 해당계약의 시공 또는 관리상 적당하지 아니하다고 인정하여 이의 교체를 요구한 때에는 즉시 교체하여야 하며 수협의 승인없이는 교체된 근로자를 해당계약의 시공 또는 관리를 위하여 다시 채용할 수 없다.","hist":"","id":158,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"12","label":"제12조(공사감독자)","chapter":"","page":54,"part":"","text":"제12조(공사감독자) ①공사감독자는 계약된 공사의 수행과 품질의 확보 및 향상을 위한 일체의 업무를 수행한다.\n②공사감독자는 계약상대자의 의무와 책임을 면제시키거나 증감시킬 수 없다.","hist":"","id":159,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"13","label":"제13조(공사의 착공)","chapter":"","page":54,"part":"","text":"제13조 (공사의 착공) ① 계약상대자는 계약의 내용에 따라 착공하여야 하며, 착공시에는 수협에 착공계와 공사공정예정표를 제출하여 승인을 얻어야 한다.\n②수협은 공사의 전부 또는 일부의 진행이 지연되어 소정기한 내에 공사가 준공될 수 없다고 인정할 때에는 공사추진에 필요한 조치를 계약상대자에게 요구할 수 있다.\n③계약상 별도의 규정이 없는 한 공사가 긴급을 요하여 수협이 필요하다고 인정하는 경우를 제외하고는 수협의 승인없이 야간작업을 할 수 없다.\n④수협의 승인을 얻어 야간작업을 하는 경우에도 계약상대자는 야간작업으로 인한 추가비용을 요구할 수 없으며, 야간작업을 실시함으로써 발생하는 공작물 또는 제3자에 대하여 발생하는 일체의 문제는 계약상대자가 책임을 진다. 다만, 수협이 부득이한 사유로 인하여 야간작업을 지시했을 때에는 야간작업으로 인한 추가비용은 수협이 부담한다.","hist":"","id":160,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"14","label":"제14조(설계변경 등)","chapter":"","page":55,"part":"","text":"제14조(설계변경 등) ①설계변경은 다음 각호의 어느 하나에 해당하는 경우에 한다.\n1. 설계서의 내용이 불분명하거나 누락·오류 또는 상호 모순되는 점이 있을 경우\n2. 지질, 용수등 공사현장의 상태가 설계서와 다를 경우\n3. 새로운 기술·공법사용으로 공사비의 절감 및 시공기간의 단축 등의 효과가 현저할 경우\n4. 기타 수협이 설계서를 변경할 필요가 있다고 인정할 경우 등\n②제1항에 의한 설계변경은 그 설계변경이 필요한 부분의 시공전에 완료하여야 한다. 다만, 수협은 공정이행의 지연으로 품질저하가 우려되는 등 긴급하게 공사를 수행할 필요가 있는 때에는 계약상대자와 협의하여 설계변경의 시기 등을 명확히 정하고, 설계변경을 완료하기 전에 우선시공을 하게 할 수 있다.","hist":"","id":161,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"15","label":"제15조(설계변경으로 인한 계약금액의 조정)","chapter":"","page":55,"part":"","text":"제15조(설계변경으로 인한 계약금액의 조정) ①수협은 설계변경으로 시공방법의 변경, 투입자재의 변경 등 공사량의 증감이 발생하는 경우에는 다음 각호의 어느 하나의 기준에 의하여 계약금액을 조정할 수 있다.\n1. 증감된 공사량의 단가는 계약단가로 한다. 다만 계약단가가 예정가격단가보다 높은 경우로서 물량이 증가하게 되는 때에는 그 증가된 물량에 대한 적용단가는 예정가격단가로 한다.\n2. 산출내역서에 없는 품목 또는 비목(동일한 품목이라도 성능, 규격 등이 다른 경우를 포함한다. 이하 \"신규비목\"이라 한다)의 단가는 설계변경당시를 기준으로 산정한 단가에 낙찰율(예정가격에 대한 낙찰금액 또는 계약금액의 비율을 말한다. 이하 같다)을 곱한 금액으로 한다.\n②발주기관이 설계변경을 요구한 경우(계약상대자의 책임없는 사유로 인한 경우를 포함한다. 이하 같다)에는 제1항에도 불구하고 증가된 물량 또는 신규비목의 단가는 설계변경당시를 기준으로 하여 산정한 단가와 동 단가에 낙찰율을 곱한 금액의 범위안에서 발주기관과 계약상대자가 서로 주장하는 각각의 단가기준에 대한 근거자료 제시 등을 통하여 성실히 협의(이하 \"협의\"라 한다) 하여 결정한다. 다만, 계약당사자간에 협의가 이루어지지 아니하는 경우에는 설계변경당시를 기준으로 하여 산정한 단가와 동 단가에 낙찰율을 곱한 금액을 합한 금액의 100분의 50으로 한다.\n③계약금액의 증감분에 대한 일반관리비 및 이윤 등은 계약체결시 제출한 일반관리비율 및 이윤율 등에 의한다.","hist":"","id":162,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"16","label":"제16조(물가변동으로 인한 계약금액의 조정)","chapter":"","page":55,"part":"1/2","text":"제16조 (물가변동으로 인한 계약금액의 조정)\n① 수협의 부담이 되는 계약을 체결(장기계속공사 등의 경우에는 제1차 계약의 체결을 말한다.)한 날로부터 90일 이상이 경과하고 동시에 다음 각 호의 1에 해당되는 때에는 계약금액을 조정할 수 있다. 이 경우 계약금액의 조정이 있은 후 조정기준일(조정사유가 발생한 날을 말한다)부터 90일 이내에는 이를 다시 조정하지 못한다.\n1. 품목조정율이 100분의 3이상 증감된 때\n2. 지수조정율이 100분의 3이상 증감된 때\n② 제1항제1호의 규정에 의한 품목조정율과 이에 관련된 등락폭 및 등락율 산정은 다음 각 호의 산식에 의한다. 이 경우 품목 또는 비목 및 계약금액 등은 조정기준일 이후에 이행될 부분을 그 대상으로 하며, 󰡒계약단가󰡓라 함은 계약 규정 제85조제2항제1호에 규정한 품목 또는 비목의 계약단가를, 󰡒물가변동당시 가격󰡓이라 함은 물가변동당시 산정한 각 품목 또는 비목의 가격을, 󰡒계약체결당시 가격󰡓이라 함은 계약체결당시 산정한 각 품목 또는 비목의 가격을 말한다.\n1. 품목조정율 =\n2. 등 락 폭 = 계약단가 × 등락율\n3. 등 락 율 =\n③ 계약의 특수성으로 인하여 적정한 거래실례가격이 없는 경우로서 원가계산에 의한 예정가격을 기준으로 계약한 경우에는 제2항제1호 산식중 각 품목 또는 비목의 수량에 등락폭을 곱하여 산출한 금액의 합계액에는 동합계액에 비례하여 증감되는 일반관리비 및 이윤 등을 포함하여야 한다.\n④ 제2항제1호의 등락폭을 산정함에 있어서는 다음 각호의 기준에 의한다.\n1. 물가변동당시가격이 계약단가보다 높고 동 계약단가가 계약체결당시가격보다 높을 경우의 등락폭은 물가변동당시가격에서 계약단가를 뺀 금액으로 한다.\n2. 물가변동당시가격이 계약체결당시가격보다 높고 계약단가보다는 낮을 경우의 등락폭은 영으로 한다.\n⑤ 제1항제2호의 규정에 의하여 계약금액을 조정하는 경우에는 계약상대자가 원가계산에 의한 예정가격을 기준으로 작성한 산출내역서를 첨부하여 체결한 계약의 경우로 하되, 지수조정율은 계약금액의 산출내역을 구성하는 비목군 및 다음 각호의 지수등에 의하여 산출한다.\n1. 한국은행이 조사하여 공표하는 생산자물가기본분류지수 또는 수입물가지수\n2. 국가․지방자치단체 또는 정부투자기관이 결정․허가 또는 인가하는 노임․가격 또는 요금의 평균지수","hist":"","id":163,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"16","label":"제16조(물가변동으로 인한 계약금액의 조정)","chapter":"","page":55,"part":"2/2","text":"3. 거래실례가격 또는 통계법 제4조의 규정에 의하여 통계작성 승인을 받은 기관이 조사하여 공표한 가격의 평균지수\n4. 기타 제1호 내지 제3호와 유사한 지수로서 기획재정부장관이 정하는 지수\n⑥ 제1항에 의하여 계약금액을 조정함에 있어서 그 조정금액은 계약금액중 조정기준일 이후에 이행되는 부분의 대가(이하 󰡒물가변동적용대가󰡓라 한다)에 품목조정율 또는 지수조정율을 곱하여 산출하되, 계약상 조정기준일전에 이행이 완료되어야 할 부분은 이를 물가변동적용대가에서 제외한다. 다만, 본회의 책임이 있는 사유 또는 천재지변 등 불가항력의 사유로 이행이 지연된 경우에는 물가변동 적용대가에 이를 포함한다.\n⑦ 동일한 계약에 대하여는 제1항제1호 및 제2호의 규정을 동시에 적용할 수 없으며 그 중 하나의 방법을 택하여 계약금액을 조정할 수 있다.","hist":"","id":164,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"17","label":"제17조(기타 계약내용의 변경으로 인한 계약금액의 조정)","chapter":"","page":56,"part":"","text":"제17조 (기타 계약내용의 변경으로 인한 계약금액의 조정) ① 수협은 공사계약에 있어서 제15조 및 제16조 외에 계약내용의 변경으로 계약금액을 조정하여야 할 필요가 있는 경우에는 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위 안에서 이를 조정할 수 있다.\n② 제1항의 경우 계약금액의 증감분에 대한 일반관리비 및 이윤 등은 제15조 제3항의 규정을 준용한다.","hist":"","id":165,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"18","label":"제18조(지체상금)","chapter":"","page":56,"part":"","text":"제18조(지체상금) ①계약상대자는 계약서에 정한 준공기한(계약서상 준공신고서 제출기일을 말한다. 이하 같다)내에 공사를 완성하지 아니한 때에는 매 지체일수마다 계약서에 정한 지체상금률을 계약금액에 곱하여 산출한 금액(이하 \"지체상금\"이라 한다)을 현금으로 납부하여야 한다.\n②수협은 제1항의 경우에 기성부분에 대하여 검사를 거쳐 이를 인수(인수하지 아니하고 관리·사용하고 있는 경우를 포함한다. 이하 이 조에서 같다)한 때에는 그 부분에 상당하는 금액을 계약금액에서 공제한다. 이 경우에 기성부분의 인수는 그 성질상 분할할 수 있는 공사에 대한 완성부분으로 인수하는 것에 한한다.\n③수협은 다음 각호의 어느 하나에 해당되어 공사가 지체되었다고 인정할 때에는 그 해당일수를 제1항의 지체일수에 산입하지 아니한다.\n1. 천재지변 등 불가항력적인 사유에 의한 경우\n2. 수협의 책임으로 착공이 지연되거나 시공이 중단되었을 경우\n3. 기타 계약상대자의 책임에 속하지 않은 사유로 인하여 지체된 경우\n④수협은 제1항에 의한 지체일수를 다음 각호에 따라 산정하여야 한다.\n1. 준공기한내에 준공신고서를 제출한 때에는 준공검사에 소요된 기간은 지체일수에 산입하지 아니한다. 다만, 준공기한 이후에 시정조치를 한 때에는 시정조치를 한 날부터 최종 준공검사에 합격한 날까지의 기간을 지체일수에 산입한다.\n2. 준공기한을 경과하여 준공신고서를 제출한 때에는 준공기한 익일부터 준공검사(시정조치를 한 때에는 최종 준공검사)에 합격한 날까지의 기간을 지체일수에 산입한다.\n3. 준공기한의 말일이 공휴일(관련 법령에 의하여 발주기관의 휴무일이거나 「근로자의 날 제정에 관한 법률」에 따른 근로자의 날(계약상대자가 실제 업무를 하지 아니한 경우에 한함)인 경우를 포함한다)인 경우에 지체일수는 공휴일의 익일 다음날부터 기산한다.","hist":"","id":166,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"19","label":"제19조(계약기간의 연장)","chapter":"","page":56,"part":"","text":"제19조(계약기간의 연장) ①계약상대자는 제18조제3항 각호의 어느 하나의 사유가 계약기간 내에 발생한 경우에는 계약기간 종료전에 지체없이 수정공정표를 첨부하여 공사감독자에게 서면으로 계약기간의 연장신청을 하여야 한다. 다만, 연장사유가 계약기간내에 발생하여 계약기간 경과후 종료된 경우에는 동 사유가 종료된 후 즉시 계약기간의 연장신청을 하여야 한다.\n②수협은 제1항에 의한 계약기간연장 신청이 접수된 때에는 즉시 그 사실을 조사 확인하고 공사가 적절히 이행될 수 있도록 계약기간의 연장 등 필요한 조치를 하여야 한다.\n③수협은 제1항에 의한 연장청구를 승인하였을 경우에는 동 연장기간에 대하여는 지체상금을 부과하여서는 아니된다.\n④제2항에 의하여 계약기간을 연장한 경우에는 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위안에서 계약금액을 조정할 수 있다.","hist":"","id":167,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"20","label":"제20조(검사)","chapter":"","page":57,"part":"","text":"제20조(검사) ①계약상대자는 공사를 완성하였을 때에는 그 사실을 준공신고서 등 서면으로 수협에게 통지하고 필요한 검사를 받아야 한다.\n②수협은 제1항의 통지를 받은 날로부터 14일 이내에 계약서, 설계서, 준공신고서 기타 관계 서류에 의하여 계약상대자의 입회하에 그 이행을 확인하기 위한 검사를 하여야 한다. 다만, 부득이한 경우에는 그 검사기간을 연장할 수 있다.\n③수협은 제2항의 검사에서 계약상대자의 계약이행내용의 전부 또는 일부가 계약에 위반되거나 부당함을 발견한 때에는 계약상대자에게 필요한 시정조치를 요구하여야 한다. 이 경우에는 계약상대자로부터 그 시정을 완료한 사실을 통지받은 날로부터 제2항의 기간을 계산한다.\n④제3항에 의하여 계약이행기간이 연장될 때에는 수협은 제18조에 의한 지체상금을 부과하여야 한다.\n⑤계약상대자는 제2항에 의한 검사에 입회·협력하여야 한다. 계약상대자가 입회를 거부하거나 검사에 협력하지 아니함으로써 발생하는 지체에 대하여는 제3항 및 제4항을 준용한다.\n⑥수협은 검사를 완료한 때에는 그 결과를 지체없이 계약상대자에게 통지하여야 한다. 이 경우에 계약상대자는 검사에 대한 이의가 있을 때에는 재검사를 요청할 수 있으며, 수협은 필요한 조치를 하여야 한다.\n⑦계약상대자는 제6항에 의한 검사완료통지를 받은 때에는 모든 공사시설, 잉여자재, 폐기물 및 가설물을 공사장으로부터 즉시 철거반출하여야 하며 공사장을 정돈하여야 한다.\n⑧기성대가지급시의 기성검사는 공사감독자가 작성한 감독조서의 확인으로 갈음할 수 있다.","hist":"","id":168,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"21","label":"제21조(인수)","chapter":"","page":57,"part":"","text":"제21조(인수) ①계약상대자는 공사를 완성하고 제20조의 규정에 의한 검사를 받은후 당해 공사목적물을 수협에 인도하여야 한다. 공사의 전부 또는 일부가 완성되어 수협이 필요한 경우에 수협이 그 인도를 요구한 때에도 또한 같다.\n②기성부문에 대하여는 제1항의 규정을 준용하되, 성질상 분할할 수 있는 공사에 대한 완성부분에 한한다.","hist":"","id":169,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"22","label":"제22조(일반적 손해 등)","chapter":"","page":57,"part":"","text":"제22조(일반적 손해 등) 공사목적물의 인도 전에 공사목적물에 대하여 계약상대자의 책임있는 사유로 인하여 발생한 손해는 계약상대자의 부담으로 한다. 제3자에게 손해를 발생시켰을 경우에도 또한 같다.","hist":"","id":170,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"23","label":"제23조(하자보증책임)","chapter":"","page":57,"part":"","text":"제23조(하자보증책임) ①계약상대자는 준공검사를 필한 날로부터 계약서에서 정하는 하자담보 책임기간 중 당해 공사의 하자보수를 보증하여야 한다.\n②계약상대자는 공사의 하자보수를 보증하기 위하여 계약서에서 정한 하자보수보증금을 계약금액에 곱하여 산출한 금액(이하󰡒하자보수보증금󰡓이라 한다)을 준공검사 후 그 공사의 대가를 지급할 때까지 수협에 현금 또는 제6조 제1항 각 호의 보증서 또는 증권 등으로 납부 또는 제출하여야 한다. 다만, 공사의 성질상 하자보수보증금의 납부가 필요하지 아니하다고 수협이 인정하여 그 납부를 면제할 경우에는 그러하지 아니한다.\n③계약상대자는 또는 연대보증인이 하자담보기간 중 수협으로부터 하자보수 요구를 받고 이에 불응한 경우에 제2항의 하자보수보증금은 수협에 귀속하며, 하자담보기간 중 하자로 인한 모든 피해에 대하여 배상할 의무를 진다.","hist":"","id":171,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"24","label":"제24조(특허권의 사용)","chapter":"","page":57,"part":"","text":"제24조(특허권의 사용) 공사의 시공이 특허권 기타 제3자의 권리의 대상으로 되어있는 시공방법을 사용할 때에는 계약상대자는 그 사용에 관한 일체의 책임을 져야 한다.","hist":"","id":172,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"25","label":"제25조(대가의 지급)","chapter":"","page":57,"part":"","text":"제25조 (대가의 지급) ① 계약상대자는 이 계약에 의한 공사를 완성한 후 제20조의 규정에 의한 수협의 검사에 합격한 때에는 소정의 절차에 따라 대가지급을 청구할 수 있다.\n② 수협은 제1항의 청구를 받은 때에는 다른 특약이 없는 한 그 청구를 받은 날로부터 5일 이내에 그 대가를 지급한다. 다만, 부득이한 사정이 있는 경우에는 계약상대자와 합의하여 일정기간동안 대가의 지급기한을 연장할 수 있다.\n③ 기성부분에 대한 대가를 지급하는 경우에는 제20조의 규정에 의한 검사를 한 후 계약상대자의 청구에 의하여 지급할 수 있으며 이 경우에는 계약의 수량, 이행의 전망, 이행기간 등을 참작하여 30일마다 지급할 수 있으며 제2항을 준용한다.\n④ 수협은 제1항 또는 제3항의 청구를 받은 후 그 청구내용의 전부 또는 일부가 부당함을 발견할 때에는 그 사유를 명시하여 계약상대자에게 당해 청구를 반송할 수 있다. 이 경우에는 반송한 날로부터 재청구를 받은 날까지의 기간은 제2항의 지급기간에 이를 산입하지 아니한다.","hist":"","id":173,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"26","label":"제26조(대가의 선급)","chapter":"","page":58,"part":"","text":"제26조 (대가의 선급) ① 수협은 다음 각 호의 요건을 충족하는 경우로서 계약상대자가 계약대가의 선금지급을 요청한 때에는 선금을 지급할 수 있다.\n1. 계약금액(단가계약의 경우에는 선금지급요청일 까지의 발주금액)이 3천만원 이상인 공사 또는 물품제조 계약과 5백만원 이상인 용역계약\n2. 본회로부터 입찰참가자격 제한을 받은 사실이 없거나 입찰참가자격 제한을 받고 당해 제한기간 만료후 동 제한기간 이상이 경과된 경우\n② 제1항에 따라 계약대가의 선금을 지급할 경우에는 계약금액에 대해 다음 각 호의 율에 해당하는 금액 이내에서 지급하여야 한다.\n1. 공사\n가. 계약금액의 100억원 이상인 경우 : 100분의 30\n나. 계약금액이 20억원 이상 100억원 미만인 경우 : 100분의 40\n다. 계약금액이 20억원 미만인 경우 : 100분의 50\n③ 제1항 및 제2항의 경우에 기성부분 또는 기납부분에 대하여 대가를 지급한 때에는 계약금액(단가계약의 경우에는 발주금액)에서 그 대가를 공제한 금액을 기준으로 한다.\n④ 계약대가의 선금을 지급함에 있어 선금채권확보, 선금의 사용제한, 선금의 정산방법, 선금의 반환청구 등에 관하여 필요한 사항은 정부의 「계약예규」(\"정부 입찰․계약 집행기준“을 말한다)를 준용한다.","hist":"","id":174,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"27","label":"제27조(하도급의 승인 등)","chapter":"","page":58,"part":"","text":"제27조 (하도급의 승인 등) ①계약상대자가 계약된 공사의 일부를 제3자에게 하도급 하고자 하는 경우에는 「 건설산업기본법」 등 관련법령에 정한 바에 의하여야 한다.\n② 수협은 제1항에 의하여 계약상대자로부터 하도급계약을 통보받은 때에는 국토교통부장관이 고시한 건설공사하도급심사기준에 정한 바에 따라 하도급금액의 적정성을 심사하여야 한다.","hist":"","id":175,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"28","label":"제28조(부분사용 및 부가공사)","chapter":"","page":58,"part":"","text":"제28조 (부분사용 및 부가공사) ① 수협은 공사목적물의 인수 전에 기성공작물이나 미완성부분을 사용할 수 있으며, 부가공사를 할 수 있다.\n② 제1항의 경우 계약상대자와 부가공사에 대한 계약상대자는 수협의 지시에 따라 공사를 진행하여야 한다.","hist":"","id":176,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"29","label":"제29조(채권양도)","chapter":"","page":58,"part":"","text":"제29조 (채권양도) ①계약상대자는 이 공사의 이행을 위한 목적 이외의 목적으로 이 계약에 의하여 발생한 채권(공사대금청구권)을 제3자에게 양도하거나 질권을 설정하지 못한다.\n② 계약상대자가 채권 양도를 하고자 하는 경우에는 미리 연대보증인의 동의를 얻고 수협의 서면승인을 받아야 한다.","hist":"","id":177,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"30","label":"제30조(계약의 해제 또는 해지)","chapter":"","page":58,"part":"","text":"제30조 (계약의 해제 또는 해지) ① 수협은 계약상대자가 다음 각호의 1에 해당하는 경우에는 당해 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 다만, 제4호의 경우에는 해제 또는 해지하여야 한다.\n1. 정당한 이유 없이 약정한 착공기일을 경과하고도 공사에 착수하지 아니할 경우\n2. 준공일까지 공사를 완공하지 못하거나 계약상대자의 귀책사유로 준공기한까지 공사를 완공하지 못하거나 완공할 가능성이 없음이 명백하다고 인정될 경우\n3. 제26조의 규정에 위반하였을 경우\n4. 제18조의 규정에 의거 지체상금이 당해 계약의 계약보증금 상당액에 달한 경우로서 계약이행기간을 연장하여도 공사를 완공할 가능성이 없다고 판단될 경우\n5. 기타 계약조건을 위반하고 그 위반으로 인하여 계약의 목적을 달성할 수 없다고 인정될 경우\n6. 본회의 관련직원에게 대가성 향응 또는 금품제공을 한 것으로 판명되는 경우\n② 수협은 제1항 각호의 경우 이외에 객관적으로 명백한 수협측의 불가피한 사정으로 인하여 계약을 해제 또는 해지할 필요가 있다고 인정할 경우에는 필요한 조치를 취할 수 있다.\n③ 수협이 제1항 및 제2항의 규정에 의하여 계약을 해제 또는 해지한 경우에 기성부분 검사를 필한 공사를 기성부분으로 인수한 때에는 당해 부분에 상당하는 대가를 계약상대자에게 지급한다.\n④ 계약상대자는 계약상 기한 내에 공사를 완성할 수 없다고 인정될 때에는 지체 없이 수협에 통지하여야 한다.","hist":"","id":178,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"31","label":"제31조(연대보증인의 보증이행)","chapter":"","page":59,"part":"","text":"제31조 (연대보증인의 보증이행) ① 수협의 청구가 있을 때 연대보증인은 지체없이 그 보증의무를 이행하여야 한다.\n② 제1항의 보증의무를 이행한 연대보증인은 계속 공사에 있어서 계약상대자가 가지는 계약체결상의 이익을 가지며 계약금액중 보증이행 부분에 상당하는 금액을 수협에 직접 청구할 수 있는 권리를 가지며 계약상대자는 이에 상당하는 금액을 청구할 수 있는 권리를 상실한다.","hist":"","id":179,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"32","label":"제32조(기술, 지식의 이용 및 비밀엄수 의무)","chapter":"","page":59,"part":"","text":"제32조 (기술, 지식의 이용 및 비밀엄수 의무) ① 수협은 계약상대자가 제출하는 각종보고서, 정보, 기타 자료 및 이에 의하여 얻은 기술․지식의 전부 또는 일부를 수협의 이익을 위하여 복사, 이용 또는 공개할 수 있다.\n② 계약상대자는 당해 계약을 통하여 얻은 모든 정보 또는 수협의 기밀사항을 계약이행의 전후를 막론하고 외부에 누설할 수 없다.","hist":"","id":180,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"33","label":"제33조(부정당업자의 입찰참가 자격제한)","chapter":"","page":59,"part":"","text":"제33조 (부정당업자의 입찰참가 자격제한) 당해 계약에 대해 다음 각호의 부정당행위를 한 경우에는 1개월 이상 2년 이하의 범위 내에서 입찰자의 입찰참가자격을 제한할 수 있다. 단 제12호의 경우에는 그 기간을 1개월 이상 5년 이하로 한다.\n1. 부실시공 또는 부실설계를 한 자\n2. 「건설산업기본법」ㆍ「전기공사업법」ㆍ「정보통신공사업법」 그 밖에 다른 법령에 따른 하도급의 제한 규정에 위반(하도급 통지의무위반의 경우를 제외한다)하여 하도급한 자 및 본회의 승인없이 하도급을 하거나 본회의 승인을 얻은 하도급조건을 변경한 자\n3. 「독점규제 및 공정거래에 관한 법률」 또는 「하도급거래 공정화에 관한 법률」에 위반하여 공정거래위원회로부터 입찰참가자격제한 요청이 있는 자\n4. 계약을 이행함에 있어서 조잡 또는 부당하게 하거나 부정한 행위를 한 자 또는 조사 설계용역계약에 있어서 고의 또는 중대한 과실로 총사업비를 적정하게 산정하지 아니한 자\n5. 공사의 경우 안전대책을 소홀히 하여 공중에게 위해를 가한 자\n6. 정당한 이유없이 계약을 체결 또는 이행하지 아니한 자\n7. 입찰 또는 계약에 관한 서류를 위조ㆍ변조하거나 부정하게 행사한 자 또는 허위서류를 제출한 자\n8. 고의로 무효의 입찰을 한 자\n9. 입찰참가자격신청서 또는 입찰참가승낙서를 제출하고도 정당한 이유없이 당해 회계연도 중 3회이상 입찰에 참가하지 아니한 자\n10. 입찰참가를 방해하거나 낙찰자의 계약체결 또는 그 이행을 방해한 자\n11. 감독 또는 검사에 있어서 그 직무의 수행을 방해한 자\n12. 본회 청렴계약 이행사항을 위반한 자","hist":"","id":181,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"34","label":"제34조(국민건강보험료 등의 사후정산)","chapter":"","page":59,"part":"","text":"제34조(국민건강보험료 등의 사후정산) 수협은 국민건강보험료 등을 사후정산하기로 한 계약에 대하여는 대가 지급시 정부의 계약예규 「정부 입찰․계약 집행기준」에 따라 정산하여야 한다.","hist":"","id":182,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"35","label":"제35조(어구의 해석)","chapter":"","page":59,"part":"","text":"제35조(어구의 해석)이 조건 및 기타 계약문서상의 어구해석에 관하여 수협과 계약상대자간에 이견이 있을 때에는 협의에 의하여 해결하되 협의가 이루어지지 아니할 경우에는 일반관례에 따른다.","hist":"","id":183,"src":"contract"},{"doc":"annex4","docTitle":"별지 제4호 공사계약일반조건(안)","art":"36","label":"제36조(분쟁의 해결)","chapter":"","page":59,"part":"","text":"제36조(분쟁의 해결) ①계약의 수행중 계약당사자간에 발생하는 분쟁은 협의에 의하여 해결한다.\n②제1항에 의한 협의가 이루어지지 아니할 때에는 법원의 판결 또는 ｢중재법｣에 의한 중재에 의하여 해결한다.\n③계약상대자는 제1항부터 제2항까지의 분쟁처리절차 수행기간중 공사의 수행을 중지하여서는 아니된다.","hist":"","id":184,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"","label":"머리말","chapter":"","page":60,"part":"","text":"물품구매(제조)계약일반조건(안)","hist":"","id":185,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"1","label":"제1조(총칙)","chapter":"","page":60,"part":"","text":"제1조(총칙) 수협중앙회(이하 “수협”이라 한다)와 계약상대자는 물품구매표준계약서(이하 \"계약서\"라 한다)에 기재한 물품의 구매(\"제조\"를 포함한다. 이하 같다) 계약에 관하여 제3조에 의한 계약문서에서 정하는 바에 따라 신의와 성실의 원칙에 입각하여 이를 이행한다.","hist":"","id":186,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"2","label":"제2조(정의)","chapter":"","page":60,"part":"","text":"제2조(정의) 이 조건에서 사용하는 용어의 정의는 다음과 같다.\n1. \"계약상대자\"라 함은 수협과 물품구매계약을 체결한 자연인 또는 법인을 말한다.\n2. “규격서”라 함은 물품에 대한 기술적인 요구사항과 요구 필요조건의 일치성 여부를 판단하기 위한 절차와 방법을 포함하여 서술한 문서로, 제품의 성능, 재료형상, 치수, 용적, 색채, 제조, 포장 및 검사방법 등을 포함한다.","hist":"","id":187,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"3","label":"제3조(계약문서)","chapter":"","page":60,"part":"","text":"제3조(계약문서) ①계약문서는 계약서, 규격서, 유의서, 물품구매계약일반조건, 물품구매계약특수조건 등으로 구성되며 상호보완의 효력을 갖는다.\n②수협은 이 조건에서 정한 계약일반사항 외에 해당 계약의 적정한 이행을 위하여 필요한 경우 물품구매계약 특수조건을 정하여 계약을 체결할 수 있다.\n③이 조건이 정하는 바에 의하여 계약당사자간에 행한 통지문서등은 계약문서로서의 효력을 가진다.","hist":"","id":188,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"4","label":"제4조(사용언어)","chapter":"","page":60,"part":"","text":"제4조(사용언어) ①계약을 이행함에 있어서 사용하는 언어는 한국어를 원칙으로 한다.\n②수협은 계약체결시 제1항에도 불구하고 필요하다고 인정하는 경우에는 계약이행과 관련하여 계약상대자가 외국어를 사용하거나 외국어와 한국어를 병행하여 사용할 수 있도록 필요한 조치를 할 수 있다.\n③제2항에 의하여 외국어와 한국어를 병행하여 사용한 경우에 외국어로 기재된 사항이 한국어와 상이한 경우에는 한국어로 기재한 사항이 우선한다.","hist":"","id":189,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"5","label":"제5조(통지 등)","chapter":"","page":60,"part":"","text":"제5조(통지 등) ①구두에 의한 통지·신청·청구·요구·회신·승인 또는 지시 등(이하 \"통지 등\"이라 한다)은 문서로 보완되어야 효력이 있다.\n②통지 등의 장소는 계약서에 기재된 주소로 하며, 주소를 변경하는 경우에는 이를 즉시 계약당사자에게 통지하여야 한다.\n③통지 등의 효력은 계약문서에서 따로 정하는 경우를 제외하고는 계약당사자에게 도달한 날부터 발생한다. 이 경우 도달일이 공휴일인 경우에는 그 익일부터 효력이 발생한다.\n④계약상대자는 계약이행중 관계법령 및 이 조건 등에 정한 바에 따라 서면으로 정당한 요구를 받은 경우에는 이를 성실히 검토하여 회신하여야 한다.","hist":"","id":190,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"6","label":"제6조(계약보증금)","chapter":"","page":60,"part":"","text":"제6조(계약보증금) ①계약을 체결하고자 하는 자는 계약체결일까지 수협중앙회 「계약 규정」(이하 “계약 규정”이라 한다) 제61조에 따라 계약보증금을 납부하여야 한다.\n②계약을 체결하려고 하는 자가 계약보증금의 전부 또는 일부의 납부를 면제받은 경우에는 수협에 귀속사유가 발생할 때에 계약보증금에 해당하는 금액을 현금으로 납입할 것을 보장하기 위하여 그 지급을 확약하는 내용의 문서(이하 “계약보증금지급각서”라 한다)를 제출하여야 한다.\n③수협은 단가계약에 의하는 경우로서 수회에 걸쳐 분할하여 계약을 이행하게 하는 때에는 매회별 이행예정량중 최대량에 계약단가를 곱한 금액의 100분의 10 상당금액이상을 계약보증금으로 납부하게 할 수 있다.\n④계약상대자는 이 조건에 의하여 계약금액이 증액된 경우에는 이에 상응하는 금액의 계약보증금을 제1항에 따라 추가로 납부하여야 하며, 수협은 계약금액이 감액된 경우에는 이에 상응하는 금액의 계약보증금을 반환해야 한다.","hist":"","id":191,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"7","label":"제7조(계약보증금의 처리)","chapter":"","page":61,"part":"","text":"제7조(계약보증금의 처리) ①수협은 계약상대자가 정당한 이유없이 계약상의 의무를 이행하지 아니하거나 제22조제1항 각호에 해당하는 사유로 계약이 해제 또는 해지된 때에는 계약보증금을 수협에 귀속한다.\n②제6조제2항에 의하여 계약보증금지급각서를 제출한 경우로서 계약보증금의 귀속사유가 발생하여 수협의 납입요청이 있을 때에는 계약상대자는 해당 계약보증금을 지체없이 현금으로 납부하여야 한다.\n③계약상대자가 납부한 계약보증금은 계약이 이행된 후에 계약상대자의 청구에 의하여 반환한다.","hist":"","id":192,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"8","label":"제8조(계약이행상의 감독)","chapter":"","page":61,"part":"","text":"제8조(계약이행상의 감독) ①수협은 계약의 적정한 이행을 확보하기 위하여 필요하다고 인정하는 경우에는 물품의 제조를 위하여 사용하는 재료 및 기타 제조공정에 대하여 감독할 수 있으며 계약상대자에 대하여 필요한 조치를 요구할 수 있다.\n②계약상대자는 수협의 감독업무수행에 협력하여야 하며, 수협은 감독업무를 수행함에 있어서 계약상대자의 업무를 부당하게 방해하여서는 아니된다.","hist":"","id":193,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"9","label":"제9조(물가변동으로 인한 계약금액의 조정)","chapter":"","page":61,"part":"","text":"제9조(물가변동으로 인한 계약금액의 조정) ①물가변동으로 인한 계약금액의 조정은 계약 규정 제82조에서 정한 바에 의한다.\n②제1항에 의하여 계약금액을 증액하는 경우에는 계약상대자의 청구에 의하여야 하고, 계약상대자는 최종 대가 수령전까지 조정신청을 하여야 하며, 조정된 계약금액은 직전의 물가변동으로 인한 계약금액조정기준일부터 90일이내에 다시 조정할 수 없다. 다만, 천재․지변 또는 원자재의 가격급등으로 해당 기간내에 계약금액을 조정하지 아니하고는 계약이행이 곤란하다고 인정되는 경우에는 계약을 체결한 날 또는 직전 조정기준일로부터 90일 이내에도 계약금액을 조정할 수 있다.\n③수협은 계약상대자의 계약금액조정 청구내용이 일부 미비하거나 분명하지 아니한 경우에는 지체없이 필요한 보완요구를 하여야 한다. 다만, 계약상대자의 계약금액조정 청구내용이 계약금액 조정요건을 충족하지 않았거나 관련 증빙서류가 첨부되지 아니한 경우에는 그 사유를 명시하여 계약상대자에게 해당 청구서를 반송하여야 하며, 이 경우 계약상대자는 그 반송사유를 충족하여 계약금액조정을 다시 청구하여야 한다.","hist":"","id":194,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"10","label":"제10조(납품)","chapter":"","page":61,"part":"","text":"제10조(납품) ①계약상대자는 계약서에 정한 납품기일까지 해당물품(검사에 필요한 서류 등을 포함한다)을 수협이 지정한 장소에 납품하여야 한다.\n②제1항에 의하여 납품된 물품을 검사·수령하기까지 수협의 책임없는 사유로 인하여 발생된 물품의 망실·파손 등은 계약상대자의 부담으로 한다.\n③수협이 필요에 따라 분할납품을 요구하거나, 계약상 분할납품이 허용된 경우를 제외하고는 분할납품을 할 수 없다.","hist":"","id":195,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"11","label":"제11조(규격)","chapter":"","page":61,"part":"","text":"제11조(규격) ①모든 물품의 규격은 계약상 명시된 규격명세, 규격번호 등 수협이 제시한 견품의 규격을 충족하여야 하며, 구매목적에 맞는 신품이어야 한다.\n②계약상 규격이 명시되어 있지 아니한 경우에는 상관습과 기술적 타당성 및 구매규격 등에 부합하는 물품이어야 한다.\n③예비부속품으로서 기계·기구를 완성하는데 필요한 조립비는 물품가격에 포함되어 있는 것으로 간주한다. 다만, 계약에 부속품으로 기계, 기구를 완성하는데 필요한 조립비가 별도로 표시되어 있는 경우에는 그러하지 아니하다.","hist":"","id":196,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"12","label":"제12조(포장 및 품목표시)","chapter":"","page":61,"part":"","text":"제12조(포장 및 품목표시) ①포장은 계약조건과 계약규격서에 규정된 포장조건에 따라야 하며 내용물의 보전에 충분하여야 한다.\n②기계의 모체와 분리하여 부속품 또는 예비부속품을 포장할 때에는 관련 참조번호 및 기호 등을 명기한 꼬리표를 붙여야 한다.\n③계약상대자는 대한민국 외에서 제조된 계약물품을 납품하고자 할 때에는 관세청장이 고시한 원산지제도 운영에 관한 고시 및 산업통상자원부장관이 고시한 대외무역관리규정에 의하여 원산지를 해당 물품에 표시하여야 한다.","hist":"","id":197,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"13","label":"제13조(표기)","chapter":"","page":61,"part":"","text":"제13조(표기) 물품의 포장면 및 납품한 물품에는 계약조건에 따라 해당되는 사항을 명기하여야 한다.","hist":"","id":198,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"14","label":"제14조(사용 및 취급주의서)","chapter":"","page":62,"part":"","text":"제14조(사용 및 취급주의서) 계약상대자는 사용 및 취급상의 주의가 필요하다고 생각될 때에는 그 물품의 사용, 보관, 수리 등의 요령과 주의사항을 명기한 주의서를 제출하여야 한다.","hist":"","id":199,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"15","label":"제15조(검사)","chapter":"","page":62,"part":"","text":"제15조(검사) ①계약상대자는 계약이행을 완료한 때에는 그 사실을 서면으로 수협에게 통지하고 필요한 검사를 받아야 한다. 기납부분에 대하여 완납전에 대가의 전부 또는 일부를 지급하고자 할 때에도 또한 같다.\n②다음 각호의 1에 해당할 때에는 검사를 생략하고 검수만을 실시할 수 있다.\n1. K.S 표시품 일 때\n2. 공인검사기관의 검사합격품일 때\n3. 수입물품으로서 국제검정기관의 검사에 합격된 제품일 때\n③수협은 제1항의 통지를 받은 때에는 계약서 기타 관계서류에 의하여 통지를 받은 날부터 14일 이내에 그 이행을 확인하기 위한 검사를 하여야 한다. 다만, 부득이한 경우에는 그 검사기간을 연장할 수 있다.\n④수협은 제3항의 검사에 있어서 계약상대자의 계약이행 내용의 전부 또는 일부가 계약에 위반되거나 부당함을 발견한 때에는 필요한 시정조치를 할 수 있다. 이 경우에는 계약상대자로부터 그 시정을 완료한 사실을 통지받은 날로부터 제3항의 기간을 계산한다.\n⑤제3항에 따른 검사에 합격하지 못하여 계약이행기간이 연장될 때에는 수협은 지체상금을 부과할 수 있다.\n⑥계약상대자는 제3항에 의한 검사에 입회·협력하여야 한다. 계약상대자가 입회를 거부하거나 검사에 협력하지 아니함으로써 발생하는 지체에 대하여는 제4항 및 제5항을 준용한다.\n⑦계약상대자는 제3항 및 제4항에 의한 검사에 이의가 있을 때에는 재검사를 요청할 수 있다. 이 경우 수협은 지체없이 검사를 하여야 한다.\n⑧수협은 검사를 완료한 때에는 그 결과를 서면으로 계약상대자에게 통지하여야 한다.","hist":"","id":200,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"16","label":"제16조(특허권 등의 사용)","chapter":"","page":62,"part":"","text":"제16조(특허권 등의 사용) 계약상대자는 해당 계약의 이행에 제3자의 권리의 대상으로 되어 있는 특허권 등을 사용할 때에는 그 사용에 관한 일체의 책임을 져야 한다. 다만, 계약문서에 지정되지 않은 특허권 등의 사용을 수협이 요구한 경우에는 수협은 소요된 비용을 계약상대자에게 지급하여야 한다.","hist":"","id":201,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"17","label":"제17조(대가의 지급)","chapter":"","page":62,"part":"","text":"제17조(대가의 지급) ①계약상대자는 계약이행을 완료한 후 검사에 합격한 때에는 대가지급을 청구할 수 있다.\n②수협은 제1항에 따른 청구를 받은 때에는 그 청구를 받은 날로부터 5일(공휴일 및 토요일은 제외한다. 이하 이조에서 같다) 이내에 그 대가를 지급하여야 하며, 동 대가지급기한에도 불구하고 자금사정 등 불가피한 사유가 없는 한 최대한 신속히 대가를 지급하여야 한다. 다만, 계약상대자와의 합의에 의하여 대가의 지급기간을 연장할 수 있다.\n③수협은 기성부분 또는 기납부분에 대한 대가를 지급하는 경우에 제2항에도 불구하고 계약수량, 이행의 전망, 이행기간 등을 고려하여 30일마다 지급할 수 있다.\n④수협은 제1항 또는 제3항의 청구를 받은 후에 그 청구내용의 전부 또는 일부가 부당함을 발견한 때에는 그 사유를 명시하여 계약상대자에게 해당 청구서를 반송할 수 있다. 이 경우에는 반송한 날로부터 재청구를 받은 날까지의 기간은 제2항의 지급기간에 이를 산입하지 아니한다.","hist":"","id":202,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"18","label":"제18조(대가의 선급)","chapter":"","page":62,"part":"","text":"제18조(대가의 선급) ①수협은 다음 각 호의 요건을 충족하는 경우로서 계약상대자가 계약대가의 선금지급을 요청한 때에는 선금을 지급할 수 있다.\n1. 계약금액(단가계약의 경우에는 선금지급요청일 까지의 발주금액)이 3천만원 이상인 공사 또는 물품제조 계약과 5백만원 이상인 용역계약\n2. 본회로부터 입찰참가자격 제한을 받은 사실이 없거나 입찰참가자격 제한을 받고 당해 제한기간 만료후 동 제한기간 이상이 경과된 경우\n② 제1항에 따라 계약대가의 선금을 지급할 경우에는 계약금액에 대해 다음 각 호의 율에 해당하는 금액 이내에서 지급하여야 한다.\n1. 물품의 제조 및 용역\n가. 계약금액이 10억원 이상인 경우 : 100분의 30\n나. 계약금액이 3억원 이상 10억원 미만인 경우 : 100분의 40\n다. 계약금액이 3억원 미만인 경우 : 100분의 50\n③ 제1항 및 제2항의 경우에 기성부분 또는 기납부분에 대하여 대가를 지급한 때에는 계약금액(단가계약의 경우에는 발주금액)에서 그 대가를 공제한 금액을 기준으로 한다.\n④ 계약대가의 선금을 지급함에 있어 선금채권확보, 선금의 사용제한, 선금의 정산방법, 선금의 반환청구 등에 관하여 필요한 사항은 정부의 「계약예규」(\"정부 입찰․계약 집행기준“을 말한다)를 준용한다.","hist":"","id":203,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"19","label":"제19조(국민건강보험료 등의 사후정산)","chapter":"","page":63,"part":"","text":"제19조(국민건강보험료 등의 사후정산) 수협은 국민건강보험료 등을 사후정산하기로 한 계약에 대하여는 대가 지급시 정부의 계약예규 「정부 입찰․계약 집행기준」에 따라 정산하여야 한다.","hist":"","id":204,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"20","label":"제20조(지체상금)","chapter":"","page":63,"part":"","text":"제20조(지체상금) ①계약상대자는 계약서에서 정한 납품기한내에 물품을 납품하지 아니한 때에는 매 지체일수마다 계약서에서 정한 지체상금률을 계약금액에 곱하여 산출한 금액(이하 \"지체상금\"이라 한다)을 현금으로 납부하여야 한다.\n②수협은 제1항의 경우에 기납부분에 대한 검사를 거쳐 해당 부분을 인수(인수하지 아니하고 관리·사용하고 있는 경우를 포함한다. 이하 이조에서 같다)한 때에는 그 부분에 상당하는 금액을 계약금액에서 공제한다. 기납부분의 인수는 성질상 분할할 수 있는 물품에 대한 완성부분으로서 인수하는 것에 한한다.\n③수협은 계약의 이행지체가 본회의 사정 또는 천재지변, 그 밖에 불가항력적인 사유라고 인정되거나 선수물자사업을 위한 계약에 있어서 지도경제대표이사가 따로 정하는 바에 의하였을 경우, 그 밖에 지도경제대표이사가 부득이하다고 인정한 경우에는 그 해당일수에 대한 지체상금을 감면할 수 있다.","hist":"","id":205,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"21","label":"제21조(계약기간의 연장)","chapter":"","page":63,"part":"","text":"제21조(계약기간의 연장) ①계약상대자는 제20조제3항 중 어느 하나의 사유가 계약기간내에 발생한 경우에는 계약기간 종료전에 지체없이 서면으로 계약기간의 연장신청을 하여야 한다.\n②수협은 제1항에 의한 계약기간연장 신청이 접수된 때에는 즉시 그 사실을 조사 확인하고 계약이 적절히 이행될 수 있도록 계약기간의 연장 등 필요한 조치를 하여야 한다.\n③수협은 제1항의 연장청구를 승인하였을 경우에는 동 연장기간에 대하여는 지체상금을 부과하여서는 아니된다.\n④제2항에 의하여 계약기간을 연장한 경우에는 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위안에서 계약금액을 조정할 수 있다.","hist":"","id":206,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"22","label":"제22조(계약의 해제 또는 해지)","chapter":"","page":63,"part":"","text":"제22조(계약의 해제 또는 해지) ①수협은 계약상대자가 다음 각호의 어느 하나에 해당하는 경우에는 해당 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 다만, 제3호의 경우에는 계약상대자의 계약이행 가능성이 있고 계약을 유지할 필요가 있다고 인정되는 경우로서 계약상대자가 계약이행이 완료되지 아니한 부분에 상당하는 계약보증금(당초 계약보증금에 제20조 제1항에 따른 지체상금의 최대금액을 더한 금액을 한도로 한다)을 추가납부하는 때에는 계약을 유지한다.\n1. 계약서상의 납품기한(또는 연장된 납품기한)내에 계약상대자가 계약된 규격 등과 같은 물품납품을 거부하거나 완료하지 못한 때\n2. 계약상대자의 귀책사유로 인하여 납품기일내에 납품할 가능성이 없음이 명백하다고 인정될 경우\n3. 제20조에 의한 지체상금이 해당 계약의 계약보증금상당액에 달한 경우\n4. 계약의 수행중 뇌물수수 또는 정상적인 계약관리를 방해하는 불법․부정행위가 있는 경우\n5. 입찰에 관한 서류 등을 허위 또는 부정한 방법으로 제출하여 계약이 체결된 경우\n6. 기타 계약조건을 위반하고 그 위반으로 인하여 계약의 목적을 달성할 수 없다고 인정될 경우\n7. 본회의 관련직원에게 대가성 향응 또는 금품제공을 한 것으로 판명되는 경우\n②계약상대자는 제1항에 의하여 계약이 해제 또는 해지되는 경우에는 지급받은 선금에 대하여 미정산잔액이 있는 경우에는 그 잔액에 대한 약정이자상당액[사유발생 시점의 금융기관 대출평균금리(한국은행 통계월보상의 금융기관 대출평균금리를 말한다)에 의하여 산출한 금액]을 가산하여 수협에 상환하여야 한다.\n③수협은 제1항 각호의 경우 이외에 객관적으로 명백한 수협의 불가피한 사정으로 인하여 계약을 해제 또는 해지할 필요가 있다고 인정할 경우에는 필요한 조치를 취할 수 있다.\n④수협은 제1항 및 제3항의 규정에 의하여 계약을 해제 또는 해지한 경우 검사를 필한 용역을 기성부분으로서 인수한 때에는 당해 부분에 상당하는 대가를 계약상대자에게 지급한다.\n⑤수협은 제1항 및 제3항의 규정에 의하여 계약을 해제한 때에는 그 사실을 당해 계약상대자에게 통지한다.","hist":"","id":207,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"23","label":"제23조(기술지식의 이용 및 비밀엄수 의무)","chapter":"","page":64,"part":"","text":"제23조(기술지식의 이용 및 비밀엄수 의무) ① 수협은 사업목적 달성 또는 공공의 이익 등을 위해 필요하다고 인정되는 경우, 계약내용에 따라 계약상대자가 제출하는 각종 보고서, 정보, 기타 자료 및 이에 의하여 얻은 기술지식(계약목적물의 내용에 포함되는 경우는 제외한다. 이하 이 조에서 “기술지식 등”이라 한다)의 전부 또는 일부를 계약상대자의 승인을 얻어 복사, 이용 또는 공개할 수 있다.\n②계약상대자는 해당 계약을 통하여 얻은 정보 또는 수협의 기밀사항을 계약이행의 전후를 막론하고 외부에 누설할 수 없다.","hist":"","id":208,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"24","label":"제24조(부정당업자의 입찰참가 자격제한)","chapter":"","page":64,"part":"","text":"제24조 (부정당업자의 입찰참가 자격제한) 당해 계약에 대해 다음 각호의 부정당행위를 한 경우에는 1개월 이상 2년 이하의 범위 내에서 입찰자의 입찰참가자격을 제한할 수 있다. 단 제12호의 경우에는 그 기간을 1개월 이상 5년 이하로 한다.\n1. 부실시공 또는 부실설계를 한 자\n2. 「건설산업기본법」ㆍ「전기공사업법」ㆍ「정보통신공사업법」 그 밖에 다른 법령에 따른 하도급의 제한 규정에 위반(하도급 통지의무위반의 경우를 제외한다)하여 하도급한 자 및 본회의 승인없이 하도급을 하거나 본회의 승인을 얻은 하도급조건을 변경한 자\n3. 「독점규제 및 공정거래에 관한 법률」 또는 「하도급거래 공정화에 관한 법률」에 위반하여 공정거래위원회로부터 입찰참가자격제한 요청이 있는 자\n4. 계약을 이행함에 있어서 조잡 또는 부당하게 하거나 부정한 행위를 한 자 또는 조사 설계용역계약에 있어서 고의 또는 중대한 과실로 총사업비를 적정하게 산정하지 아니한 자\n5. 공사의 경우 안전대책을 소홀히 하여 공중에게 위해를 가한 자\n6. 정당한 이유없이 계약을 체결 또는 이행하지 아니한 자\n7. 입찰 또는 계약에 관한 서류를 위조ㆍ변조하거나 부정하게 행사한 자 또는 허위서류를 제출한 자\n8. 고의로 무효의 입찰을 한 자\n9. 입찰참가자격신청서 또는 입찰참가승낙서를 제출하고도 정당한 이유없이 당해 회계연도 중 3회이상 입찰에 참가하지 아니한 자\n10. 입찰참가를 방해하거나 낙찰자의 계약체결 또는 그 이행을 방해한 자\n11. 감독 또는 검사에 있어서 그 직무의 수행을 방해한 자\n12. 본회 청렴계약 이행사항을 위반한 자","hist":"","id":209,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"25","label":"제25조(어구의 해석)","chapter":"","page":64,"part":"","text":"제25조(어구의 해석)이 조건 및 기타 계약문서상의 어구해석에 관하여 수협과 계약상대자간에 이견이 있을 때에는 협의에 의하여 해결하되 협의가 이루어지지 아니할 경우에는 일반관례에 따른다.","hist":"","id":210,"src":"contract"},{"doc":"annex5","docTitle":"별지 제5호 물품구매(제조)계약일반조건(안)","art":"26","label":"제26조(분쟁의 해결)","chapter":"","page":64,"part":"","text":"제26조(분쟁의 해결) ①계약의 수행중 계약당사자간에 발생하는 분쟁은 협의에 의하여 해결한다.\n②제1항에 의한 협의가 이루어지지 아니할 때에는 법원의 판결 또는 ｢중재법｣에 의한 중재에 의하여 해결한다.\n③계약상대자는 제1항부터 제2항까지의 분쟁처리절차 수행기간중 물품계약의 수행을 중지하여서는 아니된다.","hist":"","id":211,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"","label":"머리말","chapter":"","page":64,"part":"","text":"용역계약일반조건(안)","hist":"","id":212,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"1","label":"제1조(목적)","chapter":"","page":65,"part":"","text":"제1조(목적) 이 문서는 계약당사자간에 이행하여야 할 용역에 관한 계약조건을 정함을 목적으로 하며, 계약당사자는 계약문서에 따라 신의와 성실의 원칙에 입각하여 계약을 이행하여야 한다.","hist":"","id":213,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"2","label":"제2조(정의)","chapter":"","page":65,"part":"","text":"제2조(정의) 이 장에서 사용하는 용어의 정의는 다음과 같다.\n1. \"계약상대자\"라 함은 수협중앙회(이하 “수협”이라 한다)와 용역계약을 체결한 자연인 또는 법인을 말한다.\n2. “기본업무”라 함은 계약상대자가 수행하여야 하는 업무로서 과업내용서에 기재된 업무를 말한다.\n3. “추가업무”라 함은 계약목적의 달성을 위해 기본업무 외에 수협이 추가하여 지시 또는 승인한 업무를 말한다.\n4. “특별업무”라 함은 계약목적외의 목적을 위해 계약특수조건 등에 특별업무항목으로 기재되거나 수협이 그 수행을 지시 또는 승인한 용역항목으로서 제2호 및 제3호에 속하지 아니하는 업무를 말한다.","hist":"","id":214,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"3","label":"제3조(계약문서)","chapter":"","page":65,"part":"","text":"제3조(계약문서) ①계약문서는 계약서, 유의서, 일반조건, 용역계약특수조건, 과업내용서 등으로 구성되며 상호보완의 효력을 가진다.\n②수협은 이 조건에 정한 계약일반사항외에 해당 계약의 적정한 이행을 위하여 필요한 경우 용역계약특수조건을 정하여 계약을 체결할 수 있다.\n③이 조건에서 정하는 바에 의하여 계약당사자간에 행한 통지문서등은 계약문서로서의 효력을 가진다.","hist":"","id":215,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"4","label":"제4조(사용언어)","chapter":"","page":65,"part":"","text":"제4조(사용언어) ①계약을 이행함에 있어서 사용하는 언어는 한국어를 원칙으로 한다.\n②수협은 계약체결시 제1항에도 불구하고 필요하다고 인정하는 경우에는 계약이행과 관련하여 계약상대자가 외국어를 사용하거나 외국어와 한국어를 병행하여 사용할 수 있도록 필요한 조치를 할 수 있다.\n③제2항에 의하여 외국어와 한국어를 병행하여 사용한 경우에 외국어로 기재된 사항이 한국어와 상이한 경우에는 한국어로 기재한 사항이 우선한다.","hist":"","id":216,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"5","label":"제5조(통지 등)","chapter":"","page":65,"part":"","text":"제5조(통지 등) ① 구두에 의한 통지·신청·청구·요구·회신·승인 또는 지시 등(이하 \"통지 등\"이라 한다)은 문서로 보완되어야 효력이 있다.\n②통지 등의 장소는 계약서에 기재된 주소로 하며, 주소를 변경하는 경우에는 이를 즉시 계약당사자에게 통지하여야 한다.\n③통지 등의 효력은 계약문서에서 따로 정하는 경우를 제외하고는 계약당사자에게 도달한 날부터 발생한다. 이 경우 도달일이 공휴일인 경우에는 그 익일부터 효력이 발생한다.\n④계약당사자는 계약이행중 이 조건 및 관계법령 등에서 정한 바에 따라 서면으로 정당한 요구를 받은 경우에는 이를 성실히 검토하여 회신하여야 한다.","hist":"","id":217,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"6","label":"제6조(계약보증금)","chapter":"","page":65,"part":"","text":"제6조(계약보증금) ①계약을 체결하고자 하는 자는 계약체결일까지 수협중앙회 「계약 규정」(이하 “계약 규정”이라 한다) 제61조에 따라 계약보증금을 납부하여야 한다.\n②계약을 체결하려고 하는 자가 계약보증금의 전부 또는 일부의 납부를 면제받은 경우에는 수협에 귀속사유가 발생할 때에 계약보증금에 해당하는 금액을 현금으로 납입할 것을 보장하기 위하여 그 지급을 확약하는 내용의 문서(이하 “계약보증금지급각서”라 한다)를 제출하여야 한다.\n③계약상대자는 이 조건에 의하여 계약금액이 증액된 경우에는 이에 상응하는 금액의 계약보증금을 제1항에 따라 추가로 납부하여야 하며, 수협은 계약금액이 감액된 경우에는 이에 상응하는 금액의 계약보증금을 반환해야 한다.","hist":"","id":218,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"7","label":"제7조(계약보증금의 처리)","chapter":"","page":65,"part":"","text":"제7조(계약보증금의 처리) ①수협은 계약상대자가 정당한 이유없이 계약상의 의무를 이행하지 아니하거나 제23조제1항 각호에 해당하는 사유로 계약이 해제 또는 해지된 때에는 계약보증금을 수협에 귀속한다.\n②제6조제2항에 의하여 계약보증금지급각서를 제출한 경우로서 계약보증금의 귀속사유가 발생하여 수협의 납입요청이 있을 때에는 계약상대자는 해당 계약보증금을 지체없이 현금으로 납부하여야 한다.\n③계약상대자가 납부한 계약보증금은 계약이 이행된 후에 계약상대자에게 지체없이 반환한다.","hist":"","id":219,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"8","label":"제8조(계약상대자의 근로자)","chapter":"","page":65,"part":"","text":"제8조(계약상대자의 근로자) ①계약상대자는 해당 계약의 수행에 필요한 기술과 경험을 가진 근로자를 채용하여야 하며 근로자의 행위에 대하여 책임을을 져야 한다. 다만, 계약상대자가 근로자의 관리·감독에 상당한 주의와 의무를 다한 경우에는 그러하지 아니하다.\n② 수협은 계약상대자가 채용한 근로자가 다음 각호의 사유에 해당한다고 판단될 경우 해당 근로자의 교체를 요청할 수 있다.\n1. 입찰공고 및 계약문서에서 특정한 기준을 갖춘 근로자를 배치할 것을 조건으로 명시한 계약에서 해당기준을 미달하는 근로자를 배치한 경우\n2. 고의 또는 중과실로 업무수행시 준수하여야 할 법령 또는 기준을 위반한 경우\n3. 뇌물·사기 등 부정행위를 한 경우\n4. 기타 제1호부터 제3호까지에 준하는 사유로서 계약의 적정성·공정성을 저해한 경우\n③계약상대자가 전항의 요청을 받은 경우 수협과 협의하여 해당 근로자의 교체여부를 결정하여야 한다.","hist":"","id":220,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"9","label":"제9조(계약이행상황의 감독)","chapter":"","page":66,"part":"","text":"제9조(계약이행상황의 감독) 수협은 해당 계약의 적정한 이행을 확보하기 위하여 필요하다고 인정할 때에는 감독할 수 있다. 다만, 전문적인 지식 또는 기술을 필요로 하거나 기타 부득이한 사유로 인하여 감독을 할 수 없는 경우에는 전문기관을 따로 지정하여 필요한 감독을 할 수 있다.","hist":"","id":221,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"10","label":"제10조(용역의 착수 및 보고)","chapter":"","page":66,"part":"","text":"제10조(용역의 착수 및 보고) ①계약상대자는 계약문서에서 정하는 바에 따라 용역을 착수하여야 하며, 수협이 정한 서류 및 다음 각 호의 사항이 포함된 착수신고서의 제출을 요구하는 경우에는 이를 제출하여야 한다.\n1. 용역공정예정표\n2. 인력 및 장비투입계획서\n3. 기타 수협이 지정한 사항\n②계약상대자는 계약의 이행중에 과업내용의 변경 등으로 인하여 제1항에 의하여 제출한 서류의 변경이 필요한 때에는 관련서류를 변경하여 제출하여야 한다.\n③수협은 제1항 및 제2항에 의하여 제출된 서류의 내용을 조정할 필요가 있다고 인정될 경우에는 계약상대자에게 이의 조정을 요구할 수 있다.\n④수협은 용역의 전부 또는 일부의 진행이 지연되어 소정의 기간내에 수행이 불가능하다고 인정되는 경우에는 주간공정현황을 제출토록 하는 등 계약상대자에게 필요한 조치를 할 수 있다.","hist":"","id":222,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"11","label":"제11조(물가변동으로 인한 계약금액의 조정)","chapter":"","page":66,"part":"","text":"제11조(물가변동으로 인한 계약금액의 조정) ①물가변동으로 인한 계약금액의 조정은 계약 규정 제82조에서 정한 바에 의한다.\n②제1항에 의하여 계약금액을 증액하는 경우에는 계약상대자의 청구에 의하여야 하고, 계약상대자는 최종 대가 수령전까지 조정신청을 하여야 하며, 조정된 계약금액은 직전의 물가변동으로 인한 계약금액조정기준일부터 90일이내에 다시 조정할 수 없다. 다만, 천재․지변 또는 원자재의 가격급등으로 해당 기간내에 계약금액을 조정하지 아니하고는 계약이행이 곤란하다고 인정되는 경우에는 계약을 체결한 날 또는 직전 조정기준일로부터 90일 이내에도 계약금액을 조정할 수 있다.\n③수협은 계약상대자의 계약금액조정 청구내용이 일부 미비하거나 분명하지 아니한 경우에는 지체없이 필요한 보완요구를 하여야 한다. 다만, 계약상대자의 계약금액조정 청구내용이 계약금액 조정요건을 충족하지 않았거나 관련 증빙서류가 첨부되지 아니한 경우에는 그 사유를 명시하여 계약상대자에게 해당 청구서를 반송하여야 하며, 이 경우 계약상대자는 그 반송사유를 충족하여 계약금액조정을 다시 청구하여야 한다.","hist":"","id":223,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"12","label":"제12조(과업내용의 변경)","chapter":"","page":66,"part":"","text":"제12조(과업내용의 변경) ①수협은 계약의 목적상 필요하다고 인정될 경우에는 다음 각호의 과업내용을 계약상대자에게 지시할 수 있다. 다만, 수협은 과업내용을 추가할 경우에는 계약상대자와 사전에 협의하여야 한다.\n1. 추가업무 및 특별업무의 수행\n2. 용역공정계획의 변경\n3. 특정용역항목의 삭제 또는 감소\n②제1항에 의한 과업내용의 변경은 그 변경이 필요한 부분의 이행 전에 완료하여야 한다. 다만, 수협은 계약이행의 지연으로 품질저하가 우려되는 등 긴급하게 용역을 수행하여야 할 필요가 있는 때에는 계약상대자와 협의하여 그 변경시기 등을 명확히 정하고, 과업내용의 변경을 완료하기 전에 우선 과업내용을 이행하게 할 수 있다.\n③계약상대자는 계약의 기본방침에 대한 변동없이 과업내용서상의 용역항목을 변경하는 것이 수협에 유리하다고 판단될 경우에는 제1항 각호에 해당하는 제안을 할 수 있다.","hist":"","id":224,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"13","label":"제13조(지체상금)","chapter":"","page":67,"part":"","text":"제13조(지체상금) ①계약상대자는 계약서에서 정한 용역수행기한내에 용역을 완성하지 아니한 때에는 매 지체일수마다 계약서에서 정한 지체상금률을 계약금액에 곱하여 산출한 금액(이하 “지체상금”이라 한다.)을 현금으로 납부하여야 한다.\n②수협은 제1항의 경우에 기성부분에 대한 검사를 거쳐 이를 인수한 때에는 그 부분에 상당하는 금액을 계약금액에서 공제한다. 이 경우 기성부분의 인수는 그 성질상 분할할 수 있는 용역에 대한 완성부분으로 인수하는 것에 한한다.\n③수협은 계약의 이행지체가 본회의 사정 또는 천재지변, 그 밖에 불가항력적인 사유라고 인정되거나 선수물자사업을 위한 계약에 있어서 지도경제대표이사가 따로 정하는 바에 의하였을 경우, 그 밖에 지도경제대표이사가 부득이하다고 인정한 경우에는 그 해당일수에 대한 지체상금을 감면할 수 있다.","hist":"","id":225,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"14","label":"제14조(계약기간의 연장)","chapter":"","page":67,"part":"","text":"제14조(계약기간의 연장) ①계약상대자는 제13조제3항 중 어느 하나의 사유가 계약기간내에 발생한 경우에는 계약기간 종료전에 지체없이 서면으로 계약기간의 연장신청을 하여야 한다.\n②수협은 제1항에 의한 계약기간연장 신청이 접수된 때에는 즉시 그 사실을 조사 확인하고 해당 용역이 적절히 이행될 수 있도록 계약기간의 연장 등 필요한 조치를 하여야 한다.\n③수협은 제1항의 연장청구를 승인하였을 경우에는 동 연장기간에 대하여는 지체상금을 부과하여서는 아니된다.\n④제2항에 의하여 계약기간을 연장한 경우에는 그 변경된 내용에 따라 실비를 초과하지 아니하는 범위안에서 계약금액을 조정할 수 있다.","hist":"","id":226,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"15","label":"제15조(검사)","chapter":"","page":67,"part":"","text":"제15조(검사) ①계약상대자는 용역을 완성하였을 때에는 그 사실을 수협에게 서면으로 통지하고 필요한 검사를 받아야 한다. 기성부분에 대하여 완성 전에 대가의 전부 또는 일부를 지급받고자 할 때에도 또한 같다.\n②수협은 제1항의 통지를 받은 때에는 계약서 기타 관계서류에 의하여 통지를 받은 날부터 14일 이내에 그 이행을 확인하기 위한 검사를 하여야 한다. 다만, 부득이한 경우에는 그 검사기간을 연장할 수 있다.\n③수협은 제2항의 검사에 있어서 계약상대자의 계약이행내용의 전부 또는 일부가 계약에 위반되거나 부당함을 발견한 때에는 필요한 시정조치를 하여야 한다. 이 경우에는 계약상대자로부터 그 시정을 완료한 사실을 통지받은 날로부터 제2항의 기간을 계산한다.\n④수협은 검사를 완료한 때에는 그 결과를 계약상대자에게 서면으로 통지하여야 한다. 이 경우 계약상대자는 검사에 대한 이의가 있을 때에는 재검사를 요청할 수 있으며 수협은 필요한 조치를 하여야 한다.","hist":"","id":227,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"16","label":"제16조(인수)","chapter":"","page":67,"part":"","text":"제16조(인수) ①수협은 해당 용역의 특성상 계약목적물의 인수가 필요한 경우에는 계약상대자가 서면으로 인수를 요청하였을 때에는 검사를 실시하여 용역의 완성을 확인하고, 계약상대자가 서면으로 인수를 요청하였을 때에는 즉시 해당 용역목적물을 인수하여야 한다.\n②수협은 계약상대자가 제1항의 요청을 아니한 때에는 용역대가의 지급과 동시에 해당 용역목적물의 인도를 요구할 수 있다. 이 경우에 계약상대자는 지체없이 해당 목적물을 인도하여야 한다.","hist":"","id":228,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"17","label":"제17조(기성부분의 인수)","chapter":"","page":67,"part":"","text":"제17조(기성부분의 인수) 수협은 전체 계약목적물이 아닌 기성부분(성질상 분할할 수 있는 용역의 완성부분에 한한다)에 대하여 이를 인수할 수 있다.","hist":"","id":229,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"18","label":"제18조(일반적 손해)","chapter":"","page":67,"part":"","text":"제18조(일반적 손해) ①계약상대자는 계약의 수행 중 용역목적물 및 제3자에 대한 손해를 부담하여야 한다. 다만, 그 손해가 계약상대자의 책임없는 사유로 인하여 발생한 경우에는 수협의 부담으로 한다.\n②수협이 인수한 계약목적물에 대한 손해는 수협이 부담하여야 한다.","hist":"","id":230,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"19","label":"제19조(기성대가의 지급)","chapter":"","page":67,"part":"","text":"제19조(기성대가의 지급) ①계약상대자는 최소한 30일마다 검사를 완료하는 날까지 기성부분에 대한 대가지급청구서를 수협에 제출할 수 있다.\n②수협은 검사완료일부터 5일이내에 검사된 내용에 따라 기성대가를 확정하여 계약상대자에게 지급하여야 한다. 다만, 계약상대자가 검사완료일후에 대가의 지급을 청구한 때에는 그 청구를 받은 날부터 5일이내에 지급하여야 한다.\n③수협은 제1항에 의한 청구서의 기재사항이 검사된 내용과 일치하지 아니할 때에는 그 사유를 명시하여 계약상대자에게 이의 시정을 요구하여야 한다. 이 경우 시정에 소요되는 기간은 제2항에서 규정한 기간에 산입하지 아니한다.","hist":"","id":231,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"20","label":"제20조(대가의 지급)","chapter":"","page":68,"part":"","text":"제20조(대가의 지급) ①계약상대자는 용역을 완성한 후 검사에 합격한 때에는 대가지급청구서를 제출하는 등 소정의 절차에 따라 대가지급을 청구할 수 있다.\n②제1항에 따른 대가지급은 검사 또는 검사조서 작성후 계약상대자의 청구를 받은 날부터 5일 이내에 이를 지급하여야 한다. 다만, 부득이한 사정이 있는 경우에는 당사자와 합의하여 일정기간동안 대가의 지급기한을 연장할 수 있다.","hist":"","id":232,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"21","label":"제21조(대가의 선급)","chapter":"","page":68,"part":"","text":"제21조(대가의 선급) ①수협은 다음 각 호의 요건을 충족하는 경우로서 계약상대자가 계약대가의 선금지급을 요청한 때에는 선금을 지급할 수 있다.\n1. 계약금액(단가계약의 경우에는 선금지급요청일 까지의 발주금액)이 3천만원 이상인 공사 또는 물품제조 계약과 5백만원 이상인 용역계약\n2. 본회로부터 입찰참가자격 제한을 받은 사실이 없거나 입찰참가자격 제한을 받고 당해 제한기간 만료후 동 제한기간 이상이 경과된 경우\n② 제1항에 따라 계약대가의 선금을 지급할 경우에는 계약금액에 대해 다음 각 호의 율에 해당하는 금액 이내에서 지급하여야 한다.\n1. 물품의 제조 및 용역\n가. 계약금액이 10억원 이상인 경우 : 100분의 30\n나. 계약금액이 3억원 이상 10억원 미만인 경우 : 100분의 40\n다. 계약금액이 3억원 미만인 경우 : 100분의 50\n③ 제1항 및 제2항의 경우에 기성부분 또는 기납부분에 대하여 대가를 지급한 때에는 계약금액(단가계약의 경우에는 발주금액)에서 그 대가를 공제한 금액을 기준으로 한다.\n④ 계약대가의 선금을 지급함에 있어 선금채권확보, 선금의 사용제한, 선금의 정산방법, 선금의 반환청구 등에 관하여 필요한 사항은 정부의 「계약예규」(\"정부 입찰․계약 집행기준“을 말한다)를 준용한다.","hist":"","id":233,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"22","label":"제22조(국민건강보험료 등의 사후정산)","chapter":"","page":68,"part":"","text":"제22조(국민건강보험료 등의 사후정산) 수협은 국민건강보험료 등을 사후정산하기로 한 계약에 대하여는 대가 지급시 정부의 계약예규 「정부 입찰․계약 집행기준」에 따라 정산하여야 한다.","hist":"","id":234,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"23","label":"제23조(계약의 해제 또는 해지)","chapter":"","page":68,"part":"","text":"제23조(계약의 해제 또는 해지) ①수협은 계약상대자가 다음 각호의 어느 하나에 해당하는 경우에는 해당 계약의 전부 또는 일부를 해제 또는 해지할 수 있다. 다만, 제3호의 경우에는 계약상대자의 계약이행 가능성이 있고 계약을 유지할 필요가 있다고 인정되는 경우로서 계약상대자가 계약이행이 완료되지 아니한 부분에 상당하는 계약보증금(당초 계약보증금에 제13조제1항에 따른 지체상금의 최대금액을 더한 금액을 한도로 한다)을 추가납부하는 때에는 계약을 유지한다.\n1. 정당한 이유없이 약정한 착수기일을 경과하고도 용역수행에 착수하지 아니할 경우\n2. 계약상대자의 귀책사유로 인하여 용역수행기한까지 해당 용역을 완료하지 못하거나 완료할 가능성이 없다고 인정될 경우\n3. 제13조에 의한 지체상금이 해당 계약의 계약보증금상당액에 달한 경우\n4. 계약의 수행중 뇌물수수 또는 정상적인 계약관리를 방해하는 불법․부정행위가 있는 경우\n5. 입찰에 관한 서류 등을 허위 또는 부정한 방법으로 제출하여 계약이 체결된 경우\n6. 기타 계약조건을 위반하고 그 위반으로 인하여 계약의 목적을 달성할 수 없다고 인정될 경우\n7. 본회의 관련직원에게 대가성 향응 또는 금품제공을 한 것으로 판명되는 경우\n②계약상대자는 제1항에 의하여 계약이 해제 또는 해지되는 경우에는 지급받은 선금에 대하여 미정산잔액이 있는 경우에는 그 잔액에 대한 약정이자상당액[사유발생 시점의 금융기관 대출평균금리(한국은행 통계월보상의 금융기관 대출평균금리를 말한다)에 의하여 산출한 금액]을 가산하여 수협에 상환하여야 한다.\n③수협은 제1항 각호의 경우 이외에 객관적으로 명백한 수협의 불가피한 사정으로 인하여 계약을 해제 또는 해지할 필요가 있다고 인정할 경우에는 필요한 조치를 취할 수 있다.\n④수협은 제1항 및 제3항의 규정에 의하여 계약을 해제 또는 해지한 경우 검사를 필한 용역을 기성부분으로서 인수한 때에는 당해 부분에 상당하는 대가를 계약상대자에게 지급한다.\n⑤수협은 제1항 및 제3항의 규정에 의하여 계약을 해제한 때에는 그 사실을 당해 계약상대자에게 통지한다.","hist":"","id":235,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"24","label":"제24조(용역의 일시정지)","chapter":"","page":69,"part":"","text":"제24조(용역의 일시정지) ① 수협은 다음 각호의 경우에는 용역의 전부 또는 일부의 수행을 정지시킬 수 있다. 이 경우 계약상대자는 정지기간중 선량한 관리자의 주의의무를 해태하여서는 아니된다.\n1. 용역의 수행이 계약내용과 일치하지 아니하는 경우\n2. 안전을 위해 용역의 전부 또는 일부의 정지가 필요한 경우\n3. 기타 수협의 필요에 의하여 지시한 경우\n②수협은 제1항에 의하여 용역을 정시시킨 경우에는 계약상대자에게 정지사유 및 정지기간을 지체없이 통지하여야 한다.","hist":"","id":236,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"25","label":"제25조(기술지식의 이용 및 비밀엄수 의무)","chapter":"","page":69,"part":"","text":"제25조(기술지식의 이용 및 비밀엄수 의무) ① 수협은 사업목적 달성 또는 공공의 이익 등을 위해 필요하다고 인정되는 경우, 계약내용에 따라 계약상대자가 제출하는 각종 보고서, 정보, 기타 자료 및 이에 의하여 얻은 기술지식(계약목적물의 내용에 포함되는 경우는 제외한다. 이하 이 조에서 “기술지식 등”이라 한다)의 전부 또는 일부를 계약상대자의 승인을 얻어 복사, 이용 또는 공개할 수 있다.\n②계약상대자는 해당 계약을 통하여 얻은 정보 또는 수협의 기밀사항을 계약이행의 전후를 막론하고 외부에 누설할 수 없다.\n③계약상대자는 용역을 수행함에 있어 발생한 제반 문제점 및 개선방안 등을 문서로 작성․비치하고, 수협의 요구가 있을 경우에는 이에 따라야 한다.","hist":"","id":237,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"26","label":"제26조(용역관련자료의 제출 등)","chapter":"","page":69,"part":"","text":"제26조(용역관련자료의 제출 등) 수협은 필요하다고 인정하는 경우 계약상대자에게 산출내역서의 기초가 되는 단가산출서 등의 제출을 요구할 수 있으며 이 경우 계약상대자는 이에 따라야 한다.","hist":"","id":238,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"27","label":"제27조(계약상대자의 의무)","chapter":"","page":69,"part":"","text":"제27조(계약상대자의 의무)①계약상대자는 제1조에서 규정한 목적을 달성하기 위하여 모든 지식과 기술을 활용하여 신의와 성실의 원칙에 입각하여 계약을 수행하여야 한다.\n②계약상대자는 용역수행 중 안전사고 예방에 노력하여야 하며 발생한 안전사고에 대하여 책임을 진다.","hist":"","id":239,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"28","label":"제28조(부정당업자의 입찰참가 자격제한)","chapter":"","page":69,"part":"","text":"제28조 (부정당업자의 입찰참가 자격제한) 당해 계약에 대해 다음 각호의 부정당행위를 한 경우에는 1개월 이상 2년 이하의 범위 내에서 입찰자의 입찰참가자격을 제한할 수 있다. 단 제12호의 경우에는 그 기간을 1개월 이상 5년 이하로 한다.\n1. 부실시공 또는 부실설계를 한 자\n2. 「건설산업기본법」ㆍ「전기공사업법」ㆍ「정보통신공사업법」 그 밖에 다른 법령에 따른 하도급의 제한 규정에 위반(하도급 통지의무위반의 경우를 제외한다)하여 하도급한 자 및 본회의 승인없이 하도급을 하거나 본회의 승인을 얻은 하도급조건을 변경한 자\n3. 「독점규제 및 공정거래에 관한 법률」 또는 「하도급거래 공정화에 관한 법률」에 위반하여 공정거래위원회로부터 입찰참가자격제한 요청이 있는 자\n4. 계약을 이행함에 있어서 조잡 또는 부당하게 하거나 부정한 행위를 한 자 또는 조사 설계용역계약에 있어서 고의 또는 중대한 과실로 총사업비를 적정하게 산정하지 아니한 자\n5. 공사의 경우 안전대책을 소홀히 하여 공중에게 위해를 가한 자\n6. 정당한 이유없이 계약을 체결 또는 이행하지 아니한 자\n7. 입찰 또는 계약에 관한 서류를 위조ㆍ변조하거나 부정하게 행사한 자 또는 허위서류를 제출한 자\n8. 고의로 무효의 입찰을 한 자\n9. 입찰참가자격신청서 또는 입찰참가승낙서를 제출하고도 정당한 이유없이 당해 회계연도 중 3회이상 입찰에 참가하지 아니한 자\n10. 입찰참가를 방해하거나 낙찰자의 계약체결 또는 그 이행을 방해한 자\n11. 감독 또는 검사에 있어서 그 직무의 수행을 방해한 자\n12. 본회 청렴계약 이행사항을 위반한 자","hist":"","id":240,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"29","label":"제29조(어구의 해석)","chapter":"","page":70,"part":"","text":"제29조(어구의 해석)이 조건 및 기타 계약문서상의 어구해석에 관하여 수협과 계약상대자간에 이견이 있을 때에는 협의에 의하여 해결하되 협의가 이루어지지 아니할 경우에는 일반관례에 따른다.","hist":"","id":241,"src":"contract"},{"doc":"annex6","docTitle":"별지 제6호 용역계약일반조건(안)","art":"30","label":"제30조(분쟁의 해결)","chapter":"","page":70,"part":"","text":"제30조(분쟁의 해결) ①계약의 수행중 계약당사자간에 발생하는 분쟁은 협의에 의하여 해결한다.\n②제1항에 의한 협의가 이루어지지 아니할 때에는 법원의 판결 또는 ｢중재법｣에 의한 중재에 의하여 해결한다.\n③계약상대자는 제1항부터 제2항까지의 분쟁처리절차 수행기간중 용역의 수행을 중지하여서는 아니된다.","hist":"","id":242,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"","label":"머리말","chapter":"","page":70,"part":"","text":"공사입찰유의서(안)","hist":"","id":243,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"1","label":"제1조(목적)","chapter":"","page":70,"part":"","text":"제1조(목적) 이 유의서는 수산업협동조합중앙회(이하 \"수협\"이라 한다)가 행하는 공사계약에 대한 입찰에서 해당 입찰에 참가하고자 하는 자가 유의하여야 할 사항을 정함을 목적으로 한다.","hist":"","id":244,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"2","label":"제2조(용어의 정의)","chapter":"","page":71,"part":"","text":"제2조(용어의 정의) 이 유의서에서 사용하는 용어의 정의는 이 유의서에서 따로 정하는 경우를 제외하고는 수협중앙회 「계약 규정」(이하 “계약 규정”이라 한다) 및 수협「공사계약일반조건」(이하 “일반조건”이라 한다)에 정하는 바에 의한다.","hist":"","id":245,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"3","label":"제3조(입찰참가신청)","chapter":"","page":71,"part":"","text":"제3조(입찰참가신청) ①입찰에 참가하고자 하는 자는 입찰공고 또는 입찰참가통지서에 기재된 입찰참가신청마감일까지 다음 각호의 서류를 제출하여 입찰참가 신청을 하여야 한다.\n1. 입찰참가신청서(수협 소정서식) 1통\n2. 해당 공사에 해당하는 면허수첩 또는 자격등록증 서류 1통\n3. 인감증명서 또는「본인서명사실 확인 등에 관한 법률」제2조제3호에 따른 본인서명사실확인서 1통\n4. 기타 공고 또는 통지로 요구하는 서류\n②제1항제2호의 경우에는 원본을 제시하거나 사본에 “원본과 같음”을 명기하고 인감(인감증명서상의 인감 또는 입찰참가신청서상의 사용인감)으로 날인(본인서명사실확인서를 제출한 경우는 서명)하여 제출하여야 한다.\n③공동계약이 허용된 경우에는 공동수급체를 구성하여 입찰에 참가하고자 하는 자는 공동수급협정서를 제1항 각호의 서류와 함께 제출하여야 한다.","hist":"","id":246,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"4","label":"제4조(입찰참가자격의 판단기준일)","chapter":"","page":71,"part":"","text":"제4조(입찰참가자격의 판단기준일) ①등록·시공능력·실적 등에 의한 입찰참가자격의 판단기준일은 입찰공고문에 따르며, 입찰참가자는 입찰서제출 마감일까지 해당 입찰참가자격을 계속 유지하여야 한다.\n②입찰참가자가 영업정지처분을 받은 경우에는 「건설산업기본법」등 관련법령에 의한 처리기준에 따라 입찰참가자격을 판단하고, 입찰참가자가 관련 법에 따른 입찰참가자격제한을 받은 경우에는 입찰참가등록마감일 전일까지 입찰참가자격제한기간이 만료되어야 입찰참가가 가능하다.\n③입찰전에 상호 또는 대표자의 변경(법인의 경우에는 법인 등기사항증명서를 기준으로 한다)이 있는 경우에는 변경신고를 한 후에 변경된 상호 또는 대표자 명의로 입찰에 참가하여야 한다.","hist":"","id":247,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"5","label":"제5조(입찰에 관한 서류)","chapter":"","page":71,"part":"","text":"제5조(입찰에 관한 서류) ①입찰에 참가하고자 하는 자는 다음 각호의 서류(이하 \"입찰관련서류\"라 한다)를 열람할 수 있다.\n1. 입찰공고문 또는 입찰참가통지서\n2. 공사입찰유의서\n3. 입찰참가신청서(소정서식)\n4. 입찰서(소정서식)\n5. 공사도급표준계약서(소정서식)\n6. 공사계약일반조건\n7. 공사계약특수조건\n8. 설계서(설계도면, 공사시방서 및 현장설명서를 말한다. 이하같다) 등\n9. 기타 참고사항을 기재한 서류\n②제1항의 설계서를 교부받은 자는 해당 입찰에 참가하거나 계약을 이행하는 용도 이외의 목적으로 설계서를 무단복제, 배포, 개작, 전송 등의 행위를 하여서는 아니된다.","hist":"","id":248,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"6","label":"제6조(관계 규정의 숙지)","chapter":"","page":71,"part":"","text":"제6조(관계 규정의 숙지) ①입찰에 참가하고자 하는 자는 입찰관련서류를 입찰전에 완전히 숙지하여야 하며 이를 숙지하지 못한 책임은 입찰참가자에게 있다.\n②입찰에 참가하고자 하는 자는 제1항에 의한 입찰관련서류의 검토과정에서 발견한 입찰에 관한 서류상의 착오, 누락사항 또는 기타 설명이 요구되는 사항에 대하여는 입찰서 제출마감일 전일까지 수협에 그 설명을 요구할 수 있다.","hist":"","id":249,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"7","label":"제7조(현장설명)","chapter":"","page":71,"part":"","text":"제7조(현장설명) 현장설명에 참가하고자 하는 자는 소정의 국가기술자격을 취득하거나 「건설기술진흥법」 등 관련법령에 의하여 해당 기술자로 인정되고 있는 자이어야 하며 국가기술자격수첩 또는 건설기술자 경력수첩을 제시하여야 한다. 다만, 「건설산업기본법 시행령」 제8조, 「전기공사업법 시행령」 제5조 및 「정보통신공사업법 시행령」 제4조에 의한 경미한 공사의 경우에는 그러하지 아니하다.","hist":"","id":250,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"8","label":"제8조(입찰보증금)","chapter":"","page":72,"part":"","text":"제8조(입찰보증금) ①입찰에 참가하고자 하는 자는 입찰신청마감일(공휴일인 때에는 전일)까지 입찰금액의 100분의 5 이상의 입찰보증금을 현금 또는 보증서 등으로 수협에 납부하여야 한다.\n②낙찰자가 정당한 이유없이 소정의 기한내에 계약을 체결하지 아니한 때에는 해당 입찰보증금을 수협에 귀속한다.\n③수협은 낙찰되지 아니한 입찰자의 입찰보증금을 낙찰자가 결정된 후에 즉시 반환한다. 다만, 낙찰자의 입찰보증금은 계약체결 후에 즉시 반환한다.\n④수협은 다음 각호의 어느 하나에 해당하는 경우에는 입찰보증금 납부를 면제할 수 있다.\n1. 계약 규정 제51조 제3항에서 정한 자가 입찰에 참가하는 경우 2.「건설산업기본법」·「전기공사업법」·「정보통신공사업법」 등의 법령에 따라 면허․허가 또는 인가 등을 받은 법인으로서 입찰신청마감일 현재 1년이상 해당 공사관련법령에 의한 사업을 영위하고 있는 자가 입찰에 참가하는 경우\n⑤보증서 등에 의한 입찰보증금의 보증기간은 다음 각호를 충족하여야 한다.\n1. 보증기간의 시작일 : 입찰서 제출마감일 이전일 것\n2. 보증기간의 만료일 : 입찰서 제출마감일 다음날부터 30일 이후일 것","hist":"","id":251,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"9","label":"제9조(입찰참가)","chapter":"","page":72,"part":"","text":"제9조(입찰참가) ①입찰참가신청을 한 자가 아니면 입찰에 참가할 수 없다.\n②입찰참가신청자가 입찰참가신청서 제출 시에 대리인을 지정한 경우에는 그 대리인도 입찰에 참가할 수 있다. 다만, 입찰참가신청서를 제출하는 때부터 입찰개시 시각전까지 입찰대리인을 지정하거나 입찰대리인을 변경하는 경우에는 그 대리인이 입찰에 참가할 수 있다.\n③제2항에 의한 대리인의 자격은 입찰참가자가 법인인 경우에는 해당 법인의 임·직원에 한하며, 수협은 재직증명서와 다음 각호의 자료에 의해서 임·직원 여부를 확인하여야 한다. 다만 2개 이상 법인의 임직원인 자는 1개 법인의 대리인으로만 입찰에 참가할 수 있다.\n1. 4대 보험 중 어느 하나의 가입 증명자료(최근 3개월 이내)\n2. 소속 법인에서 받은 급여와 관련하여 해당 법인에서 발급받은 소득세 납부 증명자료\n3. 법인 등기사항증명서\n4. 기타 임·직원 여부를 확인할 수 있는 자료\n④「국가를 당사자로 하는 계약에 관한 법률 시행령」제76조에 의한 부정당업자로 입찰참가자격을 제한받고 있는 자는 제2항에 의한 대리인을 할 수 없다.","hist":"","id":252,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"10","label":"제10조(입찰서의 작성)","chapter":"","page":72,"part":"","text":"제10조(입찰서의 작성) ①입찰자는 입찰서를 소정의 서식에 의하여 작성하여야 하며, 입찰자는 기명날인을 함에 있어 반드시 입찰자 성명(법인의 경우 대표자 성명)을 기재하고 입찰참가신청서 제출시 신고한 인감(서명을 포함한다. 이하 같다)으로 날인하여야 한다.\n②입찰자는 입찰서의 기재사항 중 삭제 또는 정정한 곳이 있을 때에는 입찰에 사용하는 인감으로 날인하여야 한다.\n③입찰자는 입찰서를 입찰공고 또는 입찰참가통지서 등에 별도로 규정한 경우를 제외하고는 한글로 작성하여야 하고, 입찰금액은 원화로 표기하여야 한다.\n④입찰자는 입찰서의 금액표시를 한글로 기재하여야 하며, 아라비아숫자로 병기할 수 있다. 이 경우에 한글로 기재된 금액과 차이가 있을 때에는 한글로 기재한 금액에 의한다. 다만, 전산서식에 의한 입찰의 경우에는 지정된 표기방법으로 기재하여야 한다.","hist":"","id":253,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"11","label":"제11조(입찰서의 제출)","chapter":"","page":72,"part":"","text":"제11조(입찰서의 제출) ①입찰자는 입찰서를 봉함하여 1인 1통만을 제출하여야 한다.\n②우편에 의한 입찰서는 입찰서 제출마감일전일까지 수협에 도착된 것에 한하여 효력이 있다. 이 경우에 우송중의 분실, 훼손 또는 지연에 대하여 수협은 책임을 지지 아니한다.\n③수협은 제2항에 의하여 우편으로 입찰서가 제출된 때에는 해당 입찰서의 봉투표면에 접수일시를 기재하고 확인인을 날인하여 개찰 시까지 개봉하지 아니하고 보관하여야 한다.\n④입찰자는 제출한 입찰서를 교환·변경 또는 취소할 수 없다. 다만, 입찰서에 기재한 중요부분에 오기가 있음을 이유로 개찰현장에서 입찰자가 입찰의 취소의사를 표시한 것으로서 수협이 이를 인정하는 경우에는 그러하지 아니하다.","hist":"","id":254,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"12","label":"제12조(청렴계약이행확약서의 제출)","chapter":"","page":72,"part":"","text":"제12조(청렴계약이행확약서의 제출) 입찰자는 입찰서를 제출할 때 수협에서 정한 청렴계약이행확약서를 같이 제출하여야 한다.","hist":"","id":255,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"13","label":"제13조(장기계속공사의 입찰)","chapter":"","page":73,"part":"","text":"제13조(장기계속공사의 입찰) 장기계속공사는 입찰 시 총공사를 대상으로 하여 입찰하여야 한다.","hist":"","id":256,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"14","label":"제14조(경쟁입찰의 성립)","chapter":"","page":73,"part":"","text":"제14조(경쟁입찰의 성립) 경쟁입찰은 2인이상의 유효한 입찰로써 성립한다.","hist":"","id":257,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"15","label":"제15조(입찰의 무효)","chapter":"","page":73,"part":"","text":"제15조(입찰의 무효) 다음 각 호의 1에 해당하는 경우에는 그 입찰은 무효로 한다.\n1. 입찰참가자격이 없는 자가 한 입찰\n2. 입찰보증금의 납부일시까지 소정의 입찰보증금을 납부하지 아니하고 한 입찰\n3. 입찰서의 도착일시까지 소정의 입찰장소에 도착하지 아니한 입찰\n4. 동일사항에 동일인이 2통 이상의 입찰서를 제출한 입찰\n5. 입찰 또는 개찰전에 미리 현장설명에 참가를 요하는 공사입찰에 있어서 당해 현장설명에 참가하지 아니한 자가 한 입찰\n6. 입찰조건 및 그 밖에 입찰유의서에 위반한 입찰\n7. 입찰보증금이 미달하는 입찰","hist":"","id":258,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"16","label":"제16조(입찰의 연기)","chapter":"","page":73,"part":"","text":"제16조(입찰의 연기) 수협은 다음 각호의 경우에 입찰공고 또는 입찰참가통지서에 기재된 현장설명일시 및 입찰서 제출마감일시를 연기할 수 있다.\n1. 제6조제2항에 의한 설명요구사항의 내용이 중대하여 연기가 불가피하다고 판단되는 경우\n2. 기타 불가피한 사유로 인하여 지정된 일시에 현장설명 또는 입찰을 실시하지 못하는 경우","hist":"","id":259,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"17","label":"제17조(재입찰 및 재공고입찰)","chapter":"","page":73,"part":"","text":"제17조(재입찰 및 재공고입찰) ①수협은 경쟁입찰에서 2인 이상의 유효한 입찰자가 없거나 낙찰자가 없는 경우에는 재입찰에 부칠 수 있다. 이 경우에는 최초 입찰에의 참가유무 또는 입찰횟수의 제한을 받지 아니한다.\n②입찰자나 낙찰자가 없는 경우 또는 낙찰자가 계약을 체결하지 아니하는 경우에는 재공고입찰에 부칠 수 있다.\n③제1항 및 제2항에 의하여 재입찰 또는 재공고입찰시 기한을 제외하고는 최초의 입찰에 부칠 때 정한 가격 및 기타조건을 변경할 수 없다.","hist":"","id":260,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"18","label":"제18조(낙찰자의 결정)","chapter":"","page":73,"part":"","text":"제18조(낙찰자의 결정) ①제15조에 해당되는 사유가 없는 자로서 수협이 정한 낙찰자결정기준에 적합한 자를 낙찰자로 한다.\n②수협은 개봉된 입찰서를 확인하고 유효한 입찰서의 입찰금액과 예정가격을 대조하여 지체없이 적격자를 낙찰자로 선정하여야 한다.\n③수협은 제1항 및 제2항에 의하여 낙찰자를 결정하기 전에 해당 입찰자의 입찰서, 법인 등기사항증명서(본사, 대표자 및 상호등 변경여부 확인), 공동수급표준협정서 등 관계서류를 검토하여 해당 낙찰예정자의 입찰이 제15조에 따른 무효입찰에 해당하는지의 여부를 확인하여야 한다.\n④수협은 낙찰이 될 수 있는 동일가격으로 입찰한 자가 2인이상인 때에는 즉시 추첨에 의하여 낙찰자를 결정하여야 한다. 다만, 계약 규정 제57조 제3항에 따른 적격심사 대상 공사의 경우, 적격심사기준에 의한 당해 계약이행능력 심사결과 최고점수인 자를 낙찰자로 결정하되, 계약이행능력 심사결과도 동일한 경우에는 추첨에 의하여 낙찰자를 결정한다.\n⑤제4항의 경우에 입찰자중 출석을 하지 아니한 자 또는 추첨을 하지 아니한 자가 있을 때에는 입찰사무에 관계없는 직원으로 하여금 추첨을 대신하게 할 수 있다.\n⑥희망수량경쟁입찰의 낙찰자 결정에 있어서 낙찰자가 될 동일가격의 입찰자가 2인이상 있을 때에는 입찰수량이 많은 자를 우선순위의 낙찰자로 하며, 입찰수량이 동일한 때에는 제1항 및 제2항에 준하여 추첨으로 낙찰자를 결정한다.\n⑦계약규정 제19조에 따른 전자자산처분시스템 또는 계약규정 제45조에 따른 전자조달시스템을 이용하는 입찰의 경우에는 해당 시스템에서 제공하는 추첨 프로그램을 이용할 수 있다.","hist":"","id":261,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"19","label":"제19조(계약의 체결)","chapter":"","page":73,"part":"","text":"제19조(계약의 체결) ①낙찰자는 수협으로부터 낙찰통지를 받은 후 소정의 기일내에 계약을 체결하여야 한다.\n②제1항에 의하여 수협과 계약을 체결하고자 하는 자는 관계법령에 의하여 필요한 관계서류를 제출하여야 한다.\n③수협은 낙찰자로 결정된 자가 정당한 이유없이 제1항에 의한 계약을 체결하지 아니한 때에는 낙찰을 취소할 수 있다.","hist":"","id":262,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"20","label":"제20조(계약의 성립)","chapter":"","page":74,"part":"","text":"제20조(계약의 성립) 수협과 낙찰자가 계약서에 기명·날인함으로써 계약은 확정된다.","hist":"","id":263,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"21","label":"제21조(계약보증금)","chapter":"","page":74,"part":"","text":"제21조(계약보증금) ①낙찰자는 계약체결일까지 계약 규정 제61조에 따라 계약보증금을 납부하여야 한다.\n②제8조에 의한 입찰보증금은 계약보증금으로 대체할 수 있다. 다만, 입찰보증금과 계약보증금과의 금액에 차이가 있는 경우에 그 차액을 추가로 납부하여야 한다.","hist":"","id":264,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"22","label":"제22조(부정당업자의 입찰참가자격 제한)","chapter":"","page":74,"part":"","text":"제22조(부정당업자의 입찰참가자격 제한) ①입찰자 또는 낙찰자가 계약 규정 제89조에 해당하는 경우에는 1월 이상 2년 이하의 범위 내에서 입찰참가자격 제한조치를 받게 된다.\n②낙찰자가 제21조제1항에 규정한 계약보증금 납부의무가 있는 경우 정당한 이유없이 기한내에 이를 납부하지 못하여 계약을 체결하지 못한 경우에도 제1항이 적용된다.","hist":"","id":265,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"23","label":"제23조(비밀유지의 의무)","chapter":"","page":74,"part":"","text":"제23조(비밀유지의 의무) 입찰자는 수협으로부터 배부받은 입찰에 관한 사유 또는 각종 자료 및 입찰과정에서 얻은 정보를 해당 입찰외의 목적으로 사용하여서는 아니된다.","hist":"","id":266,"src":"contract"},{"doc":"annex7","docTitle":"별지 제7호 공사입찰유의서(안)","art":"24","label":"제24조(기타사항)","chapter":"","page":74,"part":"","text":"제24조(기타사항) 이 유의서에 규정되지 아니한 사항에 대하여는 수협이 별도로 정하는 바에 의한다.","hist":"","id":267,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"","label":"머리말","chapter":"","page":74,"part":"","text":"물품구매(제조)입찰유의서(안)","hist":"","id":268,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"1","label":"제1조(목적)","chapter":"","page":74,"part":"","text":"제1조(목적) 이 유의서는 수산업협동조합중앙회(이하 \"수협\"이라 한다)가 행하는 물품의 구매·제조 및 기타 계약에 대한 입찰에서 해당 입찰에 참가하고자 하는 자가 유의해야 할 사항을 정함을 목적으로 한다.","hist":"","id":269,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"2","label":"제2조(용어의 정의)","chapter":"","page":74,"part":"","text":"제2조(용어의 정의) 이 유의서에서 사용하는 용어의 정의는 이 유의서에서 따로 정하는 경우를 제외하고는 수협중앙회 「계약 규정」(이하 “계약 규정”이라 한다) 및 수협중앙회 「물품구매(제조)계약일반조건」(이하 “일반조건”이라 한다)에 정하는 바에 의한다.","hist":"","id":270,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"3","label":"제3조(입찰참가신청)","chapter":"","page":75,"part":"","text":"제3조(입찰참가신청) ①입찰에 참가하고자 하는 자는 입찰공고 또는 입찰참가통지서에 기재된 입찰참가신청마감일까지 다음 각호의 서류를 수협에 제출하여 입찰참가신청을 하여야 한다.\n1. 입찰참가신청서(소정양식) 1통\n2. 입찰참가자격을 증명하는 서류 1통\n3. 인감증명서 또는「본인서명사실 확인 등에 관한 법률」제2조제3호에 따른 본인서명사실확인서 1통\n4. 기타 공고 또는 통지로 요구하는 서류\n②제1항제2호의 경우에는 원본을 제시하거나 사본에 \"원본과 같음\"을 명기하고 인감(인감증명서상의 인감 또는 입찰참가신청서상의 사용인감)으로 날인(본인서명사실확인서를 제출한 경우는 서명)하여 제출하여야 한다.","hist":"","id":271,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"4","label":"제4조(입찰참가자격의 판단기준일)","chapter":"","page":75,"part":"","text":"제4조(입찰참가자격의 판단기준일) ①등록·실적 등에 의한 입찰참가자격의 판단기준일은 입찰공고문에 따르며, 입찰참가자는 입찰참가등록마감일 이후 입찰서제출 마감일까지 해당 입찰참가자격을 계속 유지하여야 한다.\n②입찰참가자가 입찰참가자격제한을 받은 경우에는 입찰참가등록마감일 전일까지 입찰참가자격제한기간이 만료되어야 입찰에 참가할 수 있다.\n③입찰전에 상호 또는 대표자의 변경(법인의 경우에는 법인등기부를 기준으로 한다)이 있는 경우에는 변경신고를 한 후 변경된 상호 또는 대표자 명의로 입찰에 참가하여야 한다.","hist":"","id":272,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"5","label":"제5조(입찰에 관한 서류)","chapter":"","page":75,"part":"","text":"제5조(입찰에 관한 서류) 입찰에 참가하고자 하는 자는 다음 각호의 서류(이하 \"입찰에 관한 서류\"라 한다)를 열람할 수 있다.\n1. 입찰공고문 또는 입찰참가통지서\n2. 물품구매(제조)입찰유의서\n3. 입찰참가신청서(소정서식)\n4. 입찰서(소정서식)\n5. 물품구매(제조)표준계약서(소정서식)\n6. 물품구매(제조)계약일반조건\n7. 물품구매(제조)계약특수조건\n8. 기타 참고사항을 기재한 서류","hist":"","id":273,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"6","label":"제6조(관계 규정 등의 숙지)","chapter":"","page":75,"part":"","text":"제6조(관계 규정 등의 숙지) ①입찰에 참가하고자 하는 자는 입찰에 관한 서류를 입찰전에 완전히 숙지하여야 하며 이를 숙지하지 못한 책임은 입찰참가자에게 있다.\n②입찰에 참가하고자 하는 자는 제1항에 의한 입찰에 관한 서류의 검토과정에서 발견한 입찰에 관한 서류상의 착오, 누락사항 또는 기타 설명이 요구되는 사항에 대하여는 입찰서 제출마감일전일까지 수협에 그 설명을 요구할 수 있다.","hist":"","id":274,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"7","label":"제7조(입찰보증금)","chapter":"","page":75,"part":"","text":"제7조(입찰보증금) ①입찰에 참가하고자 하는 자는 입찰참가신청마감일(공휴일인 때에는 전일)까지 입찰금액의 100분의 5이상의 입찰보증금을 현금 또는 보증서 등으로 수협에 납부하여야 한다.\n②낙찰자가 정당한 이유없이 소정의 기한내에 계약을 체결하지 아니할 때에는 해당 입찰보증금은 수협에 귀속한다.\n③수협은 낙찰되지 아니한 입찰자의 입찰보증금을 낙찰자가 결정된 후 즉시 반환한다. 다만, 낙찰자의 입찰보증금은 계약체결 후 즉시 반환한다.\n④수협은 계약 규정 제51조 제3항에서 정한 자가 입찰에 참가하는 경우에는 입찰보증금 납부를 면제할 수 있다.\n⑤보증서 등에 의한 입찰보증금의 보증기간은 다음 각호를 충족하여야 한다.\n1. 보증기간의 시작일 : 입찰서 제출마감일 이전일 것\n2. 보증기간의 만료일 : 입찰서 제출마감일 다음날부터 30일 이후일 것","hist":"","id":275,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"8","label":"제8조(입찰참가)","chapter":"","page":75,"part":"","text":"제8조(입찰참가) ①입찰참가신청을 한 자가 아니면 입찰에 참가할 수 없다.\n②입찰참가신청자가 입찰참가신청서 제출 시에 대리인을 지정한 경우에는 그 대리인도 입찰에 참가할 수 있다. 다만, 입찰참가신청서를 제출하는 때부터 입찰개시 시각전까지 입찰대리인을 지정하거나 입찰대리인을 변경하는 경우에는 그 대리인이 입찰에 참가할 수 있다.\n③제2항에 의한 대리인의 자격은 입찰참가자가 법인인 경우에는 해당 법인의 임·직원에 한하며, 수협은 재직증명서와 다음 각 호의 자료에 의해서 임·직원 여부를 확인하여야 한다. 다만, 2개 이상 법인의 임·직원인 자는 1개 법인의 대리인으로만 입찰에 참가할 수 있다.\n1. 4대 보험 중 어느 하나 가입 증명자료(최근 3개월 이내)\n2. 소속 법인에서 받은 급여와 관련하여 해당 법인에서 발급받은 소득세 납부 증명자료\n3. 법인 등기사항증명서\n4. 기타 임·직원 여부를 확인할 수 있는 자료\n④「국가를 당사자로 하는 계약에 관한 법률 시행령」제76조에 의한 부정당업자로 입찰참가자격을 제한받고 있는 자는 제2항에 의한 대리인이 될 수 없다.","hist":"","id":276,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"9","label":"제9조(입찰서의 작성)","chapter":"","page":76,"part":"","text":"제9조(입찰서의 작성) ①입찰자는 입찰서를 소정의 서식에 의하여 작성하여야 하며, 입찰금액은 총액을 표기하여야 한다.\n②입찰자는 입찰서에 기명날인을 함에 있어 반드시 입찰자 성명(법인의 경우 대표자 성명)을 기재하고 입찰참가신청서 제출시 신고한 인감(서명을 포함한다. 이하 같다)으로 날인하여야 한다.\n③입찰자는 입찰서의 기재사항 중 삭제 또는 정정한 곳이 있을 때에는 입찰에 사용하는 인감으로 날인하여야 한다.\n④입찰자는 입찰서를 입찰공고 또는 입찰참가통지서 등에 별도로 규정한 경우를 제외하고는 한글로 작성하여야 하며 입찰금액은 원화로 표기하여야 한다.\n⑤입찰자는 입찰서의 금액표시를 한글로 기재하여야 하며, 아라비아숫자로 병기할 수 있다. 이 경우에 한글로 기재된 금액과 차이가 있을 때에는 한글로 기재한 금액에 의한다. 다만, 전산서식에 의한 입찰의 경우에는 지정된 표기방법으로 기재하여야 한다.","hist":"","id":277,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"10","label":"제10조(입찰서의 제출)","chapter":"","page":76,"part":"","text":"제10조(입찰서의 제출) ①입찰자는 입찰서를 봉함하여 1인 1통만 제출하여야 한다.\n②우편에 의한 입찰서는 입찰서 제출마감일전일까지 수협에 도착된 것에 한하여 효력이 있다. 이 경우에 우송중의 분실, 훼손 또는 지연에 대하여 수협은 책임을 지지 아니한다.\n③수협은 제2항에 의하여 우편으로 입찰서가 제출된 때에는 해당 입찰서의 봉투표면에 접수일시를 기재하고 확인인을 날인하여 개찰시까지 개봉하지 아니하고 보관하여야 한다.\n④입찰자는 제출한 입찰서를 교환, 변경 또는 취소할 수 없다. 다만, 입찰서에 기재한 중요부분에 오기가 있음을 이유로 개찰현장에서 입찰자가 입찰의 취소의사를 표시한 것으로서 수협이 이를 인정하는 경우에는 그러하지 아니하다.","hist":"","id":278,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"11","label":"제11조(청렴계약이행확약서의 제출)","chapter":"","page":76,"part":"","text":"제11조(청렴계약이행확약서의 제출) 입찰자는 입찰서를 제출할 때 수협에서 정한 청렴계약이행확약서를 같이 제출하여야 한다.","hist":"","id":279,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"12","label":"제12조(장기물품제조 등의 입찰)","chapter":"","page":76,"part":"","text":"제12조(장기물품제조 등의 입찰) 장기물품제조 등의 경우에는 입찰자는 입찰시 총물품제조 등을 대상으로하여 입찰하여야 한다.","hist":"","id":280,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"13","label":"제13조(경쟁입찰의 성립)","chapter":"","page":76,"part":"","text":"제13조(경쟁입찰의 성립) 경쟁입찰은 2인이상의 유효한 입찰로써 성립한다.","hist":"","id":281,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"14","label":"제14조(입찰의 무효)","chapter":"","page":76,"part":"","text":"제14조(입찰의 무효) 다음 각 호의 1에 해당하는 경우에는 그 입찰은 무효로 한다.\n1. 입찰참가자격이 없는 자가 한 입찰\n2. 입찰보증금의 납부일시까지 소정의 입찰보증금을 납부하지 아니하고 한 입찰\n3. 입찰서의 도착일시까지 소정의 입찰장소에 도착하지 아니한 입찰\n4. 동일사항에 동일인이 2통 이상의 입찰서를 제출한 입찰\n5. 입찰 또는 개찰전에 미리 현장설명에 참가를 요하는 입찰에 있어서 당해 현장설명에 참가하지 아니한 자가 한 입찰\n6. 입찰조건 및 그 밖에 입찰유의서에 위반한 입찰\n7. 입찰보증금이 미달하는 입찰","hist":"","id":282,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"15","label":"제15조(입찰의 연기)","chapter":"","page":77,"part":"","text":"제15조(입찰의 연기) 수협은 다음 각호의 경우에 입찰공고 또는 입찰참가통지서에 기재된 현장설명일시 및 입찰서 제출마감일시를 연기할 수 있다.\n1. 제6조제2항에 의한 설명요구사항의 내용이 중대하여 연기가 불가피하다고 판단되는 경우\n2. 기타 불가피한 사유로 인하여 지정된 일시에 현장설명 또는 입찰을 실시하지 못하는 경우","hist":"","id":283,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"16","label":"제16조(재입찰 및 재공고입찰)","chapter":"","page":77,"part":"","text":"제16조(재입찰 및 재공고입찰) ①수협은 경쟁입찰에서 2인 이상의 유효한 입찰자가 없거나 낙찰자가 없는 경우에는 재입찰에 부칠 수 있다. 이 경우에는 최초 입찰에의 참가유무 또는 입찰횟수의 제한을 받지 아니한다.\n②입찰자나 낙찰자가 없는 경우 또는 낙찰자가 계약을 체결하지 아니하는 경우에는 재공고입찰에 부칠 수 있다.\n③제1항 및 제2항에 의하여 재입찰 또는 재공고입찰시 기한을 제외하고는 최초의 입찰에 부칠 때 정한 가격 및 기타조건을 변경할 수 없다.","hist":"","id":284,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"17","label":"제17조(낙찰자의 결정)","chapter":"","page":77,"part":"","text":"제17조(낙찰자의 결정) ①제14조에 해당되는 사유가 없는 자로서 수협이 정한 낙찰자결정기준에 적합한 자를 낙찰자로 한다.\n②수협은 개봉된 입찰서를 확인하고 유효한 입찰서의 입찰금액과 예정가격을 대조하여 지체없이 적격자를 낙찰자로 선정하여야 한다.\n③수협은 제1항 및 제2항에 의하여 낙찰자를 결정하기 전에 해당 입찰자의 입찰서, 법인 등기사항증명서(본사, 대표자 및 상호등 변경여부 확인), 공동수급표준협정서 등 관계서류를 검토하여 해당 낙찰예정자의 입찰이 제14조에 따른 무효입찰에 해당되는지의 여부를 확인하여야 한다.\n④수협은 낙찰이 될 수 있는 동일가격으로 입찰한 자가 2인이상인 때에는 즉시 추첨에 의하여 낙찰자를 결정하여야 한다.\n⑤제4항의 경우에 입찰자중 출석을 하지 아니한 자 또는 추첨을 하지 아니한 자가 있을 때에는 입찰사무에 관계없는 직원으로 하여금 추첨을 대신하게 할 수 있다.\n⑥희망수량경쟁입찰의 낙찰자 결정에 있어서 낙찰자가 될 동일가격의 입찰자가 2인이상 있을 때에는 입찰수량이 많은 자를 우선순위의 낙찰자로 하며, 입찰수량이 동일한 때에는 제1항 및 제2항에 준하여 추첨으로 낙찰자를 결정한다.\n⑦계약규정 제19조에 따른 전자자산처분시스템 또는 계약규정 제45조에 따른 전자조달시스템을 이용하는 입찰의 경우에는 해당 시스템에서 제공하는 추첨 프로그램을 이용할 수 있다.","hist":"","id":285,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"18","label":"제18조(계약의 체결)","chapter":"","page":77,"part":"","text":"제18조(계약의 체결) ①낙찰자는 수협으로부터 낙찰통지를 받은 후 소정의 기일내에 계약을 체결하여야 한다.\n②제1항에 의하여 수협과 계약을 체결하고자 하는 자는 관계법령에 의하여 필요한 관계서류를 제출하여야 한다.\n③수협은 낙찰자로 결정된 자가 정당한 이유없이 제1항에 의한 계약을 체결하지 아니한 때에는 낙찰을 취소할 수 있다.","hist":"","id":286,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"19","label":"제19조(계약의 성립)","chapter":"","page":77,"part":"","text":"제19조(계약의 성립) 수협과 낙찰자가 계약서에 기명·날인함으로써 계약은 확정된다.","hist":"","id":287,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"20","label":"제20조(계약보증금)","chapter":"","page":77,"part":"","text":"제20조(계약보증금) ①낙찰자는 계약체결일까지 계약 규정 제61조에 따라 계약보증금을 납부하여야 한다.\n②제7조에 의한 입찰보증금은 계약보증금으로 대체할 수 있다. 다만, 입찰보증금과 계약보증금과의 금액에 차이가 있는 경우에 그 차액을 추가로 납부하여야 한다.","hist":"","id":288,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"21","label":"제21조(부정당업자의 입찰참가자격제한)","chapter":"","page":77,"part":"","text":"제21조(부정당업자의 입찰참가자격제한) ①입찰자 또는 낙찰자가 계약 규정 제89조에 해당하는 경우에는 1월 이상 2년 이하의 범위 내에서 입찰참가자격 제한조치를 받게 된다.\n②낙찰자가 제20조제1항에 규정한 계약보증금 납부의무가 있는 경우 정당한 이유없이 기한내에 이를 납부하지 못하여 계약을 체결하지 못한 경우에도 제1항이 적용된다.","hist":"","id":289,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"22","label":"제22조(비밀유지의 의무)","chapter":"","page":77,"part":"","text":"제22조(비밀유지의 의무) 입찰자는 수협으로부터 배부받은 입찰에 관한 서류 또는 각종 자료 및 입찰과정에서 얻은 정보를 해당 입찰 이외의 목적으로 사용하여서는 아니된다.","hist":"","id":290,"src":"contract"},{"doc":"annex8","docTitle":"별지 제8호 물품구매(제조)입찰유의서(안)","art":"23","label":"제23조(기타사항)","chapter":"","page":77,"part":"","text":"제23조(기타사항) 이 유의서에 규정되지 아니한 사항에 대하여는 수협이 별도로 정하는 바에 의한다.","hist":"","id":291,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"","label":"머리말","chapter":"","page":78,"part":"","text":"용역입찰유의서 (안)","hist":"","id":292,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"1","label":"제1조(목적)","chapter":"","page":78,"part":"","text":"제1조(목적) 이 유의서는 수산업협동조합중앙회(이하 \"수협\"이라 한다)가 행하는 용역계약에 대한 입찰에서 해당 입찰에 참가하고자 하는 자가 유의하여야 사항을 정함을 목적으로 한다.","hist":"","id":293,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"2","label":"제2조(용어의 정의)","chapter":"","page":78,"part":"","text":"제2조(용어의 정의) 이 유의서에서 사용하는 용어의 정의는 이 유의서에서 따로 정하는 경우를 제외하고는 수협중앙회 「계약 규정」(이하 “계약 규정”이라 한다) 및 수협중앙회 「용역계약일반조건」(이하 “일반조건”이라 한다)에 정하는 바에 의한다.","hist":"","id":294,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"3","label":"제3조(입찰참가신청)","chapter":"","page":78,"part":"","text":"제3조(입찰참가신청) ①입찰에 참가하고자 하는 자는 입찰공고 또는 입찰참가통지서에 기재된 입찰참가신청마감일까지 다음 각호의 서류를 수협에 제출하여 입찰참가 신청을 하여야 한다.\n1. 입찰참가신청서(소정양식) 1통\n2. 입찰참가자격을 증명하는 사본 1통\n3. 인감증명서 또는「본인서명사실 확인 등에 관한 법률」제2조제3호에 따른 본인서명사실확인서 1통\n4. 기타 공고 또는 통지로 요구하는 서류\n②제1항제2호의 경우에는 원본을 제시하거나 사본에 \"원본과 같음\"을 명기하고 인감(인감증명서상의 인감 또는 입찰참가신청서상의 사용인감)으로 날인(본인서명사실확인서를 제출한 경우는 서명)하여 제출하여야 한다.\n③공동계약이 허용된 경우에는 공동수급체를 구성하여 입찰에 참가하고자 하는 자는 공동수급협정서를 제1항 각호의 서류와 함께 제출하여야 한다.","hist":"","id":295,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"4","label":"제4조(입찰참가자격의 판단기준일)","chapter":"","page":79,"part":"","text":"제4조(입찰참가자격의 판단기준일) ①등록·실적 등에 의한 입찰참가자격의 판단기준일은 입찰공고문에 따르며, 입찰참가자는 입찰참가등록마감일 이후 입찰서제출 마감일까지 해당 입찰참가자격을 계속 유지하여야 한다.\n②입찰참가자가 입찰참가자격제한을 받은 경우에는 입찰참가등록마감일 전일까지 입찰참가자격제한기간이 만료되어야 입찰에 참가할 수 있다.\n③입찰전에 상호 또는 대표자의 변경(법인의 경우에는 법인등기부를 기준으로 한다)이 있는 경우에는 변경신고를 한 후 변경된 상호 또는 대표자 명의로 입찰에 참가하여야 한다.","hist":"","id":296,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"5","label":"제5조(입찰에 관한 서류)","chapter":"","page":79,"part":"","text":"제5조(입찰에 관한 서류) 입찰에 참가하고자 하는 자는 다음 각호의 서류(이하 \"입찰에 관한 서류\"라 한다)를 열람할 수 있다.\n1. 입찰공고문 또는 입찰참가통지서\n2. 용역입찰유의서\n3. 입찰참가신청서(소정서식)\n4. 입찰서(소정서식)\n5. 용역표준계약서(소정서식)\n6. 용역계약일반조건\n7. 용역계약특수조건\n8. 과업내용서\n9. 기타 참고사항을 기재한 서류","hist":"","id":297,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"6","label":"제6조(관계 규정 등의 숙지)","chapter":"","page":79,"part":"","text":"제6조(관계 규정 등의 숙지) ①입찰에 참가하고자 하는 자는 입찰에 관한 서류를 입찰전에 완전히 숙지하여야 하며 이를 숙지하지 못한 책임은 입찰참가자에게 있다.\n②입찰에 참가하고자 하는 자는 제1항에 의한 입찰에 관한 서류의 검토과정에서 발견한 입찰에 관한 서류상의 착오, 누락사항 또는 기타 설명이 요구되는 사항에 대하여는 입찰서 제출마감일전일까지 수협에 그 설명을 요구할 수 있다.","hist":"","id":298,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"7","label":"제7조(입찰보증금)","chapter":"","page":79,"part":"","text":"제7조(입찰보증금) ①입찰에 참가하고자 하는 자는 입찰참가신청마감일(공휴일인 때에는 전일)까지 입찰금액의 100분의 5이상의 입찰보증금을 현금 또는 보증서 등으로 수협에 납부하여야 한다.\n②낙찰자가 정당한 이유없이 소정의 기한내에 계약을 체결하지 아니할 때에는 해당 입찰보증금은 수협에 귀속한다.\n③수협은 낙찰되지 아니한 입찰자의 입찰보증금을 낙찰자가 결정된 후 즉시 반환한다. 다만, 낙찰자의 입찰보증금은 계약체결 후 즉시 반환한다.\n④수협은 다음 각호의 어느 하나에 해당하는 경우에는 입찰보증금 납부를 면제할 수 있다.\n1. 계약 규정 제51조 제3항에서 정한 자가 입찰에 참가하는 경우\n2. 법령에 따라 면허․허가 또는 인가 등을 받은 법인으로서 입찰신청마감일 현재 1년이상 해당 관련법령에 의한 사업을 영위하고 있는 자가 입찰에 참가하는 경우\n⑤보증서 등에 의한 입찰보증금의 보증기간은 다음 각호를 충족하여야 한다.\n1. 보증기간의 시작일 : 입찰서 제출마감일 이전일 것\n2. 보증기간의 만료일 : 입찰서 제출마감일 다음날부터 30일 이후일 것","hist":"","id":299,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"8","label":"제8조(입찰참가)","chapter":"","page":79,"part":"","text":"제8조(입찰참가) ①입찰참가신청을 한 자가 아니면 입찰에 참가할 수 없다.\n②입찰참가신청자가 입찰참가신청서 제출 시에 대리인을 지정한 경우에는 그 대리인도 입찰에 참가할 수 있다. 다만, 입찰참가신청서를 제출하는 때부터 입찰개시 시각전까지 입찰대리인을 지정하거나 입찰대리인을 변경하는 경우에는 그 대리인이 입찰에 참가할 수 있다.\n③제2항에 의한 대리인의 자격은 입찰참가자가 법인인 경우에는 해당 법인의 임·직원에 한하며, 수협은 재직증명서와 다음 각 호의 자료에 의해서 임·직원 여부를 확인하여야 한다. 다만, 2개 이상 법인의 임·직원인 자는 1개 법인의 대리인으로만 입찰에 참가할 수 있다.\n1. 4대 보험 중 어느 하나 가입 증명자료(최근 3개월 이내)\n2. 소속 법인에서 받은 급여와 관련하여 해당 법인에서 발급받은 소득세 납부 증명자료\n3. 법인 등기사항증명서\n4. 기타 임·직원 여부를 확인할 수 있는 자료\n④「국가를 당사자로 하는 계약에 관한 법률 시행령」제76조에 의한 부정당업자로 입찰참가자격을 제한받고 있는 자는 제2항에 의한 대리인이 될 수 없다.","hist":"","id":300,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"9","label":"제9조(입찰서의 작성)","chapter":"","page":80,"part":"","text":"제9조(입찰서의 작성) ①입찰자는 입찰서를 소정의 서식에 의하여 작성하여야 하며, 입찰금액은 총액을 표기하여야 한다.\n②입찰자는 입찰서에 기명날인을 함에 있어 반드시 입찰자 성명(법인의 경우 대표자 성명)을 기재하고 입찰참가신청서 제출시 신고한 인감(서명을 포함한다. 이하 같다)으로 날인하여야 한다.\n③입찰자는 입찰서의 기재사항 중 삭제 또는 정정한 곳이 있을 때에는 입찰에 사용하는 인감으로 날인하여야 한다.\n④입찰자는 입찰서를 입찰공고 또는 입찰참가통지서 등에 별도로 규정한 경우를 제외하고는 한글로 작성하여야 하며 입찰금액은 원화로 표기하여야 한다.\n⑤입찰자는 입찰서의 금액표시를 한글로 기재하여야 하며, 아라비아숫자로 병기할 수 있다. 이 경우에 한글로 기재된 금액과 차이가 있을 때에는 한글로 기재한 금액에 의한다. 다만, 전산서식에 의한 입찰의 경우에는 지정된 표기방법으로 기재하여야 한다.","hist":"","id":301,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"10","label":"제10조(입찰서의 제출)","chapter":"","page":80,"part":"","text":"제10조(입찰서의 제출) ①입찰자는 입찰서를 봉함하여 1인 1통만 제출하여야 한다.\n②우편에 의한 입찰서는 입찰서 제출마감일전일까지 수협에 도착된 것에 한하여 효력이 있다. 이 경우에 우송중의 분실, 훼손 또는 지연에 대하여 수협은 책임을 지지 아니한다.\n③수협은 제2항에 의하여 우편으로 입찰서가 제출된 때에는 해당 입찰서의 봉투표면에 접수일시를 기재하고 확인인을 날인하여 개찰시까지 개봉하지 아니하고 보관하여야 한다.\n④입찰자는 제출한 입찰서를 교환, 변경 또는 취소할 수 없다. 다만, 입찰서에 기재한 중요부분에 오기가 있음을 이유로 개찰현장에서 입찰자가 입찰의 취소의사를 표시한 것으로서 수협이 이를 인정하는 경우에는 그러하지 아니하다.","hist":"","id":302,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"11","label":"제11조(청렴계약이행확약서의 제출)","chapter":"","page":80,"part":"","text":"제11조(청렴계약이행확약서의 제출) 입찰자는 입찰서를 제출할 때 수협에서 정한 청렴계약이행확약서를 같이 제출하여야 한다.","hist":"","id":303,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"12","label":"제12조(장기계속기술용역의 입찰)","chapter":"","page":80,"part":"","text":"제12조(장기계속기술용역의 입찰) 장기계속용역의 경우에는 입찰자는 입찰시 총용역을 대상으로하여 입찰하여야 한다.","hist":"","id":304,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"13","label":"제13조(경쟁입찰의 성립)","chapter":"","page":80,"part":"","text":"제13조(경쟁입찰의 성립) 경쟁입찰은 2인이상의 유효한 입찰로써 성립한다.","hist":"","id":305,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"14","label":"제14조(입찰의 무효)","chapter":"","page":80,"part":"","text":"제14조(입찰의 무효) 다음 각 호의 1에 해당하는 경우에는 그 입찰은 무효로 한다.\n1. 입찰참가자격이 없는 자가 한 입찰\n2. 입찰보증금의 납부일시까지 소정의 입찰보증금을 납부하지 아니하고 한 입찰\n3. 입찰서의 도착일시까지 소정의 입찰장소에 도착하지 아니한 입찰\n4. 동일사항에 동일인이 2통 이상의 입찰서를 제출한 입찰\n5. 입찰 또는 개찰전에 미리 현장설명에 참가를 요하는 입찰에 있어서 당해 현장설명에 참가하지 아니한 자가 한 입찰\n6. 입찰조건 및 그 밖에 입찰유의서에 위반한 입찰\n7. 입찰보증금이 미달하는 입찰","hist":"","id":306,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"15","label":"제15조(입찰의 연기)","chapter":"","page":81,"part":"","text":"제15조(입찰의 연기) 수협은 다음 각호의 경우에 입찰공고 또는 입찰참가통지서에 기재된 현장설명일시 및 입찰서 제출마감일시를 연기할 수 있다.\n1. 제6조제2항에 의한 설명요구사항의 내용이 중대하여 연기가 불가피하다고 판단되는 경우\n2. 기타 불가피한 사유로 인하여 지정된 일시에 현장설명 또는 입찰을 실시하지 못하는 경우","hist":"","id":307,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"16","label":"제16조(재입찰 및 재공고입찰)","chapter":"","page":81,"part":"","text":"제16조(재입찰 및 재공고입찰) ①수협은 경쟁입찰에서 2인 이상의 유효한 입찰자가 없거나 낙찰자가 없는 경우에는 재입찰에 부칠 수 있다. 이 경우에는 최초 입찰에의 참가유무 또는 입찰횟수의 제한을 받지 아니한다.\n②입찰자나 낙찰자가 없는 경우 또는 낙찰자가 계약을 체결하지 아니하는 경우에는 재공고입찰에 부칠 수 있다.\n③제1항 및 제2항에 의하여 재입찰 또는 재공고입찰시 기한을 제외하고는 최초의 입찰에 부칠 때 정한 가격 및 기타조건을 변경할 수 없다.","hist":"","id":308,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"17","label":"제17조(낙찰자의 결정)","chapter":"","page":81,"part":"","text":"제17조(낙찰자의 결정) ①제14조에 해당되는 사유가 없는 자로서 수협이 정한 낙찰자결정기준에 적합한 자를 낙찰자로 한다.\n②수협은 개봉된 입찰서를 확인하고 유효한 입찰서의 입찰금액과 예정가격을 대조하여 지체없이 적격자를 낙찰자로 선정하여야 한다.\n③수협은 제1항 및 제2항에 의하여 낙찰자를 결정하기 전에 해당 입찰자의 입찰서, 법인 등기사항증명서(본사, 대표자 및 상호등 변경여부 확인), 공동수급표준협정서 등 관계서류를 검토하여 해당 낙찰예정자의 입찰이 제14조에 따른 무효입찰에 해당되는지의 여부를 확인하여야 한다.\n④수협은 낙찰이 될 수 있는 동일가격으로 입찰한 자가 2인이상인 때에는 즉시 추첨에 의하여 낙찰자를 결정하여야 한다.\n⑤제4항의 경우에 입찰자중 출석을 하지 아니한 자 또는 추첨을 하지 아니한 자가 있을 때에는 입찰사무에 관계없는 직원으로 하여금 추첨을 대신하게 할 수 있다.\n⑥희망수량경쟁입찰의 낙찰자 결정에 있어서 낙찰자가 될 동일가격의 입찰자가 2인이상 있을 때에는 입찰수량이 많은 자를 우선순위의 낙찰자로 하며, 입찰수량이 동일한 때에는 제1항 및 제2항에 준하여 추첨으로 낙찰자를 결정한다.\n⑦계약규정 제19조에 따른 전자자산처분시스템 또는 계약규정 제45조에 따른 전자조달시스템을 이용하는 입찰의 경우에는 해당 시스템에서 제공하는 추첨 프로그램을 이용할 수 있다.","hist":"","id":309,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"18","label":"제18조(계약의 체결)","chapter":"","page":81,"part":"","text":"제18조(계약의 체결) ①낙찰자는 수협으로부터 낙찰통지를 받은 후 소정의 기일내에 계약을 체결하여야 한다.\n②제1항에 의하여 수협과 계약을 체결하고자 하는 자는 관계법령에 의하여 필요한 관계서류를 제출하여야 한다.\n③수협은 낙찰자로 결정된 자가 정당한 이유없이 제1항에 의한 계약을 체결하지 아니한 때에는 낙찰을 취소할 수 있다.","hist":"","id":310,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"19","label":"제19조(계약의 성립)","chapter":"","page":81,"part":"","text":"제19조(계약의 성립) 수협과 낙찰자가 계약서에 기명·날인함으로써 계약은 확정된다.","hist":"","id":311,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"20","label":"제20조(계약보증금)","chapter":"","page":81,"part":"","text":"제20조(계약보증금) ①낙찰자는 계약체결일까지 계약 규정 제61조에 따라 계약보증금을 납부하여야 한다.\n②제7조에 의한 입찰보증금은 계약보증금으로 대체할 수 있다. 다만, 입찰보증금과 계약보증금과의 금액에 차이가 있는 경우에 그 차액을 추가로 납부하여야 한다.","hist":"","id":312,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"21","label":"제21조(부정당업자의 입찰참가자격제한)","chapter":"","page":81,"part":"","text":"제21조(부정당업자의 입찰참가자격제한) ①입찰자 또는 낙찰자가 계약 규정 제89조에 해당하는 경우에는 1월 이상 2년 이하의 범위 내에서 입찰참가자격 제한조치를 받게 된다.\n②낙찰자가 제20조제1항에 규정한 계약보증금 납부의무가 있는 경우 정당한 이유없이 기한내에 이를 납부하지 못하여 계약을 체결하지 못한 경우에도 제1항이 적용된다.","hist":"","id":313,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"22","label":"제22조(비밀유지의 의무)","chapter":"","page":81,"part":"","text":"제22조(비밀유지의 의무) 입찰자는 수협으로부터 배부받은 입찰에 관한 서류 또는 각종 자료 및 입찰과정에서 얻은 정보를 해당 입찰 이외의 목적으로 사용하여서는 아니된다.","hist":"","id":314,"src":"contract"},{"doc":"annex9","docTitle":"별지 제9호 용역입찰유의서(안)","art":"23","label":"제23조(기타사항)","chapter":"","page":82,"part":"","text":"제23조(기타사항) 이 유의서에 규정되지 아니한 사항에 대하여는 수협이 별도로 정하는 바에 의한다.","hist":"","id":315,"src":"contract"},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"1","label":"제1조(목적)","chapter":"","page":1,"part":"","text":"제1조(목적) 이 요령은 「계약규정」 제59조의 2에 따라서 협상에 의한 계약체결에 필요한 기준 및 절차를 정함을 목적으로 한다.","hist":"\u003c개정 2016. 5.30>","src":"nego","id":316},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"2","label":"제2조(정의)","chapter":"","page":1,"part":"","text":"제2조(정의) 이 요령에서 사용하는 용어의 정의는 다음과 같다.\n① “제안요청서”라 함은 계약담당자가 협상에 의한 계약을 체결하고자 할 때 입찰에 참가하고자 하는 자에게 제안서의 제출을 요청하기 위하여 교부하는 서류를 말한다.\n② “제안서”라 함은 협상에 의한 계약에 의한 입찰에 참가하고자 하는 자가 제안요청서 또는 입찰공고에 따라 작성하여 계약담당자에게 제출하는 서류를 말한다.\n③ “협상적격자”라 함은 제안서의 평가결과 협상에 의한 계약의 협상대상자가 될 수 있는 자격을 갖춘 자를 말한다.\n④ “협상대상자”라 함은 협상적격자로서 협상순위에 따라 계약담당자가 제안서 내용을 대상으로 협상하는 자를 말한다.","hist":"","src":"nego","id":317},{"doc":"nego","docTitle":"협상에 의한 계약 요령","art":"3","label":"제3조(적용범위)","chapter":"","page":1,"part":"","text":"제3조(적용범위) 이 요령에 적용할 수 있는 계약대상은 다음 각 호의 1과 같다. 다만, 관련기기의 구매 내지 설치가 소요되는 경우에는 이를 포함한다.\n1. 전산시스템 구축 및 소프트웨어 개발용역\n2. 성과물 제작용역(기록영화제작, EVENT, 디자인개발 용역 등)\n3. 학술연구, 외부회계감사, 경영진단, 임직원 복리후생 및 교육관련 용역 등 특별한 기술
